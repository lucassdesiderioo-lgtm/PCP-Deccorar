<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta de Venda</title>
<style>
  :root{--bg:#ffffff;--panel:#f4f6f8;--line:#d8dee6;--txt:#1a1d23;--muted:#5a6472;--amber:#b26a00;--green:#2e7d32;--red:#c62828;--blue:#1565c0}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .link{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  .banner{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:26px;margin-bottom:16px}
  .banner.cfm{background:#e8f0fb;border-color:#a9c9ee}.banner.ok{background:#e7f5eb;border-color:#a9d8b4}.banner.err{background:#fbe9e8;border-color:#efb1ad}.banner.warn{background:#fbf1db;border-color:#e7cb8c}
  .bt{font-size:26px;font-weight:750}.bs{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.5}.bs b{color:var(--txt)}
  .sku{font-family:ui-monospace,monospace;background:#edf0f4;border:1px solid var(--line);padding:2px 8px;border-radius:6px}
  .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:14px;padding:12px 18px}
  .primary{background:var(--amber);color:#1a1300}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  #scan{display:block;width:100%;max-width:520px;margin:0 auto 14px;padding:14px;font-size:17px;font-family:ui-monospace,monospace;text-align:center;letter-spacing:1px;background:#f4f6f8;border:2px solid #d8dee6;border-radius:12px;color:#1a1d23}#scan:focus{outline:none;border-color:#b26a00}
  .stats{display:flex;gap:12px;margin-bottom:8px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .n{font-size:28px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase}
  .stat.pend .n{color:var(--amber)}.stat.emb .n{color:var(--green)}
  .up{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .uphd{width:100%;text-align:left;background:var(--panel);color:var(--txt);border:0;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .upbody{padding:14px 16px}
  .drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:#fff;cursor:pointer;color:var(--muted);font-size:14px}
  .drop:hover{border-color:var(--amber)}
  .upres{margin-top:10px;font-size:13px;color:var(--muted)}.upres b{color:var(--txt)}
  .peca{font-size:30px;font-weight:800;color:var(--txt);line-height:1.25;margin:2px 0 12px;letter-spacing:-.5px}
  .peca.falta{font-size:17px;color:var(--red);font-weight:700}
  .card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
  .ttl{font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sel,.busca{font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
  .busca{width:100%;margin-bottom:6px}
  .imp{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .imp:last-child{border-bottom:0}
  .imp .who{flex:1;min-width:0}
  .imp .nome{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .imp .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .imp .meta b{color:var(--txt);font-family:ui-monospace,monospace}
  .tag{display:inline-block;background:#fbf1db;border:1px solid #e7cb8c;color:#7a5200;border-radius:20px;padding:1px 9px;font-size:11px;font-weight:700;margin-left:6px}
  .tagU{display:inline-block;background:var(--amber);color:#fff;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;margin-left:6px;letter-spacing:.4px}
  .imp.ultima{background:#fff8e6;border:1px solid #e7cb8c;border-radius:12px;padding:12px;margin-bottom:6px}
  .rebt{background:#edf0f4;color:var(--txt);border:1px solid var(--line);padding:10px 16px;font-size:14px;white-space:nowrap}
  .rebt.forte{background:var(--amber);color:#fff;border-color:#8f5500;font-weight:800}
  .rebt:disabled{opacity:.5;cursor:default}
  .vazio{color:var(--muted);font-size:14px}
  iframe{position:fixed;left:-9999px;width:0;height:0;border:0}
</style></head><body>
<header><div class="mark">B</div><div><h1>Etiqueta de Venda</h1><div class="sub">Bipe o SKU · confira · bipe de novo pra imprimir</div></div>
<a class="link" href="/painel">Painel</a></header>
<div class="wrap">
  <div class="stats">
    <div class="stat pend"><div class="n" id="nPend">0</div><div class="l">Pendentes</div></div>
    <div class="stat emb"><div class="n" id="nEmb">0</div><div class="l">Embaladas hoje</div></div>
  </div>
  <div class="up" id="upBox" style="display:none">
    <button class="uphd" id="upTgl" type="button">📄 Subir PDF do Mercado Livre (vendas do dia) ▾</button>
    <div class="upbody" id="upBody" style="display:none">
      <label class="drop" for="file">Clique ou solte um ou mais PDFs do Mercado Livre aqui<input type="file" id="file" accept="application/pdf" multiple style="display:none"></label>
      <div class="upres" id="upRes"></div>
    </div>
  </div>
  <div class="banner" id="banner"></div>
  <input id="scan" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="bipe aqui">
<div class="card" style="margin-top:16px"><div class="ttl">Faltam imprimir</div><div id="pendLista"></div></div>
<div class="card" id="futBox" style="margin-top:16px;display:none;border-left:4px solid #7aa3d8"></div>
  <div class="card" style="margin-top:16px">
    <div class="ttl">
      <span>Já impressos — reimprimir</span>
      <select class="sel" id="impDias"><option value="1">hoje</option><option value="2">2 dias</option><option value="7">7 dias</option><option value="30">30 dias</option></select>
      <span id="impQtd" style="margin-left:auto"></span>
    </div>
    <input class="busca" id="impBusca" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="buscar por cliente, NF ou SKU">
    <div id="impLista"></div>
  </div></div>
<iframe id="pr"></iframe>
<!-- antes do bloco de baixo: e dele que vem pecaTexto -->
<script src="/sku.js"></script>
<script>
const $=s=>document.querySelector(s);
let confirmar=null, last={c:null,t:0};
var emIdle=false;
function banner(kind,title,sub,acts){ emIdle=false; $('#banner').className='banner '+(kind||''); $('#banner').innerHTML='<div class="bt">'+title+'</div><div class="bs">'+(sub||'')+'</div>'+(acts?'<div class="acts">'+acts+'</div>':''); }
// Parada da tela: além do "Pronto", mostra a ÚLTIMA impressão com o botão de
// reimprimir do lado. É o atalho pro caso que motivou tudo isso — o papel
// prendeu na etiqueta que acabou de sair e ninguém quer procurar na lista.
function idle(){
  confirmar=null;
  var u=(impCache||[])[0];   // var hoisted: no primeiro idle() a lista ainda nem carregou
  if(!u){ banner('','Pronto','Bipe o SKU da embalagem pra puxar a próxima venda.'); emIdle=true; return; }
  banner('','Pronto','Bipe o SKU da embalagem pra puxar a próxima venda.'
    +'<br><b>Última impressão:</b> '+esc(u.buyer||'—')+' · NF <b>'+esc(u.nf||'—')+'</b>'
    +' · <span class="sku">'+esc(u.codigo||'')+'</span> · '+horaDe(u.embalado_em),
    '<button class="rebt forte" onclick="reimprimir('+u.id+',this)">🖨 Reimprimir a última</button>');
  emIdle=true;
}
/* O QUE A PECA E, em cima de tudo e em letra grande.
   O leitor le a etiqueta, nunca a persiana. Se a peca dentro da caixa nao for o
   que a etiqueta diz, nenhum bipe percebe — nem o do SKU, nem o do kit, nem o do
   carregamento. Estes quatro campos sao a unica conferencia possivel contra
   isso: o operador olha a peca aberta na bancada e olha a tela. Por isso vem
   ANTES do cliente, e nao rodape de detalhe. */
function pecaHtml(p){
  if(!p) return '';
  // pecaTexto vem do /sku.js — mesmo formatador da tela de Embalagem.
  var t=(typeof pecaTexto==='function') ? pecaTexto(p) : '';
  if(!t) return '<div class="peca falta">⚠ Sem medida e cor no cadastro — não dá pra conferir a peça</div>';
  return '<div class="peca">'+esc(t)+'</div>';
}
async function stats(){
  const d=await (await fetch('/api/lote')).json();
  $('#nPend').textContent=d.filter(x=>x.estagio==='pendente').length;
  $('#nEmb').textContent=d.filter(x=>x.estagio==='embalado').length;
}
async function scanSku(sku){
  sku=(sku||'').trim().toUpperCase(); if(!sku) return;
  const now=Date.now(); if(last.c===sku && now-last.t<700) return; last={c:sku,t:now};
  // 2º bip do mesmo SKU = confirma
  if(confirmar && confirmar.codigo && confirmar.codigo.toUpperCase()===sku){ imprimir(); return; }
  const r=await (await fetch('/api/proximo/'+encodeURIComponent(sku))).json();
  if(!r.cadastrado){ banner('err','SKU não cadastrado', '<span class="sku">'+sku+'</span> — cadastre no Admin.'); beep(false); confirmar=null; return; }
  // Sob medida nao tem estoque por definicao: a peca e feita contra o pedido.
  // Zero ali e o normal, e barrar aqui empurrava a bancada a imprimir a
  // etiqueta pelo PDF do ML e despachar por fora do sistema.
  if(!r.sob_medida && r.estoque!==null && r.estoque<=0){ banner('err','SEM ESTOQUE — bloqueado', '<span class="sku">'+sku+'</span> não passou pela produção. Não dá pra imprimir a venda.'); beep(false); confirmar=null; return; }
  // Sem pedido agora significa mesmo NENHUM: a busca já inclui as vendas futuras.
  if(!r.pedido){ if(r.total>0){ banner('warn','Todas embaladas', 'Todas as vendas de <span class="sku">'+sku+'</span> já foram embaladas.'); } else { banner('err','SKU não está no lote', 'Nenhuma venda de <span class="sku">'+sku+'</span> — nem pra hoje, nem pra frente. Já subiu o PDF do Mercado Livre?'); } beep(false); confirmar=null; return; }
  confirmar=r.pedido;
  // ADIANTANDO: a venda existe e a peça está na prateleira, mas a entrega não é
  // de hoje. Precisa ser inconfundível — se passar por urgente, o operador gasta
  // peça que amanhã pode faltar pra quem tem prazo curto. Por isso o aviso vem
  // ANTES de tudo, na cor do modo estoque, e diz a data por extenso.
  var adiant = r.adiantado ? '<div style="background:#e8f0fb;border:2px solid #7aa3d8;border-radius:8px;'
      +'padding:8px 10px;margin-bottom:8px;font-weight:700;color:#1f4b82">'
      +'ADIANTANDO — só despacha em '+dataBR(r.pedido.despachar_em)
      +'<div style="font-weight:400;font-size:13px;margin-top:2px">Não precisa sair hoje. '
      +'Vale se tiver peça sobrando na prateleira.</div></div>' : '';
  banner(r.adiantado?'warn':'cfm','Confira: '+esc(r.pedido.buyer), adiant+pecaHtml(r.peca)
    +'NF <b>'+esc(r.pedido.nf||'—')+'</b> · '+esc(r.pedido.city||'')+' · <span class="sku">'+esc(sku)+'</span><br>'
    +(r.sob_medida ? 'SOB MEDIDA — sem estoque, peça feita pro pedido'
                   : 'Estoque: '+r.estoque)
    +' · pra hoje: '+r.pendentes+(r.futuros?' · pra depois: '+r.futuros:'')
    +'<br><b>Bipe de novo</b> ou clique pra imprimir a etiqueta de venda.',
    '<button class="primary" onclick="imprimir()">Imprimir etiqueta de venda</button><button class="ghost" onclick="idle()">Cancelar</button>');
  beep(true);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Manda o PDF (etiqueta + DANFE) pra impressora. Mesma porta pra impressao e
// reimpressao: quem decide se e a primeira vez ou nao e quem chama.
function mandarPraImpressora(id){
  const fr=$('#pr');
  fr.onload=()=>{ try{fr.contentWindow.print();}catch(e){ window.open('/api/print/'+id,'_blank'); } };
  fr.src='/api/print/'+id;
}
async function imprimir(){
  const o=confirmar; if(!o) return; confirmar=null;
  try{
    const r=await (await fetch('/api/embalar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:o.id})})).json();
    if(r.erro){ banner('err','Não deu pra embalar', r.erro); beep(false); stats(); return; }
    mandarPraImpressora(o.id);
    banner('ok','Impresso ✓ — '+esc(o.buyer), 'NF <b>'+esc(o.nf||'—')+'</b> · <span class="sku">'+esc(o.codigo||'')+'</span> · estoque agora: '+r.estoque+'<br>Saiu borrada ou o papel enroscou? Reimprima aqui — o estoque não muda.',
      '<button class="rebt" onclick="reimprimir('+o.id+',this)">🖨 Reimprimir esta</button>');
    beep(true); stats(); listaImp();
  }catch(e){ banner('err','Falha de conexão', String(e)); beep(false); }
}
// Reimpressao: papel enroscado, etiqueta borrada, folha perdida. NAO mexe no
// estoque — a baixa ja aconteceu na primeira impressao, e o volume e o mesmo.
async function reimprimir(id,btn){
  const rotulo=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent='imprimindo…'; }
  try{
    const r=await (await fetch('/api/reimprimir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})).json();
    if(r.erro){ banner('err','Não deu pra reimprimir', esc(r.erro)); beep(false); listaImp(); return; }
    mandarPraImpressora(id);
    banner('ok','Reimpresso ✓ — '+esc(r.buyer), 'NF <b>'+esc(r.nf||'—')+'</b> · <span class="sku">'+esc(r.codigo||'')+'</span> · '+r.vezes+'ª reimpressão · <b>o estoque não mudou</b>',
      '<button class="rebt" onclick="reimprimir('+id+',this)">🖨 Reimprimir de novo</button>');
    beep(true); listaImp();
  }catch(e){ banner('err','Falha de conexão', String(e)); beep(false); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=rotulo||'Reimprimir'; } }
}
const scan=$('#scan');
// O bipe volta pro campo sozinho — menos o caso em que o operador está
// digitando em OUTRO campo (a busca dos impressos). Sem essa exceção o foco
// pula de volta pro #scan a cada letra e a busca fica impossível de usar.
const keep=()=>{
  const a=document.activeElement;
  if(a===scan) return;
  if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
  scan.focus();
};
scan.addEventListener('blur',()=>setTimeout(keep,50));
document.addEventListener('click',e=>{ if(!e.target.closest('button,a,input,select,textarea,label')) keep(); });
var tmr=null;
function proc(){
  var v=(scan.value||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  scan.value='';
  if(!v && confirmar){ imprimir(); return; }
  if(v.length>=8) scanSku(v);
}
scan.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); clearTimeout(tmr); proc(); }
});
scan.addEventListener('input',function(){ clearTimeout(tmr); tmr=setTimeout(proc,220); });
scan.focus();
function beep(ok){ try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?820:240;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();a.close();},ok?100:220);}catch(e){} }
idle(); stats(); setInterval(stats,4000);

async function listaPend(){
  var l=[]; try{ l=await (await fetch("/api/pendentes")).json(); }catch(e){}
  var el=document.getElementById("pendLista");
  if(!el) return;
  if(!l.length){ el.innerHTML='<span style="color:#5a6472;font-size:14px">Nada pendente.</span>'; return; }
  var h='';
  for(var i=0;i<l.length;i++){
    // Atrasado em vermelho: o prazo do ML já passou e o volume continua aqui.
    var atr=l[i].atrasados>0;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #d8dee6">'
      +'<b style="font-family:ui-monospace,monospace">'+esc(l[i].codigo)+'</b>'
      +(atr?'<span style="color:#c0392b;font-size:12px;font-weight:700">⚠ '+l[i].atrasados+' fora do prazo</span>':'')
      +'<b style="color:'+(atr?'#c0392b':'#b26a00')+';font-size:18px">'+l[i].qtd+'</b></div>';
  }
  el.innerHTML=h;
}
setInterval(listaPend,5000);
listaPend();

// ── O que vem pela frente ────────────────────────────────────────────────────
// Venda já faturada com prazo de despacho futuro. Fica FORA da fila do dia de
// propósito — cobrar hoje o que só vence em três semanas é o que ensina a
// equipe a ignorar a fila inteira.
//
// Mas é trabalho adiantável, não arquivo morto: se a peça está na prateleira,
// bipar o SKU já imprime a etiqueta e a caixa fica pronta. Por isso o painel
// mostra as datas e diz isso em voz alta — quem só olhasse "Faltam imprimir"
// não teria como saber que dá pra seguir.
function dataBR(s){ var p=String(s||'').split('-'); return p.length===3? p[2]+'/'+p[1] : s; }
// Quantos dias faltam, pra "14/09" virar uma noção de urgência e não só um número.
function faltamDias(s){
  var p=String(s||'').split('-'); if(p.length!==3) return null;
  var d=new Date(+p[0],+p[1]-1,+p[2],12,0,0), h=new Date(); h.setHours(12,0,0,0);
  return Math.round((d-h)/86400000);
}
async function listaFut(){
  var l=[]; try{ l=await (await fetch("/api/pendentes/futuros")).json(); }catch(e){}
  var el=document.getElementById("futBox"); if(!el) return;
  if(!l.length){ el.style.display='none'; return; }
  el.style.display='';
  var por={}, ordem=[];
  for(var i=0;i<l.length;i++){ var d=l[i].despachar_em;
    if(!por[d]){ por[d]=[]; ordem.push(d); } por[d].push(l[i]); }
  var h='<div class="ttl">Pra despachar depois</div>'
    +'<div style="color:#1f4b82;font-size:13px;margin:-4px 0 8px">'
    +'Dá pra adiantar: bipe o SKU e a etiqueta sai, se tiver peça na prateleira. '
    +'Não precisa entregar nessas datas.</div>';
  for(var k=0;k<ordem.length;k++){
    var d=ordem[k], itens=por[d], tot=0;
    for(var j=0;j<itens.length;j++) tot+=itens[j].qtd;
    var skus=[]; for(var j=0;j<itens.length;j++) skus.push(esc(itens[j].codigo)+' ×'+itens[j].qtd);
    var dias=faltamDias(d);
    h+='<div style="padding:8px 0;border-bottom:1px solid #e6eaf0">'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline">'
      +'<b>'+dataBR(d)+(dias!=null?'<span style="font-weight:400;color:#5a6472;font-size:12px"> · em '
          +(dias===1?'1 dia':dias+' dias')+'</span>':'')+'</b>'
      +'<b style="color:#5a6472">'+tot+'</b></div>'
      +'<div style="color:#5a6472;font-size:13px;font-family:ui-monospace,monospace">'+skus.join(' · ')+'</div></div>';
  }
  el.innerHTML=h;
}
setInterval(listaFut,30000);
listaFut();

// ── Já impressos: as notas e clientes que a impressora já cuspiu hoje ────────
// Existe pra UM momento: a impressora enroscou e ninguém lembra qual era a
// venda. Por isso vem do mais recente pro mais antigo, e a busca aceita
// cliente, NF ou SKU — que é o que o operador tem na mão nessa hora.
var impCache=[];
function horaDe(s){
  if(!s) return '—';
  var p=String(s).split(' '), hm=(p[1]||'').slice(0,5);
  var hoje=new Date().toLocaleDateString('sv-SE');   // AAAA-MM-DD, igual ao banco
  if(p[0]===hoje) return hm;
  var d=(p[0]||'').split('-');
  return (d[2]||'')+'/'+(d[1]||'')+' '+hm;
}
async function listaImp(){
  var dias=(document.getElementById('impDias')||{}).value||'1';
  try{ var l=await (await fetch('/api/impressos?dias='+dias)).json(); impCache=Array.isArray(l)?l:[]; }catch(e){ return; }
  renderImp();
  // A tela parada precisa aprender qual é a última: no primeiro idle() a lista
  // ainda não tinha chegado, e depois de cada impressão a última muda.
  if(emIdle) idle();
}
function renderImp(){
  var el=document.getElementById('impLista'); if(!el) return;
  var q=((document.getElementById('impBusca')||{}).value||'').trim().toLowerCase();
  var qs=q.replace(/[^a-z0-9]/g,'');
  var l=impCache.filter(function(r){
    if(!q) return true;
    var alvo=[r.buyer,r.nf,r.codigo,r.city,r.packId,r.venda].join(' ').toLowerCase();
    if(alvo.indexOf(q)>=0) return true;
    return !!qs && alvo.replace(/[^a-z0-9]/g,'').indexOf(qs)>=0;
  });
  var cnt=document.getElementById('impQtd');
  if(cnt) cnt.textContent=l.length+(q?' de '+impCache.length:'')+' impressa'+(l.length===1?'':'s');
  if(!l.length){ el.innerHTML='<span class="vazio">'+(impCache.length?'Nada com esse termo.':'Nenhuma etiqueta impressa no período.')+'</span>'; return; }
  // A ÚLTIMA é sempre a mesma venda, esteja a lista filtrada ou não — por isso
  // marcada por id, e não pela posição na tela. "Última" = última que saiu pela
  // PRIMEIRA vez; reimprimir uma venda velha não a promove a última.
  var ultimoId=(impCache[0]||{}).id;
  var mostra=l.slice(0,60), h='';
  for(var i=0;i<mostra.length;i++){
    var r=mostra[i], eh=(r.id===ultimoId);
    h+='<div class="imp'+(eh?' ultima':'')+'"><div class="who"><div class="nome">'+esc(r.buyer||'—')
      +(eh?'<span class="tagU">ÚLTIMA IMPRESSÃO</span>':'')
      +(r.reimpressoes>0?'<span class="tag">reimpressa '+r.reimpressoes+'x</span>':'')+'</div>'
      +'<div class="meta">NF <b>'+esc(r.nf||'—')+'</b> · <b>'+esc(r.codigo||'—')+'</b> · '+horaDe(r.embalado_em)
      +(r.city?' · '+esc(r.city):'')
      +(r.estagio==='carregado'?' · <span style="color:#2e7d32">carregado</span>':'')+'</div></div>'
      +'<button class="rebt'+(eh?' forte':'')+'" onclick="reimprimir('+r.id+',this)">🖨 Reimprimir'+(eh?' a última':'')+'</button></div>';
  }
  if(l.length>mostra.length) h+='<div class="vazio" style="padding-top:10px">Mostrando '+mostra.length+' de '+l.length+' — use a busca pra achar a venda.</div>';
  el.innerHTML=h;
}

async function relogioDesp(){
  var d=null;
  try{ d=await (await fetch("/api/expedicao/status")).json(); }catch(e){ return; }
  var el=document.getElementById("despBox");
  if(!el){
    el=document.createElement("div");
    el.id="despBox";
    el.style.cssText="margin-bottom:14px;padding:15px 18px;border-radius:13px;font-size:16px;font-weight:700";
    var w=document.querySelector(".wrap");
    if(w) w.insertBefore(el,w.firstChild);
  }
  var m=d.minutosRestantes, h=Math.floor(Math.abs(m)/60), mm=Math.abs(m)%60;
  var tempo=(h?h+"h":"")+mm+"min";
  var cor="#f4f6f8", bd="#d8dee6", txt="";
  if(d.passou){ txt="DESPACHO ENCERRADO ("+d.despacho+") - passou "+tempo; cor="#fbe9e8"; bd="#efb1ad"; }
  else {
    txt="Despacho as "+d.despacho+" - faltam "+tempo;
    if(d.pendentes>0) txt+=" para imprimir "+d.pendentes;
    if(m<60 && d.pendentes>0){ cor="#fbe9e8"; bd="#efb1ad"; }
    else if(m<120 && d.pendentes>0){ cor="#fbf1db"; bd="#e7cb8c"; }
  }
  el.style.background=cor; el.style.border="1px solid "+bd;
  el.innerHTML=txt;
}
setInterval(relogioDesp,30000);
relogioDesp();

// Subir PDF do ML — mesma bancada da expedicao. Painel so aparece pra quem
// pode subir (pdf.subir => area 'expedicao', ou admin). O upload alimenta a
// mesma lista que esta tela imprime.
function b64(f){ return new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result);};fr.readAsDataURL(f);}); }
async function upMany(fileList){
  var files=[].slice.call(fileList).filter(function(f){ return /pdf/i.test(f.type)||/\.pdf$/i.test(f.name); });
  if(!files.length) return;
  var totNov=0,totRep=0,totSem=0,totPdf=0,ok=0;
  for(var i=0;i<files.length;i++){
    document.getElementById('upRes').innerHTML='Lendo '+(i+1)+' de '+files.length+': <b>'+files[i].name+'</b>…';
    try{
      var j=await (await fetch('/api/lote/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdf:await b64(files[i])})})).json();
      if(j.erro){ continue; }
      totNov+=j.novos||0; totRep+=j.repetidas||0; totSem+=j.sem_sku||0; totPdf+=j.total||0; ok++;
    }catch(e){}
  }
  document.getElementById('upRes').innerHTML='<b>'+ok+' PDF(s)</b> · '+totNov+' vendas adicionadas · '+totPdf+' no total · '+totRep+' repetidas · '+totSem+' sem SKU';
  stats(); listaPend();
}
(async function(){
  try{
    var u=await (await fetch('/api/auth/eu')).json();
    var pode=u.logado && (u.areas||[]).some(function(a){ return a==='expedicao'||a==='admin'; });
    if(!pode) return;
    document.getElementById('upBox').style.display='block';
    document.getElementById('upTgl').onclick=function(){ var b=document.getElementById('upBody'); b.style.display=(b.style.display==='none'?'block':'none'); };
    document.getElementById('file').onchange=function(e){ upMany(e.target.files); e.target.value=''; };
    var drop=document.querySelector('.drop');
    ['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); }); });
    drop.addEventListener('drop',function(e){ e.preventDefault(); upMany(e.dataTransfer.files); });
  }catch(e){}
})();
