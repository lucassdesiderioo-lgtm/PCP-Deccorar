<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recebimento — Deccorar</title>
<style>
/* Estacao de OPERACAO: fundo CLARO (DESIGN.md §1). A tela escura vira espelho
   sob a luz natural forte do galpao, e quem confere entrega esta em pe, com a
   caixa na mao. Alvo minimo 52px (§4), fonte minima 15px (§3). */
:root{--bg:#fff;--pan:#F4F6F8;--line:#D8DEE6;--txt:#1A1D23;--sub:#5A6472;
      --verm:#C62828;--azul:#1565C0;--ambar:#B26A00;--verde:#2E7D32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:16px}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ambar);color:#fff;display:flex;
      align-items:center;justify-content:center;font-weight:800}
h1{font-size:19px;margin:0}.sub{color:var(--sub);font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:18px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.ped{font-size:19px;font-weight:800;margin-bottom:2px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.nome{font-size:19px;font-weight:700}
.ped-lin{color:var(--sub);font-size:15px;margin:4px 0 14px}
.lb{font-size:14px;color:var(--sub);margin-bottom:6px}
.step{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.stepb{width:56px;height:56px;border-radius:12px;border:1px solid var(--line);background:#fff;
       font-size:26px;cursor:pointer;color:var(--txt)}
.stepv{font-size:26px;font-weight:800;min-width:96px;text-align:center;border:1px solid var(--line);
       border-radius:12px;padding:10px 8px;background:#fff}
.un{color:var(--sub);font-size:15px}
button{font-family:inherit}
.b{min-height:56px;padding:0 22px;font-size:16px;font-weight:700;border-radius:12px;
   border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--txt)}
.b.pri{background:var(--ambar);border-color:var(--ambar);color:#fff}
.b.on{border:2px solid var(--ambar);color:var(--ambar)}
.avi{background:#FDF3E3;border:1px solid #E8C48A;color:#7A4A06;border-radius:10px;
     padding:12px 14px;margin-top:12px;font-size:15px}
.ok{background:#EAF3E7;border:1px solid #A9CEA2;color:#1F5E22}
.err{background:#FBEBEB;border:1px solid #E4A9A9;color:#8A2020}
.dev{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.ops{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
input[type=text]{font-family:inherit;font-size:16px;padding:14px;border:1px solid var(--line);
                 border-radius:10px;width:100%;background:#fff;color:var(--txt)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.rod{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
</style></head><body>
<header><div class="mark">R</div><div><h1>Recebimento</h1>
  <div class="sub">Confira o que chegou. Você não precisa saber de preço — isso é do comprador.</div></div></header>
<div class="wrap"><div id="app">carregando…</div></div>
<script src="/nav.js"></script>
<script>
/* A 502 NOVA (spec COMPRAS-E-RECEBIMENTO, fase 3, 07/11/2026).
   ⚠️ CONTAGEM CEGA: a fila NAO traz o que foi pedido nem o declarado do item
   por quantidade — quem conta digita o que contou. So o item "sem saldo"
   (cafe, detergente) mostra o pedido, porque ele se recebe com um toque.
   ⚠️ COMPRA POR KG: pese 1 unidade e pese 10. Sem os dois o item nao fecha, e a
   tela nao mostra o peso esperado.
   ⚠️ O DIGITADO NAO SE REDESENHA: os campos sao lidos na hora de confirmar
   (a licao do §12 — redesenho apaga campo). */
var PED=[], SEL=null, ALM=[], VOL={}, CHEGOU={}, DEV={};
var $=function(s){return document.querySelector(s);};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function n3(v){return (Math.round((+v||0)*1000)/1000).toString().replace('.',',');}
function numero(v){ var t=String(v==null?'':v).trim().replace(',','.'); return t===''?null:+t; }
async function carregar(){
  try{ PED=await (await fetch('/api/recebimento/aguardando')).json(); }catch(e){ PED=null; }
  try{ ALM=await (await fetch('/api/almoxarifados')).json(); if(!Array.isArray(ALM)) ALM=[]; }catch(e){ ALM=[]; }
  SEL=null; VOL={}; CHEGOU={}; DEV={}; render();
}
function levar(i){
  var opts=ALM.filter(function(a){return a.ativo;}).map(function(a){
    return '<option value="'+a.id+'"'+(i.levar_para&&i.levar_para.id===a.id?' selected':'')+'>'+esc(a.nome)+'</option>'; }).join('');
  return '<div class="lb" style="margin-top:12px">Levar para</div><select data-alm="'+i.id+'" style="font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%">'
    +(i.levar_para?'':'<option value="">— escolha onde guardar —</option>')+opts+'</select>';
}
function render(){
  var el=$('#app');
  if(PED===null){ el.innerHTML='<div class="card err avi">Sem conexão com o servidor. Toque para tentar de novo. <button class="b" id="tenta">Tentar de novo</button></div>'; return; }
  if(!PED.length){ el.innerHTML='<div class="card"><div class="ped">Nada a caminho</div>'
    +'<div class="sub">Quando uma compra for marcada como comprada, ela aparece aqui.</div></div>'; return; }
  if(!SEL){
    el.innerHTML='<div class="card"><div class="ped">O que está a caminho</div>'
      +'<div class="sub">Toque na compra que chegou.</div></div>'
      +PED.map(function(p){ return '<div class="card"><div class="ped">'+esc(p.numero)+' · '+esc(p.fornecedor||p.loja||'—')+'</div>'
        +'<div class="ped-lin">'+p.itens.length+' item(ns)'+(p.status==='parcial'?' · <b>entrega parcial</b>':'')+'</div>'
        +'<button class="b pri" data-abrir="'+p.id+'">Conferir esta entrega</button></div>'; }).join('');
    return;
  }
  var p=PED.find(function(x){return x.id==SEL;});
  var h='<div class="card"><div class="ped">'+esc(p.numero)+' · '+esc(p.fornecedor||p.loja||'—')+'</div>'
    +'<div class="ped-lin">Conte o que chegou. Não precisa saber o que foi pedido nem o preço.</div>';
  p.itens.forEach(function(i){
    h+='<div class="item"><div class="nome">'+esc(i.item)+'</div>';
    if(i.modo_saldo==='sem'){
      var tudo=CHEGOU[i.id]!==false;
      h+='<div class="ped-lin">Pedido: '+n3(i.pedido)+' '+esc(i.unidade)+'</div>'
        +'<div class="ops"><button class="b'+(tudo?' on':'')+'" data-tudo="'+i.id+'" data-v="1">'+(tudo?'✓ ':'')+'Chegou tudo</button>'
        +'<button class="b'+(!tudo?' on':'')+'" data-tudo="'+i.id+'" data-v="0">'+(!tudo?'✓ ':'')+'Faltou algo</button></div>'
        +(tudo?'':'<div class="lb" style="margin-top:12px">O que veio ('+esc(i.unidade)+')</div><input type="text" inputmode="decimal" data-qtd="'+i.id+'" autocomplete="off">');
    }else if(i.modo_saldo==='volume'){
      var vs=VOL[i.id]||(VOL[i.id]=[{}]);
      h+='<div class="ped-lin">Um registro por volume (rolo, caixa), com a metragem da etiqueta do fornecedor.</div>'
        +vs.map(function(v,k){ return '<div class="g2" style="margin-bottom:8px"><div><div class="lb">Volume '+(k+1)+' — metragem ('+esc(i.unidade)+')</div>'
          +'<input type="text" inputmode="decimal" data-vol="'+i.id+'" data-k="'+k+'" autocomplete="off"></div>'
          +'<div><div class="lb">Código na etiqueta do fornecedor (opcional)</div><input type="text" data-volcod="'+i.id+'" data-k="'+k+'" autocomplete="off"></div></div>'; }).join('')
        +'<button class="b" data-maisvol="'+i.id+'">+ outro volume</button>';
    }else{
      h+='<div class="lb">Quantas '+esc(i.unidade==='un'?'unidades':i.unidade)+' você contou?</div>'
        +'<input type="text" inputmode="decimal" data-qtd="'+i.id+'" autocomplete="off" style="font-size:22px;max-width:220px">';
    }
    if(i.pesar){
      h+='<div class="avi">Comprado por quilo: <b>pese 1 unidade</b> e <b>pese 10 unidades</b> juntas. Sem os dois pesos este item não fecha.</div>'
        +'<div class="g2"><div><div class="lb">Peso de 1 unidade (kg)</div><input type="text" inputmode="decimal" data-p1="'+i.id+'" autocomplete="off"></div>'
        +'<div><div class="lb">Peso de 10 unidades (kg)</div><input type="text" inputmode="decimal" data-p10="'+i.id+'" autocomplete="off"></div></div>';
    }
    h+=levar(i);
    var d=DEV[i.id];
    h+='<div class="dev"><div class="lb">Veio algo com problema para devolver?</div>'
      +(d?'<div class="g2"><div><div class="lb">Embalagens devolvidas</div><input type="text" inputmode="decimal" data-dev="'+i.id+'" autocomplete="off"></div><div><div class="lb">Por quê?</div>'
        +'<select data-mot="'+i.id+'" style="font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);width:100%"><option value="">—</option>'
        +[['fora_medida','Fora da medida'],['defeito','Defeito'],['veio_errado','Veio errado'],['qtd_a_mais','Quantidade a mais']].map(function(m){return '<option value="'+m[0]+'">'+m[1]+'</option>';}).join('')
        +'</select></div></div><div class="avi">O que volta <b>não entra no estoque</b> e continua contando como a caminho.</div>'
        :'<button class="b" data-querdev="'+i.id+'">Sim, devolver</button>')+'</div>';
    h+='</div>';
  });
  h+='<div class="dev"><div class="g2"><div><div class="lb">Número da nota</div>'
    +'<input type="text" id="nf" inputmode="numeric" autocomplete="off"></div>'
    +'<div><div class="lb">Data da nota</div><input type="text" id="nd" placeholder="dd/mm/aaaa" autocomplete="off"></div></div></div>'
    +'<div class="rod"><button class="b" id="volta">Voltar</button>'
    +'<button class="b pri" id="conf">Confirmar entrega</button></div>'
    +'<div id="msg"></div></div>';
  /* o redesenho guarda e devolve o que ja estava digitado */
  var guard={}; $$('#app input,#app select').forEach(function(e){ var k=Array.prototype.map.call(e.attributes,function(a){return a.name+'='+a.value;}).filter(function(x){return /^data-|^id=/.test(x);}).join('&'); if(k) guard[k]=e.value; });
  el.innerHTML=h;
  $$('#app input,#app select').forEach(function(e){ var k=Array.prototype.map.call(e.attributes,function(a){return a.name+'='+a.value;}).filter(function(x){return /^data-|^id=/.test(x);}).join('&'); if(k && guard[k]!=null && guard[k]!=='') e.value=guard[k]; });
}
document.addEventListener('click',async function(ev){
  var t=ev.target, b;
  if(t.id==='tenta'){ carregar(); return; }
  if((b=t.closest('[data-abrir]'))){ SEL=+b.getAttribute('data-abrir'); render(); return; }
  if(t.id==='volta'){ SEL=null; render(); return; }
  if((b=t.closest('[data-tudo]'))){ CHEGOU[b.getAttribute('data-tudo')]=b.getAttribute('data-v')==='1'; render(); return; }
  if((b=t.closest('[data-maisvol]'))){ VOL[b.getAttribute('data-maisvol')].push({}); render(); return; }
  if((b=t.closest('[data-querdev]'))){ DEV[b.getAttribute('data-querdev')]=true; render(); return; }
  if(t.id==='conf'){
    var p=PED.find(function(x){return x.id==SEL;});
    var itens=p.itens.map(function(i){
      var o={pedido_item_id:i.id};
      var a=$('[data-alm="'+i.id+'"]'); if(a && a.value) o.almoxarifado_id=+a.value;
      if(i.modo_saldo==='sem' && CHEGOU[i.id]!==false) o.chegou_tudo=true;
      else if(i.modo_saldo==='volume'){
        o.volumes=$$('[data-vol="'+i.id+'"]').map(function(e){ var c=$('[data-volcod="'+i.id+'"][data-k="'+e.getAttribute('data-k')+'"]');
          return {metragem:numero(e.value), codigo_fornecedor:c?c.value:null}; }).filter(function(v){return v.metragem!=null;});
        if(!o.volumes.length) delete o.volumes;
      }else{ var q=$('[data-qtd="'+i.id+'"]'); o.qtd_contada=q?numero(q.value):null; }
      var p1=$('[data-p1="'+i.id+'"]'), p10=$('[data-p10="'+i.id+'"]');
      if(p1) o.peso_1_kg=numero(p1.value); if(p10) o.peso_10_kg=numero(p10.value);
      var dv=$('[data-dev="'+i.id+'"]'), mt=$('[data-mot="'+i.id+'"]');
      if(dv && numero(dv.value)>0){ o.embalagens_devolvidas=numero(dv.value); o.motivo_devolucao=mt?mt.value:null; }
      return o;
    }).filter(function(o){ return o.chegou_tudo || o.volumes || (o.qtd_contada!=null && o.qtd_contada!=='') || o.embalagens_devolvidas>0; });
    if(!itens.length){ $('#msg').innerHTML='<div class="avi err">Informe o que chegou de pelo menos um item.</div>'; return; }
    var j, r;
    try{ r=await fetch('/api/recebimento',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pedido_id:SEL, nota_fiscal:$('#nf').value, nota_data:$('#nd').value, itens:itens})}); j=await r.json(); }
    catch(e){ $('#msg').innerHTML='<div class="avi err">SEM CONEXÃO — confira o Wi-Fi e toque em Confirmar de novo.</div>'; return; }
    if(!r.ok){ $('#msg').innerHTML='<div class="avi err">'+esc(j.erro||'não deu')+'</div>'; return; }
    $('#msg').innerHTML='<div class="avi '+(j.retidos?'err':'ok')+'">✓ Entrega registrada.'
      +(j.aviso?'<br>'+esc(j.aviso):'')+'</div>';
    setTimeout(carregar, j.retidos?5000:1800);
  }
});
carregar();
</script></body></html>
