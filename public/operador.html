<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- A estação vira app instalado no iPad (camada 2 da spec TABLETS-E-KIOSK): em tela cheia, sem barra de
     endereço nem abas. Um manifest e um ícone POR ESTAÇÃO, para cada tablet abrir direto na dele. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revisão">
<link rel="apple-touch-icon" href="/icones/operador-180.png">
<link rel="manifest" href="/app/operador.webmanifest">
<link rel="stylesheet" href="/ipad.css">
<title>Revisão</title>
<style>
  :root{--bg:#ffffff;--panel:#f4f6f8;--line:#d8dee6;--txt:#1a1d23;--muted:#5a6472;--amber:#b26a00;--green:#2e7d32;--red:#c62828;--blue:#1565c0}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .banner{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:26px;text-align:center;margin-bottom:16px}
  .banner.rev{background:#e8f0fb;border-color:#a9c9ee}.banner.ok{background:#e7f5eb;border-color:#a9d8b4}.banner.err{background:#fbe9e8;border-color:#efb1ad}
  .bt{font-size:26px;font-weight:750}.bs{font-size:15px;color:var(--muted);margin-top:6px}
  .timer{font-size:52px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:8px;letter-spacing:2px}
  #scan{display:block;width:100%;max-width:520px;margin:0 auto 14px;padding:14px;
        font-size:17px;font-family:ui-monospace,monospace;text-align:center;letter-spacing:1px;
        background:var(--panel);border:2px solid var(--line);border-radius:12px;color:var(--txt)}
  #scan:focus{outline:none;border-color:var(--amber)}
  .stats{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}.stats b{color:var(--txt)}
  .muted{color:var(--muted);padding:20px}
  .link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px}

  /* ── TELA ÚNICA (REVISAO-TELA-UNICA, 23/11/2026): o tablet deitado. À
     esquerda a peça na mão, à direita a lista. Sem escolher cor ao abrir: a
     cor marca cada parte da lista, sempre com o título escrito do lado. ── */
  header{padding:12px 18px;flex-wrap:wrap}
  .hdia{font-size:13px;color:var(--muted)}
  .hesp{flex:1}
  .cont{display:flex;gap:18px;font-size:13px;color:var(--muted)}
  .cont b{display:block;font-size:22px;color:var(--txt);font-variant-numeric:tabular-nums}
  .btTopo{font:700 15px system-ui,sans-serif;padding:12px 16px;border-radius:12px;min-height:48px;cursor:pointer;background:#fff}
  #btDev{border:2px solid #e7cb8c;background:#fbf1db;color:var(--amber)}
  #btSemana{border:2px solid var(--txt);color:var(--txt)}
  .corpo{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
  .esq{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
  .dir{padding:14px 18px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
  .esq #scan{max-width:none;margin:0}
  .esq .banner{margin:0;min-height:300px;display:flex;flex-direction:column;justify-content:center}
  .esq .banner .bt{font-size:30px;line-height:1.1}
  .para{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:999px;font-size:15px;font-weight:700}
  .para.hoje{background:#fbe9e8;color:var(--red);border:1px solid #efb1ad}
  .para.prox{background:#e8f0fb;color:var(--blue);border:1px solid #a9c9ee}
  .para.alvo{background:#eef1f4;color:#4b5563;border:1px solid var(--line)}
  .para.fora{background:#fbf1db;color:var(--amber);border:1px solid #e7cb8c}
  .foco{border-radius:16px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
  .foco.fh{background:#fbe9e8;border:2px solid #efb1ad}
  .foco.fp{background:#e8f0fb;border:2px solid #a9c9ee}
  .fcab{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .fcab .ft{font-size:22px;font-weight:850;letter-spacing:.5px;text-transform:uppercase}
  .fh .ft{color:var(--red)} .fp .ft{color:var(--blue)}
  .fcab .fs{font-size:14px;color:#3b4552}
  .fcab .fn{margin-left:auto;font-size:15px;color:#3b4552}.fcab .fn b{font-size:30px;color:var(--txt);font-variant-numeric:tabular-nums}
  .gd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--txt);width:100%}
  .cd.active{outline:3px solid var(--amber);background:#fbf1db}
  .cd .m{font-size:24px;font-weight:850;line-height:1.05}
  .cd .c{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .cd .sk{font:600 12px ui-monospace,monospace;color:var(--muted);word-break:break-all}
  .cd .n{grid-row:1/4;grid-column:2;text-align:right;align-self:center}
  .cd .n b{display:block;font-size:36px;font-weight:850;line-height:1;font-variant-numeric:tabular-nums}
  .cd .n small{font-size:12px;color:var(--muted)}
  .prog{grid-column:1/3;height:16px;margin-top:6px;border-radius:8px;background:#e3e7ec;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green)}
  .cd .d{grid-column:1/3;font-size:13px;color:#3b4552;font-variant-numeric:tabular-nums}
  .depois{display:flex;flex-direction:column;gap:6px}
  .depois h3{margin:0;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
  .depois h3 b{margin-left:auto;color:var(--txt);font-size:15px;letter-spacing:0}
  .mini{display:flex;flex-wrap:wrap;gap:6px}
  .mini button{font:600 13px system-ui,sans-serif;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:#3b4552;cursor:pointer;min-height:40px}
  .mini button b{color:var(--txt);margin-left:4px}
  .mini button.active{outline:3px solid var(--amber)}
  .fechado{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:#e7f5eb;border:2px solid #a9d8b4;color:var(--green);font-weight:800;font-size:17px}
  .fechado span{font-weight:500;color:#3b4552;font-size:14px}
  .fechado.neutro{background:var(--panel);border-color:var(--line);color:#3b4552}
  #faixaNova{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;display:flex;align-items:center;gap:14px;padding:14px 18px;font-size:17px;font-weight:700;flex-wrap:wrap}
  #faixaNova[hidden]{display:none}
  #faixaNova button{margin-left:auto;font:700 14px system-ui,sans-serif;padding:10px 16px;border-radius:10px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;min-height:44px}
  #semana{position:fixed;inset:0;z-index:10000;background:rgba(26,29,35,.55);display:flex;align-items:center;justify-content:center;padding:24px}
  #semana[hidden]{display:none}
  .sbox{background:#fff;border-radius:18px;width:100%;max-width:980px;max-height:100%;overflow:auto;padding:20px 22px}
  .sbox .scab{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .sbox h3{margin:0;font-size:20px}.sbox .scab p{margin:0;color:var(--muted);font-size:13px}
  .sbox .scab button{margin-left:auto;font:700 15px system-ui,sans-serif;padding:12px 18px;border-radius:11px;border:2px solid var(--txt);background:#fff;color:var(--txt);min-height:48px;cursor:pointer}
  .sbox table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
  .sbox th,.sbox td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
  .sbox th{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
  .sbox td:first-child,.sbox th:first-child{text-align:left}
  .sbox td.z{color:#b6bdc6}.sbox td.hj{background:#fbe9e8;color:var(--red);font-weight:800}
  .aviso{background:#fbf1db;border:1px solid #e7cb8c;color:#8a5a00;border-radius:10px;padding:10px 12px;font-size:14px}
  @media (max-width:900px){ .corpo{grid-template-columns:1fr} .esq{border-right:0;border-bottom:1px solid var(--line)} .gd{grid-template-columns:1fr} }
</style></head><body>
<header><div class="mark">R</div><div><h1>Revisão</h1><div class="hdia" id="hdia"></div></div>
<span class="hesp"></span>
<div class="cont"><div><b id="cQtd">—</b>revisadas hoje</div><div><b id="cMed">—</b>sua média hoje</div></div>
<button type="button" class="btTopo" id="btDev" data-perm="devolucao.registrar">↩ Devoluções</button>
<button type="button" class="btTopo" id="btSemana">Ver a semana</button></header>
<div id="faixaNova" hidden></div>
<div class="corpo">
  <div class="esq">
    <input id="scan" autocomplete="off" autocorrect="off" autocapitalize="characters"
     spellcheck="false" inputmode="text" placeholder="bipe aqui" aria-label="Bipe o código do SKU">
    <div class="banner" id="banner"></div>
    <!-- AS PECAS QUE VOLTARAM DA EMBALAGEM POR DEFEITO (EMBALAGEM-DEFEITO-VOLTA, R-EMB-11) -->
    <div id="volta" style="display:none"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="dir" id="tiles"></div>
</div>
<div id="semana" hidden></div>
<script>
let SKUS=[], PROD={}, emRev=null, tick=null;
var MODO=null, LISTA=null, VISTO=null, SKUS_EM=0, LISTA_ERRO=false;
/* A lista que não carrega diz que não carregou (§12, o fetch que falha não
   some calado): a lista de antes, se houver, continua embaixo. */
function falhaLista(){ LISTA_ERRO=true; renderTiles(); }
const $=s=>document.querySelector(s);
/* TELA ÚNICA (REVISAO-TELA-UNICA, 23/11/2026): não se escolhe cor ao abrir. A
   lista vem pronta do /api/revisao/lista (revisao_lista.js), e quem decide
   para que a peça serve é o servidor, no bipe que fecha. */
async function load(){
  /* O cadastro de SKU (a medida e a cor) muda pouco: a cada minuto basta. */
  if(!SKUS.length || Date.now()-SKUS_EM>60000){ try{ SKUS=await (await fetch('/api/skus')).json(); SKUS_EM=Date.now(); }catch(e){} }
  try{ var r=await fetch('/api/revisao/lista'); var l=r.ok?await r.json():null;
    if(!l||!l.totais||!l.hoje_lista){ falhaLista(); return; } LISTA=l; LISTA_ERRO=false; }
  catch(e){ falhaLista(); return; }
  novaVenda(); renderTiles(); loadStats();
}
function skuInfo(c){ return SKUS.find(s=>s.codigo===c); }
// item 4: medida como ancora visual (DESIGN.md §3).
// Le das COLUNAS do SKU, nao mais da regex ^BK(\d{3})(\d{3}): o codigo virou
// etiqueta livre e nao carrega mais significado. Um SKU sem medida cadastrada
// cai no mesmo fallback de antes — mostra so o codigo — e aparece na aba
// "SKU incompleto" do admin para alguem completar.
function medidaDe(cod){
  var s=skuInfo(cod);
  if(!s||s.largura_cm==null||s.altura_cm==null) return null;
  return { medida:(s.largura_cm/100).toFixed(2).replace('.',',')+' × '+(s.altura_cm/100).toFixed(2).replace('.',','),
           cor:s.cor_codigo||'' };
}
function tileInner(cod, corFallback, num, numColor, detail){
  var md=medidaDe(cod);
  var cab = md ? '<div class="tmed">'+md.medida+'</div><div class="tcor">'+md.cor+'</div>'
               : '<div class="tmed">'+cod+'</div>'+(corFallback?'<div class="tcor">'+corFallback+'</div>':'');
  var sku = md ? '<div class="tc">'+cod+'</div>' : '';
  return '<div class="thead"><div>'+cab+'</div><div class="tp"'+(numColor?' style="color:'+numColor+'"':'')+'>'+num+'</div></div>'+sku+'<div class="tf">'+detail+'</div>';
}
/* A LISTA (REVISAO-TELA-UNICA): o dia de hoje em destaque, grande, com o
   andamento; o resto da semana e o alvo pequenos embaixo. Terminado o dia, ele
   vira uma faixa verde e os próximos dias sobem para o destaque. Os números
   vêm prontos do /api/revisao/lista (revisao_lista.js): a tela só desenha. */
function diasTxt(x){
  if(!x.dias||!x.dias.length) return '';
  var ate=LISTA&&LISTA.ate?LISTA.ate.split(' ')[0]:'';
  var p=[];
  if(x.dias[0].n) p.push(x.dias[0].rotulo+' '+x.dias[0].n);
  if(x.dias.length>1 && x.resto_semana) p.push((x.dias[0].n?'até ':'até ')+ate+' '+x.resto_semana);
  return p.join(' · ');
}
function cardTxt(x, modo){
  var md=medidaDe(x.codigo), f, falta, d;
  /* A peça já revisada e esperando a embalagem conta como feita para hoje
     (decisão do dono, 24/11/2026): o número grande é só o que falta revisar. */
  if(modo==='hoje'){ var emb=x.hoje_na_embalagem||0; f=(x.hoje_revisadas||0)+emb; falta=x.hoje;
    d=f+' de '+(f+falta)+' para hoje já '+(f===1?'revisada':'revisadas')+(emb?' ('+emb+' na embalagem)':'')+(diasTxt(x)?' · depois: '+diasTxt(x):''); }
  else { f=x.revisadas_estoque||0; falta=x.proximos; d=f+(f===1?' revisada hoje':' revisadas hoje')+(diasTxt(x)?' · '+diasTxt(x):''); }
  var pct=(f+falta)?Math.round(f/(f+falta)*100):0;
  var act=emRev&&emRev.codigo===x.codigo;
  return '<button type="button" class="cd'+(act?' active':'')+'" data-cod="'+escH(x.codigo)+'">'
    +'<div class="m">'+escH(md?md.medida:x.codigo)+'</div><div class="c">'+escH(md?md.cor:(x.cor||''))+'</div>'
    +(md?'<div class="sk">'+escH(x.codigo)+'</div>':'')
    +'<div class="n"><b>'+falta+'</b><small>'+(modo==='hoje'?'faltam hoje':'faltam')+'</small></div>'
    +'<div class="prog"><i style="width:'+pct+'%"></i></div><div class="d">'+d+'</div></button>';
}
function miniTxt(lista, campo){
  return '<div class="mini">'+lista.map(function(x){ var md=medidaDe(x.codigo), act=emRev&&emRev.codigo===x.codigo;
    return '<button type="button" class="'+(act?'active':'')+'" data-cod="'+escH(x.codigo)+'">'
      +escH(md?md.medida+' '+(md.cor||'').toLowerCase():x.codigo)+'<b>'+x[campo]+'</b></button>'; }).join('')+'</div>';
}
function renderTiles(){
  var erro=LISTA_ERRO?'<div class="aviso">Não deu para atualizar a lista agora. A tela tenta de novo sozinha; os números abaixo podem estar velhos.</div>':'';
  var L=LISTA; if(!L){ $('#tiles').innerHTML=erro||'<div class="muted">Carregando a lista…</div>'; return; }
  var t=L.totais, h='', ate=L.ate?' · até '+escH(L.ate):'';
  var alvo=L.alvo_lista.length?'<div class="depois"><h3>Completar o alvo<b>faltam '+t.alvo+'</b></h3>'+miniTxt(L.alvo_lista,'alvo')+'</div>':'';
  if(!L.hoje_terminado && !L.sem_venda_hoje && L.hoje_lista.length){
    h+='<div class="foco fh"><div class="fcab"><span class="ft">Hoje</span><span class="fs">vendas de hoje sem peça · '+(t.hoje_revisadas+(t.hoje_na_embalagem||0))+((t.hoje_revisadas+(t.hoje_na_embalagem||0))===1?' já revisada':' já revisadas')+'</span>'
      +'<span class="fn">faltam <b>'+t.hoje+'</b></span></div><div class="gd">'+L.hoje_lista.map(function(x){ return cardTxt(x,'hoje'); }).join('')+'</div></div>';
    if(L.proximos_lista.length) h+='<div class="depois"><h3>Depois de hoje'+ate+'<b>faltam '+t.proximos+'</b></h3>'+miniTxt(L.proximos_lista,'proximos')+'</div>';
  } else {
    h+=L.hoje_terminado
      ? '<div class="fechado">✓ Hoje está terminado <span>'+(t.hoje_revisadas+(t.hoje_na_embalagem||0))+((t.hoje_revisadas+(t.hoje_na_embalagem||0))===1?' peça revisada':' peças revisadas')+' para as vendas de hoje</span></div>'
      : '<div class="fechado neutro">Nenhuma venda de hoje sem peça <span>quando o PDF de hoje subir, as vendas sem peça aparecem aqui</span></div>';
    if(L.proximos_lista.length)
      h+='<div class="foco fp"><div class="fcab"><span class="ft">Próximos dias</span><span class="fs">o dia mais cedo primeiro'+ate+'</span>'
        +'<span class="fn">faltam <b>'+t.proximos+'</b></span></div><div class="gd">'+L.proximos_lista.map(function(x){ return cardTxt(x,'prox'); }).join('')+'</div></div>';
  }
  h=erro+h+alvo;
  if(!L.hoje_lista.length && !L.proximos_lista.length && !L.alvo_lista.length)
    h+='<div class="muted">Nada a produzir agora: as vendas estão cobertas e o alvo está cheio. (Confira o Planejamento se acabou de importar a planilha.)</div>';
  $('#tiles').innerHTML=h;
}
/* Para onde a peça bipada vai: a primeira necessidade do SKU, na mesma ordem
   que o servidor usa no bipe que fecha (revisao_lista.modoPara). A tela só
   avisa; quem decide é o servidor. */
function destino(cod){
  var L=LISTA; if(!L) return null;
  var x=L.hoje_lista.concat(L.proximos_lista,L.alvo_lista).filter(function(y){ return y.codigo===cod; })[0];
  if(!x) return {cls:'fora',txt:'⚠ Não falta em lugar nenhum: vai contar como estoque acima do alvo'};
  if(x.hoje>0) return {cls:'hoje',txt:'● Vai para: venda de hoje'};
  if(x.proximos>0){ var d=(x.dias||[]).filter(function(z){ return z.n>0; })[0]; return {cls:'prox',txt:'● Vai para: venda de '+(d?d.rotulo:'até sexta')}; }
  if(x.alvo>0) return {cls:'alvo',txt:'● Vai para: completar o alvo'};
  return {cls:'fora',txt:'⚠ Não falta em lugar nenhum: vai contar como estoque acima do alvo'};
}
/* A venda nova de hoje sem peça (o PDF da tarde): faixa vermelha e um som, uma
   vez, sem travar nada. A primeira leitura só guarda o que já havia. */
function novaVenda(){
  /* Venda nova é a falta de hoje que SUBIU sem a revisão ter descido: o
     "Desfazer" e a peça devolvida pela embalagem sobem a falta e descem a
     revisada na mesma conta, e não são venda nova (③ REVISÃO, 23/11/2026). O
     SKU que saiu de Hoje conta como falta zero; a revisada vem de todo SKU com
     ordem (`revisadas_hoje`). Vira o dia, recomeça. */
  var L=LISTA; if(!L) return;
  var falta={}, rev=L.revisadas_hoje||{};
  L.hoje_lista.forEach(function(x){ falta[x.codigo]=x.hoje; });
  if(VISTO && VISTO.dia!==L.hoje) VISTO=null;
  if(VISTO){
    var cods={}; Object.keys(falta).concat(Object.keys(VISTO.falta)).forEach(function(c){ cods[c]=1; });
    var novos=Object.keys(cods).filter(function(c){
      var subiu=(falta[c]||0)-(VISTO.falta[c]||0), desceu=(VISTO.rev[c]||0)-(rev[c]||0);
      return subiu>Math.max(0,desceu); });
    if(novos.length){
      var md=medidaDe(novos[0]), nome=md?md.medida+' '+(md.cor||''):novos[0];
      var f=$('#faixaNova');
      f.innerHTML='🔔 Venda nova para hoje sem peça: '+escH(nome)+(novos.length>1?' e mais '+(novos.length-1):'')
        +' <span style="font-weight:500;font-size:14px">· já está em Hoje</span><button type="button" id="fxOk">Entendi</button>';
      f.hidden=false; beep(false); setTimeout(function(){ beep(false); },300);
      document.getElementById('fxOk').onclick=function(){ f.hidden=true; scan.focus({preventScroll:true}); };
    }
  }
  VISTO={dia:L.hoje, falta:falta, rev:rev};
}
/* Quantas peças a PESSOA revisou hoje e a média dela (o /api/revisao/lista
   manda "minhas", pelo login). */
function loadStats(){
  var m=LISTA&&LISTA.minhas; if(!m) return;
  $('#cQtd').textContent=m.qtd; $('#cMed').textContent=m.qtd?fmt(m.media_seg):'—';
}
function fmt(seg){ seg=+seg||0; const m=Math.floor(seg/60),s=seg%60; return (m?m+'m':'')+s+'s'; }

    +avisoV+'<div style="font-size:18px;font-weight:800;color:#c62828;margin-bottom:8px">Voltaram da embalagem por defeito ('+L.length+')</div>'
    +'<div style="font-size:13px;color:#5a6472;margin-bottom:4px">Quem decide é quem tem a permissão de registrar peça com problema.</div>';
  L.forEach(function(v){
    var med=(v.largura_cm&&v.altura_cm)?(v.largura_cm+' × '+v.altura_cm+' '+(v.cor_codigo||v.cor||'')):'';
    h+='<div style="background:#fff;border:1px solid #efb1ad;border-radius:10px;padding:12px;margin-top:8px">'
      +'<div style="font-size:17px;font-weight:800">'+escV(v.codigo)+(med?' <span style="font-weight:600;color:#5a6472">· '+escV(med)+'</span>':'')+'</div>'
      +'<div style="margin-top:2px"><b>'+escV(v.motivo)+'</b>'+(v.obs?' — '+escV(v.obs):'')+'</div>'
      +'<div style="font-size:13px;color:#5a6472;margin-top:2px">achou: '+escV(v.achou_por||'—')+' · '+haTempo(v.ha_min)+(v.modo==='devolucao'?' · <b>peça de devolução</b>':'')+'</div>';
    if(voltaAberta===v.id){
      h+='<div style="margin-top:10px;font-weight:700">Qual setor é o responsável?</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">'
        +VOLTA.setores.map(function(s){ return '<button type="button" class="vSetor" data-id="'+v.id+'" data-s="'+s.chave+'" style="padding:12px 16px;border-radius:9px;border:1px solid #c62828;background:#fff;color:#c62828;font-size:15px;font-weight:700;cursor:pointer">'+escV(s.nome)+'</button>'; }).join('')
        +'<button type="button" class="vVolta" style="padding:12px 16px;border-radius:9px;border:1px solid #c9d1db;background:transparent;font-size:15px;cursor:pointer">Voltar</button></div>';
    } else {
      h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">'
        +'<button type="button" class="vTem" data-perm="revisao.rejeitar" data-id="'+v.id+'" style="padding:12px 16px;border-radius:9px;border:0;background:#c62828;color:#fff;font-size:15px;font-weight:800;cursor:pointer">Tem defeito — enviar ao setor</button>'
        +'<button type="button" class="vSem" data-perm="revisao.rejeitar" data-id="'+v.id+'" style="padding:12px 16px;border-radius:9px;border:1px solid #2e7d32;background:#fff;color:#2e7d32;font-size:15px;font-weight:700;cursor:pointer">Não tem defeito</button></div>';
    }
    h+='<div class="vErr" data-id="'+v.id+'" style="color:#c62828;font-weight:700;margin-top:6px"></div></div>';
  });
  el.innerHTML=h+'</div>'; el.style.display='';
}
async function voltaDecidir(id, corpo){
  if(voltaEnviando) return; voltaEnviando=true;
  var v=(VOLTA.abertas||[]).find(function(x){ return x.id===id; })||{};
  try{
    var r=await (await fetch('/api/revisao/defeitos/'+id+'/decidir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)})).json();
    voltaEnviando=false;
    if(r && r.erro){ var e=document.querySelector('.vErr[data-id="'+id+'"]'); if(e) e.textContent=r.erro; beep(false); return; }
    voltaAberta=null;
    /* com uma revisao aberta, o aviso nao escreve por cima dela (③ REVISAO): o
       resultado fica no proprio bloco */
    var msg;
    if(corpo.decisao==='defeito'){ var sn=((VOLTA.setores||[]).find(function(s){ return s.chave===corpo.setor; })||{}).nome||'';
      msg=escV(v.codigo)+' · '+escV(v.motivo)+' · registrada como peça com problema.';
      if(!emRev){ banner('err','Enviada ao setor: '+escV(sn), msg); } else VOLTA_MSG='Enviada ao setor '+escV(sn)+': '+msg; }
    else { msg=r.volta_fila ? escV(v.codigo)+' · peça de devolução: <b>voltou direto à fila da embalagem</b>, não precisa revisar de novo.'
                           : escV(v.codigo)+' · <b>revise a peça de novo</b> (bipe o código duas vezes) para ela voltar à fila da embalagem.';
      if(!emRev){ banner('ok','Sem defeito', msg); } else VOLTA_MSG='Sem defeito: '+msg; }
    beep(true); voltaCarregar();
  }catch(e){ voltaEnviando=false; var e2=document.querySelector('.vErr[data-id="'+id+'"]'); if(e2) e2.textContent='Sem conexão: nada foi gravado. Toque de novo.'; beep(false); }
}
document.addEventListener('click',function(e){
  var t=e.target.closest('.vTem,.vSem,.vSetor,.vVolta'); if(!t) return;
  VOLTA_MSG='';
  if(t.classList.contains('vTem')){ voltaAberta=+t.dataset.id; voltaDesenhar(); return; }
  if(t.classList.contains('vVolta')){ voltaAberta=null; voltaDesenhar(); return; }
  if(t.classList.contains('vSem')){ voltaDecidir(+t.dataset.id,{decisao:'sem_defeito'}); return; }
  if(t.classList.contains('vSetor')){ voltaDecidir(+t.dataset.id,{decisao:'defeito',setor:t.dataset.s}); return; }
});
voltaCarregar(); setInterval(voltaCarregar, 15000);

function rjAbrir(){
  if(!emRev || RJ_ENVIANDO) return;
  var h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:10001;display:flex;align-items:center;justify-content:center;padding:20px" id="rjBox">';
  h+='<div style="background:#f4f6f8;border:1px solid #d8dee6;border-radius:16px;padding:24px;max-width:520px;width:100%">';

  h+='<div style="font-size:14px;color:#5a6472;margin-bottom:18px">'+emRev.codigo+' volta para a produção. Qual o motivo?</div>';
  if(!Array.isArray(RJMOT) || !RJMOT.length)
    h+='<div style="padding:14px;border-radius:10px;background:#fbf1db;border:1px solid #e7cb8c;color:#8a5a00;font-size:15px">Nenhum motivo cadastrado. Peça para cadastrar os motivos em 902 Cadastros (lista "Peça com problema").</div>';
  for(var i=0;Array.isArray(RJMOT)&&i<RJMOT.length;i++){

  }
  h+='<input id="rjObs" placeholder="observação (opcional)" style="width:100%;margin-top:10px;padding:12px;background:#ffffff;border:1px solid #d8dee6;border-radius:9px;color:#1a1d23;font-size:15px">';
  h+='<button type="button" id="rjCancel" style="width:100%;margin-top:14px;padding:13px;border-radius:9px;border:1px solid #d8dee6;background:transparent;color:#5a6472;font-size:15px;cursor:pointer">Cancelar</button>';
  h+='</div></div>';
  var d=document.createElement('div'); d.innerHTML=h; document.body.appendChild(d.firstChild);
  vigiarBipeNaObs(document.getElementById('rjObs'));
}
/* O LEITOR NÃO ESCREVE NA OBSERVAÇÃO (③ REVISÃO, 23/11/2026): com o foco no
   campo, o bipe virava texto e era gravado com o motivo. O leitor digita muito
   mais rápido que uma pessoa e termina com Enter: as teclas que chegaram em
   rajada (menos de 50 ms entre uma e outra) antes do Enter saem do campo, e a
   janela diz que o bipe não vale com ela aberta. */
function skuNoFim(txt){
  var t=String(txt||'').toUpperCase().replace(/\s+$/,''), achou='';
  (SKUS||[]).forEach(function(x){ var c=String(x.codigo||'').toUpperCase();
    if(c.length>=6 && c.length>achou.length && t.slice(-c.length)===c) achou=c; });
  return achou ? String(txt).replace(/\s+$/,'').slice(-achou.length) : '';
}
function vigiarBipeNaObs(el){
  if(!el) return;
  var rajada=0, ultima=0, antes='';
  el.addEventListener('keydown',function(e){
    var t=Date.now();
    if(e.key==='Enter'||e.key==='Tab'){
      e.preventDefault();
      /* E o leitor LENTO (③ REVISÃO, rodada 4): o que termina o campo é um SKU
         cadastrado, colado ou não ao texto? Sai também — a regra não depende
         da velocidade do leitor. */
      var sku=skuNoFim(el.value);
      if(rajada<8 && sku){ antes=el.value.slice(0, el.value.length-sku.length).replace(/\s+$/,''); rajada=8; }
      if(rajada>=8){ el.value=antes;
        var av=document.getElementById('rjAvisoBipe');
        if(!av){ av=document.createElement('div'); av.id='rjAvisoBipe';
          av.style.cssText='margin-top:8px;color:#c62828;font-weight:700;font-size:14px';
          el.parentNode.insertBefore(av, el.nextSibling); }
        av.textContent='O bipe não vale com esta janela aberta: escolha o motivo ou toque em Cancelar.';
        beep(false); }
      rajada=0; return;
    }
    if(e.key && e.key.length===1){
      if(t-ultima<50) rajada++; else { rajada=1; antes=el.value; }
      ultima=t;
    }
  });
}
document.addEventListener('click',function(e){
  if(e.target.closest('#rjCancel')){ var b=document.getElementById('rjBox'); if(b) b.remove(); scan.focus({preventScroll:true}); return; }
  var o=e.target.closest('.rjOp');
  if(!o) return;
  var motivo=o.getAttribute('data-m');
  var obs=(document.getElementById('rjObs')||{}).value||'';
  var cur=emRev;
  if(!cur) return;
  var seg=Math.round((Date.now()-cur.inicio)/1000);
  RJ_ENVIANDO=true;
  var bx=document.getElementById('rjBox'); if(bx) bx.remove();
  var bsE=document.querySelector('#banner .bs'); if(bsE) bsE.insertAdjacentHTML('beforeend','<div id="rjEsperando" style="margin-top:8px;font-weight:700">Registrando a peça com problema…</div>');
  /* A tela só diz "voltou" quando o servidor gravou. Recusa ou falta de
     conexão: a revisão continua aberta e a pessoa tenta de novo. */
  function naoGravou(msg){ RJ_ENVIANDO=false; beep(false);
    var ep=document.getElementById('rjEsperando'); if(ep) ep.remove();
    var bs=document.querySelector('#banner .bs');
    if(bs) bs.innerHTML='<b style="color:#c62828">A peça com problema não foi registrada: '+escH(msg)+'</b>';
    scan.focus({preventScroll:true}); }
  /* A rede pendurada não trava a bancada: em 20 s a tela desiste (a regra da
     Embalagem, R-EMB-09). A resposta pode ter se perdido depois da gravação,
     e a frase diz isso (③ REVISÃO). */
  var ctl=(window.AbortController?new AbortController():null);
  var prazo=setTimeout(function(){ if(ctl) ctl.abort(); },20000);
  fetch('/api/rejeicao',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl?ctl.signal:undefined,
    body:JSON.stringify({codigo:cur.codigo,serie:cur.serie||null,motivo:motivo,obs:obs,segundos:seg,modo:null})})   // a persiana em série sai do carrinho (PRODUCAO-MAPA-E-MOTOR v7)
   .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {ok:r.ok&&!j.erro, j:j}; }); })
   .then(function(x){
     clearTimeout(prazo);
     if(!x.ok){ naoGravou(x.j.erro||'o servidor recusou'); return; }
     RJ_ENVIANDO=false;
     clearInterval(tick); tick=null; emRev=null;
     banner('err','Voltou para a produção', cur.codigo+' · '+motivo);
     renderTiles(); load(); scan.focus({preventScroll:true});
   }, function(e){ clearTimeout(prazo);
     naoGravou(e&&e.name==='AbortError'?'sem resposta do servidor em 20 s. Ela pode ter sido gravada: confira em Problemas (104) antes de registrar de novo':'sem conexão — toque de novo'); });
});
