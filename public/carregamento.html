<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carregamento</title>
<style>
  /* Operacao: fundo CLARO (DESIGN secao 2) — tela usada sob luz de fabrica, escuro vira espelho */
  :root{--bg:#ffffff;--panel:#f4f6f8;--line:#d8dee6;--txt:#1a1d23;--muted:#5a6472;--amber:#b26a00;--green:#2e7d32;--red:#c62828;--blue:#1565c0;--violet:#6f42c1}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
  .links{margin-left:auto;display:flex;gap:8px}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  .stats{display:flex;gap:12px;margin-bottom:14px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .stat .n{font-size:34px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase}
  .stat.car .n{color:var(--green)}.stat.fal .n{color:var(--amber)}
  .banner{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:26px;text-align:center;margin-bottom:14px}
  .banner.ok{background:#e7f5eb;border-color:#a9d8b4}.banner.err{background:#fbe9e8;border-color:#efb1ad}.banner.warn{background:#fbf1db;border-color:#e7cb8c}
  .bt{font-size:26px;font-weight:780}.bs{font-size:15px;color:var(--muted);margin-top:6px}.bs b{color:var(--txt)}
  #scan{position:absolute;left:-9999px;opacity:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:12px 14px;font-size:13px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
  .row .c{font-family:ui-monospace,monospace;color:var(--muted);font-size:12px}
  .row .who{flex:1}
  .btn{border:0;border-radius:9px;font-weight:700;padding:11px 16px;cursor:pointer}
  .conf{background:var(--amber);color:#1a1300;margin-top:12px}
  .empty{padding:22px;text-align:center;color:var(--green)}
</style></head><body>
<header><div class="mark">C</div><div><h1>Carregamento</h1><div class="sub">Bipe a etiqueta de venda ao pôr no carro</div></div>
<div class="links"><a class="link" href="/embalagem">Expedição</a><a class="link" href="/painel">Painel</a></div></header>
<div class="wrap">
  <div class="stats">
    <div class="stat car"><div class="n" id="nCar">0</div><div class="l">Carregados</div></div>
    <div class="stat fal"><div class="n" id="nFal">0</div><div class="l">Faltam carregar</div></div>
  </div>
  <div class="banner" id="banner"><div class="bt">Pronto</div><div class="bs">Bipe o QR ou código de barras da etiqueta de venda.</div></div>
  <input id="scan" autocomplete="off">
  <button class="btn conf" onclick="conferir()" style="width:100%">✓ Conferir carga</button>
  <div class="card" style="margin-top:14px"><h3>Faltam carregar</h3><div id="lista"></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let last={c:null,t:0};
function banner(kind,title,sub){ $('#banner').className='banner '+(kind||''); $('#banner').innerHTML='<div class="bt">'+title+'</div><div class="bs">'+(sub||'')+'</div>'; }
/* Quando a conferencia dupla esta ligada, o bipe da etiqueta nao carrega
   sozinho: o volume fica ESPERANDO o bipe do SKU da propria caixa. Guardamos
   qual etiqueta esta pendurada pra casar o segundo bipe com ela. */
let aguardando=null;   // {code, buyer, nf}
async function bip(code){
  code=(code||'').trim(); if(!code) return;
  const now=Date.now(); if(last.c===code && now-last.t<600) return; last={c:code,t:now};
  const corpo = aguardando ? {code:aguardando.code, sku:code} : {code:code};
  const r=await (await fetch('/api/carregar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)})).json();
  if(r.ok){
    aguardando=null;
    banner('ok','Carregado ✓ — '+r.pedido.buyer,'NF <b>'+(r.pedido.nf||'—')+'</b> · <span class="c">'+(r.pedido.codigo||'')+'</span> · Carregados <b>'+r.carregados+'</b> de '+r.total); beep(true);
  }
  else if(r.motivo==='falta_sku'){
    // 1o bipe aceito. NAO mostramos qual SKU esperar — a conferencia e cega.
    aguardando={code:code, buyer:r.pedido.buyer, nf:r.pedido.nf};
    banner('warn','Agora bipe o SKU da caixa','<b>'+r.pedido.buyer+'</b> · NF <b>'+(r.pedido.nf||'—')+'</b><br>Bipe o código de barras do produto <b>nesta mesma caixa</b> para conferir.');
    beep(true);
  }
  else if(r.motivo==='sku_divergente'){
    aguardando=null;
    banner('err','⛔ PARE — CAIXA ERRADA',
      'A etiqueta de <b>'+r.pedido.buyer+'</b> (NF '+(r.pedido.nf||'—')+') é do produto <span class="c">'+r.esperado+'</span>,<br>'+
      'mas a caixa que ela está colada é <span class="c">'+r.lido+'</span>.<br><b>Não carregue.</b> Separe e confira antes de despachar.');
    beep(false);
  }
  else if(r.motivo==='volume_sem_sku'){ aguardando=null; banner('err','Volume sem SKU', r.aviso||''); beep(false); }
  else if(r.motivo==='duplicado'){ aguardando=null; banner('err','⚠ JÁ CARREGADO','Esse pacote ('+r.pedido.buyer+' · NF '+(r.pedido.nf||'—')+') já foi carregado. Cuidado com duplicidade.'); beep(false); }
  else {
    // Enquanto espera o SKU, um codigo nao reconhecido pode ser outra etiqueta:
    // solta a pendencia pra pessoa nao ficar presa num volume.
    var era=aguardando; aguardando=null;
    banner('err','Etiqueta não reconhecida', era
      ? 'Lido: '+code+'. Esperava o SKU da caixa de '+era.buyer+'. Bipe a etiqueta de venda de novo pra recomeçar.'
      : 'Lido: '+code+'. Bipe a etiqueta de VENDA (não o SKU do produto).');
    beep(false);
  }
  carregar();
}
/* O ATRASADO SAI MARCADO E EM CIMA (carga.js).
   Ele ja vem primeiro do servidor. Aqui so ganha a tarja: diluido no meio do
   trabalho de hoje, sem nada que o distinga, ele viraria uma linha a mais numa
   lista que nunca zera — e lista que nunca zera ninguem le ate o fim. */
function dataBR(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?(m[3]+'/'+m[2]):''; }
async function carregar(){
  const d=await (await fetch('/api/carregamento')).json();
  $('#nCar').textContent=d.carregados; $('#nFal').textContent=d.faltam.length;
  $('#lista').innerHTML = d.faltam.length ? d.faltam.map(function(f){
    return '<div class="row"><span class="who">'
      +(f.atrasado?'<b style="color:var(--amber)">⏳ de '+dataBR(f.data)+'</b> · ':'')
      +f.buyer+' <span class="c">NF '+(f.nf||'—')+' · '+(f.codigo||'')+'</span></span></div>';
  }).join('') : '<div class="empty">✅ Nada faltando — tudo carregado!</div>';
}
async function conferir(){
  const d=await (await fetch('/api/carregamento')).json();
  /* "Sem lote" olha o que FALTA, nao o dia: com volume atrasado esperando, o
     aviso de dia vazio mandaria fechar o carro por cima dele. */
  if(d.total===0){ banner('warn','Nada pra carregar','Nenhum volume embalado esperando.'); return; }
  if(d.faltam.length===0){ banner('ok','Carga completa ✓','Pode fechar o carro. '+d.carregados+' pacotes conferidos.'); beep(true); }
  else{ banner('err','Faltam '+d.faltam.length+' no carro',
    (d.atrasados?'<b>'+d.atrasados+' de dias anteriores.</b> ':'')
    +'NÃO feche ainda: '+d.faltam.slice(0,6).map(f=>f.buyer).join(', ')+(d.faltam.length>6?'…':'')); beep(false); }
}
const scan=$('#scan'); const keep=()=>{ if(document.activeElement!==scan) scan.focus(); };
scan.addEventListener('blur',()=>setTimeout(keep,50));
document.addEventListener('click',e=>{ if(!e.target.closest('button,a')) keep(); });
scan.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=scan.value.trim(); scan.value=''; bip(v); } });
scan.focus();
function beep(ok){ try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?820:240;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();a.close();},ok?100:220);}catch(e){} }
carregar(); setInterval(carregar,4000);
</script><script src="/nav.js"></script>
</body></html>
