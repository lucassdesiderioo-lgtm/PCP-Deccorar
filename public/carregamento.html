<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<!-- A estação vira app instalado no iPad (camada 2 da spec TABLETS-E-KIOSK): em tela cheia, sem barra de
     endereço nem abas. Um manifest e um ícone POR ESTAÇÃO, para cada tablet abrir direto na dele. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conferência">
<link rel="apple-touch-icon" href="/icones/carregamento-180.png">
<link rel="manifest" href="/app/carregamento.webmanifest">
<link rel="stylesheet" href="/ipad.css">
<title>Conferência</title>
<style>
  /* A 202 CONFERÊNCIA COM CARRINHOS (spec CONFERENCIA-CARRINHOS, 25/11/2026).
     A tela segue o caminho da caixa: em cima as duas barras do dia; à
     esquerda o bipe e os destinos (Carrinho A, B…, Carro da agência); à
     direita a lista das caixas; embaixo as ações raras.
     Operação: fundo CLARO (DESIGN §1) — luz de fábrica, tela escura vira espelho. */
  :root{--bg:#ffffff;--panel:#f4f6f8;--line:#d8dee6;--txt:#1a1d23;--muted:#5a6472;--amber:#b26a00;--green:#2e7d32;--red:#c62828;--blue:#1565c0;--violet:#6f42c1;--gray:#9aa4b1;
    --redbg:#fdecea;--greenbg:#e8f5e9;--amberbg:#fff4e0;--bluebg:#e8f0fb;--violetbg:#f1ebfb}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
  button{font:inherit;cursor:pointer}
  header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px;background:#fff}
  .par{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .wrap{max-width:1360px;margin:0 auto;padding:14px 18px 60px;display:flex;flex-direction:column;gap:14px}
  .btn{border-radius:10px;padding:10px 16px;font-weight:700;min-height:46px;background:var(--panel);color:var(--txt);border:1px solid var(--line)}
  .btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
  .btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.red{background:var(--red);color:#fff;border-color:var(--red)}
  .btn.big{font-size:17px;padding:13px 20px;min-height:54px}
  .btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  /* as duas barras */
  .barras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  @media(max-width:860px){.barras{grid-template-columns:1fr}}
  .bx{border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:7px}
  .bx .cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .bx .tit{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .bx .falta{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .bx .falta small{font-size:15px;font-weight:600;color:var(--muted)}
  .bx .de{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  .trilho{display:flex;height:20px;border-radius:8px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
  .trilho i{display:block;height:100%}
  .leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
  .leg span{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}.leg b{color:var(--txt)}
  .sq{width:12px;height:12px;border-radius:3px;display:inline-block}
  .k-ent{background:var(--green)}.k-car{background:var(--blue)}.k-imp{background:var(--amber)}.k-sem{background:var(--gray)}.k-fora{background:var(--violet)}
  .faixa{background:var(--amberbg);border:2px solid var(--amber);color:#4a2c00;border-radius:10px;padding:9px 14px;font-weight:700}
  /* o corpo */
  .corpo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
  @media(max-width:980px){.corpo{grid-template-columns:1fr}}
  .card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:#fff;min-width:0}
  .card h2{font-size:16px;margin:0}
  .banner{border-radius:12px;padding:14px 18px;border:3px solid var(--line);background:var(--panel)}
  .banner .bt{font-size:23px;font-weight:800;line-height:1.15}
  .banner .bs{font-size:15px;margin-top:5px}
  .banner.ok{background:var(--greenbg);border-color:var(--green);color:#173f1a}
  .banner.err{background:var(--redbg);border-color:var(--red);color:#5a1010}
  .banner.esp{background:var(--bluebg);border-color:var(--blue);color:#0c3266}
  .banner.warn{background:var(--amberbg);border-color:var(--amber);color:#4a2c00}
  #scan{width:100%;font-size:20px;padding:12px 14px;border:2px solid #c9d8ee;border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:52px}
  .dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .dc{border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff;text-align:left}
  .dc .n{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
  .dc .q{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .dc .l{font-size:12px;color:var(--muted)}
  .dc.ativo{border-color:var(--blue);background:var(--bluebg);box-shadow:0 0 0 2px var(--blue) inset}
  .dc.ativo .l{color:var(--blue);font-weight:700}
  .dc.ag{border-color:#c6d8f1}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
  .c-col{background:var(--violetbg);color:var(--violet);border-color:#d9c9f3}
  .c-ag{background:var(--bluebg);color:var(--blue);border-color:#c6d8f1}
  .c-ok{background:var(--greenbg);color:var(--green);border-color:#bfe0c2}
  .c-am{background:var(--amberbg);color:var(--amber);border-color:#f0d29a}
  .c-red{background:var(--redbg);color:var(--red);border-color:#f3c3c0}
  .c-mu{background:var(--panel);color:var(--muted);border-color:var(--line)}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .fl{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--muted);min-height:40px}
  .fl.on{background:var(--txt);color:#fff;border-color:var(--txt)}
  .lista{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:620px;overflow-y:auto}
  .cx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
  .cx:last-child{border-bottom:0}
  .cx .cli{font-weight:700}
  .cx .det{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px;align-items:center}
  .cx .det .mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--txt)}
  .cx .dir{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .vazio{padding:14px;color:var(--muted);font-size:14px}
  .passos{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
  .passos span{padding:6px 10px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .passos span.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .passos span.feito{background:var(--greenbg);color:var(--green);border-color:#bfe0c2}
  .num{font-size:30px;font-weight:800;width:140px;text-align:center;padding:8px;border:2px solid #c9d8ee;border-radius:10px;font-variant-numeric:tabular-nums}
  .cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cmp div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
  .cmp b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
  .foto{width:150px;height:100px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;background:var(--panel);overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover}
  input.txt, select.txt{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%;min-height:44px;background:#fff}
  .pecas{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .pc{display:flex;gap:10px;align-items:center;font-size:16px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt)}
  .pc.ok{background:var(--greenbg);border-color:#bfe0c2}
  .outras{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .outras .lbl{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px}
  .ct{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;margin-left:4px;text-align:center}
  .ct.z{background:var(--line);color:var(--muted)}
  .hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
  .hist div{padding:7px 10px;border-left:3px solid var(--line);background:var(--panel);border-radius:0 6px 6px 0}
  .nota{font-size:13px;color:var(--muted)}
  /* "Etiqueta feita por" em linha própria (R-SEG-03): grudado no número, lia-se como parte dele. */
  .quem{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
</style></head><body>
<header><div class="mark">C</div><div><h1>202 Conferência</h1><div class="sub">Bipe as caixas com etiqueta, coloque nos carrinhos e entregue</div></div>
<div class="links"><span class="par" id="parSegundo">Segundo bipe (SKU): …</span>
  <button class="link" onclick="trocarPessoa()">👤 Trocar de pessoa</button><a class="link" href="/embalagem">Etiqueta de Venda</a></div></header>
<div class="wrap">
  <div class="barras" id="barras"></div>
  <div class="faixa" id="faixa" hidden></div>
  <div class="corpo">
    <div class="card">
      <h2 id="titEsq">Bipar caixas</h2>
      <div class="banner" id="banner"><div class="bt">Pronto</div><div class="bs">Bipe a etiqueta de venda da caixa.</div></div>
      <input id="scan" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Bipe aqui">
      <div id="painel"></div>
    </div>
    <div class="card"><h2>Caixas de hoje</h2><div class="filtros" id="filtros"></div><div id="lista"></div></div>
  </div>
  <div class="card"><div class="outras"><span class="lbl">Outras ações</span>
    <button class="btn" onclick="abrirCancelada()">✕ Venda cancelada <span class="ct z" id="ctCanc">0</span></button>
    <button class="btn" onclick="abrirNaoPassou()">🚚 A coleta não passou</button>
    <button class="btn" onclick="verHist=!verHist;desenharHist()">Histórico do dia</button></div>
    <div id="hist"></div></div>
</div>
<script>
/* ===================== ESTADO ===================== */
var D=null;                   // a última leitura de /api/conferencia/dia
var estado='bipar';           // bipar | entrega | recontar | cancelada | naopassou
var ativo=null;               // o carrinho ativo deste aparelho
var aguardando=null;          // segundo bipe: a etiqueta esperando o SKU
var caixaPecas=null;          // a caixa de várias sendo conferida peça a peça
var filtro='faltam', verHist=false;
var ENT=null, REC=null, CANC=null, pessoas=null;
var last={c:'',t:0}, ultimaPeca={c:'',t:0}, ultimoDestino='';
function $(s){ return document.querySelector(s); }
function esc0(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nomeDest(c){ return c==='AG'?'Carro da agência':'Carrinho '+c; }
function trocarPessoa(){ fetch('/api/auth/logout',{method:'POST'}).then(function(){ location.href='/login?r=/carregamento'; }); }
/* O carrinho ativo é deste aparelho (só conveniência; o servidor confere). */
try{ ativo=localStorage.getItem('conf_carrinho')||null; }catch(e){}
function setAtivo(c){ ativo=c; try{ localStorage.setItem('conf_carrinho',c); }catch(e){} }
async function postJ(url,corpo){
  var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo||{})});
  /* Resposta que não é JSON (servidor fora, página de erro) é falha de
     conexão, e o bipe tem que avisar — nunca virar um "não deu" calado. */
  var j=await r.json();
  j.__status=r.status; return j;
}
function banner(kind,t,s){ $('#banner').className='banner '+(kind||''); $('#banner').innerHTML='<div class="bt">'+t+'</div>'+(s?'<div class="bs">'+s+'</div>':''); }
function beep(ok){ try{ var a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value=ok?820:240; g.gain.value=.05; o.start();
  setTimeout(function(){ o.stop(); a.close(); }, ok?100:220); }catch(e){} }
/* A CAIXA DE VÁRIAS PERSIANAS (R-PEC-02, R-VOL-02): a lista do que vai na
   caixa APARECE, contando persiana (soma das `qtd`), nunca linha. Na caixa de
   várias o código solto sai da linha, porque sozinho fazia dois SKUs parecerem
   um; a lista vem embaixo, por `pecasLinhas`. */
function pecasDeC(itens){ return (itens||[]).reduce(function(s,i){ return s+Math.max(1,(i&&i.qtd)||1); },0); }
function ehVarias(f){ return pecasDeC(f&&f.itens)>1; }
function skuDaLinha(f){ return ehVarias(f) ? '' : ' · '+esc0(f.codigo||''); }
function pecasLinhas(itens){
  if(pecasDeC(itens)<2) return '';
  return '<div style="margin-top:3px"><span class="chip c-am">📦 '+pecasDeC(itens)+' persianas</span>'
    +(itens||[]).map(function(i){ return '<div style="font-size:13px;margin-top:2px"><b>'+Math.max(1,i.qtd||1)+' ×</b> <span class="mono">'+esc0(i.codigo||'')+'</span></div>'; }).join('')+'</div>';
}
var pecasDe=pecasDeC;
function dataBR(s){ var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?(m[3]+'/'+m[2]):''; }
function horaDe(s){ var p=String(s||'').split(' '); return (p[1]||'').slice(0,5); }
/* O selo do "a coleta não passou" (R-FIM-01): "de ontem" quando ficou ontem. */
function ontem(){ var d=new Date(); d.setDate(d.getDate()-1); var z=function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function seloFicou(f){ if(!f.ficou_de) return '';
  return ' <span class="chip c-am">🌙 '+(f.ficou_de===ontem()?'de ontem':'ficou '+dataBR(f.ficou_de))+' — a coleta não passou</span>'; }
function linha(f,dir){
  var mod=f.coleta?'<span class="chip c-col">🟣 Coleta</span>':'<span class="chip c-ag">🚗 Agência</span>';
  return '<div class="cx"><div><div class="cli">'+esc0(f.buyer||'(sem nome)')+seloFicou(f)
    +(f.antiga&&!f.conferido_por&&!f.ficou_de?' <span class="chip c-am">de antes</span>':'')
    +(f.adiantada?' <span class="chip c-mu">despacha '+dataBR(f.despachar_em)+'</span>':'')+'</div>'
    +'<div class="det">'+mod+'<span>NF '+esc0(f.nf||'—')+skuDaLinha(f)+'</span></div>'
    +pecasLinhas(f.itens)
    +(f.impresso_por?'<div class="quem">Etiqueta feita por <b>'+esc0(f.impresso_por)+'</b></div>':'')
    +'</div><div class="dir">'+(dir||'')+'</div></div>';
}

/* ===================== LEITURA ===================== */
async function carregar(){
  var d; try{ d=await (await fetch('/api/conferencia/dia')).json(); }catch(e){ return; }
  if(!d || !d.barras) return;
  D=d;
  var cods=(d.destinos||[]).filter(function(x){ return x.codigo!=='AG'; }).map(function(x){ return x.codigo; });
  /* Ninguém escolhe o carrinho pela pessoa (R-CRR-02): sem um escolhido neste
     aparelho, a caixa de coleta é recusada dizendo para escolher. */
  if(ativo && cods.indexOf(ativo)<0) ativo=null;
  $('#parSegundo').innerHTML='Segundo bipe (SKU): <b>'+(d.segundo_bipe?'ligado':'desligado')+'</b> · muda na 906 Parâmetros';
  desenharBarras(); desenharFaixa(); desenharLista(); desenharHist();
  if(estado==='bipar') desenharPainel();
  if(estado==='entrega' && ENT && ENT.passo===0) desenharPainel();
  try{ var s=await (await fetch('/api/carregamento/sobras')).json(); CANC_LISTA=s; var n=(s.caixas||[]).length+(s.aguardando||[]).length;
    $('#ctCanc').textContent=n; $('#ctCanc').className='ct'+(n?'':' z'); if(estado==='cancelada' && !digitando()) desenharCancelada(); }catch(e){}
}
var CANC_LISTA={caixas:[],aguardando:[]};
function seg(v,t,cl){ return v&&t?'<i class="'+cl+'" style="width:'+(v/t*100)+'%"></i>':''; }
function desenharBarras(){
  var e=D.barras.entrega, b=D.barras.bipe;
  $('#barras').innerHTML=
    '<div class="bx"><div class="cab"><span class="tit">Entrega do dia</span><span class="de">'+e.entregues+' de '+e.total+' entregues</span></div>'
   +'<div class="falta">'+e.faltam+' <small>faltam entregar</small></div>'
   +'<div class="trilho">'+seg(e.entregues,e.total,'k-ent')+seg(e.nos_carrinhos,e.total,'k-car')+seg(e.sem_carrinho,e.total,'k-fora')+seg(e.sem_bipe,e.total,'k-imp')+seg(e.sem_etiqueta,e.total,'k-sem')+'</div>'
   +'<div class="leg"><span><i class="sq k-ent"></i>entregues <b>'+e.entregues+'</b></span><span><i class="sq k-car"></i>nos carrinhos <b>'+e.nos_carrinhos+'</b></span>'
   +(e.sem_carrinho?'<span><i class="sq k-fora"></i>conferidas fora do carrinho <b>'+e.sem_carrinho+'</b></span>':'')
   +'<span><i class="sq k-imp"></i>impressas sem bipe <b>'+e.sem_bipe+'</b></span><span><i class="sq k-sem"></i>sem etiqueta ainda <b>'+e.sem_etiqueta+'</b></span></div></div>'
   +'<div class="bx"><div class="cab"><span class="tit">Bipar o que foi impresso hoje</span><span class="de">'+b.bipadas+' de '+b.impressas+' bipadas</span></div>'
   +'<div class="falta">'+b.faltam+' <small>faltam bipar</small></div>'
   +'<div class="trilho">'+seg(b.bipadas,b.impressas,'k-car')+seg(b.faltam,b.impressas,'k-imp')+'</div>'
   +'<div class="leg"><span><i class="sq k-car"></i>bipadas <b>'+b.bipadas+'</b></span><span><i class="sq k-imp"></i>faltam <b>'+b.faltam+'</b></span>'
   +(b.antes_sem_bipe?'<span><b>+ '+b.antes_sem_bipe+'</b> impressas antes de hoje sem bipe</span>':'')+'</div></div>';
}
function desenharFaixa(){
  var l=(D.destinos||[]).filter(function(x){ return x.n; });
  var f=$('#faixa'), t=[];
  /* A saída ou a viagem aberta por um aparelho com a página antiga: as caixas
     dela saem dos carrinhos até alguém fechá-la lá (③ REVISÃO). */
  (D.abertas_antigas||[]).forEach(function(a){ t.push('⚠ '+(a.tipo==='agencia'?'Viagem à agência':'Saída do caminhão')+' aberta pela tela antiga'
    +(a.aberta_por?' ('+a.aberta_por+')':'')+': recarregue aquele aparelho e feche ou cancele por lá.'); });
  if(l.length && estado!=='entrega') t.push('⚠ '+l.map(function(x){ return x.nome+' com '+x.n; }).join(' · ')+' — falta entregar');
  if(!t.length){ f.hidden=true; return; }
  f.hidden=false; f.textContent=t.join('  ·  ');
}
function desenharLista(){
  var n={faltam:(D.faltam||[]).length, nos:(D.nos||[]).length, sem:(D.sem_carrinho||[]).length, entregues:(D.entregues||[]).length, etq:(D.sem_etiqueta||[]).length};
  var F=[['faltam','Faltam bipar'],['nos','Nos carrinhos'],['sem','Conferidas sem carrinho'],['entregues','Entregues hoje'],['etq','Sem etiqueta ainda']]
    .filter(function(x){ return x[0]!=='sem' || n.sem; });
  if(filtro==='sem' && !n.sem) filtro='faltam';
  $('#filtros').innerHTML=F.map(function(x){ return '<button class="fl'+(filtro===x[0]?' on':'')+'" onclick="filtro=\''+x[0]+'\';desenharLista()">'+x[1]+' '+n[x[0]]+'</button>'; }).join('');
  var l=filtro==='faltam'?D.faltam: filtro==='nos'?D.nos: filtro==='sem'?D.sem_carrinho: filtro==='entregues'?D.entregues: D.sem_etiqueta;
  var vazio={faltam:'Nada faltando: tudo o que foi impresso está bipado.',nos:'Nenhuma caixa nos carrinhos.',sem:'Nenhuma.',entregues:'Nada entregue hoje ainda.',etq:'Nenhuma venda do dia esperando etiqueta.'}[filtro];
  $('#lista').innerHTML='<div class="lista">'+((l||[]).length?l.map(function(c){
    var dir= filtro==='nos'?'<span class="chip c-ok">'+esc0(nomeDest(c.carrinho))+'</span>'
      : filtro==='sem'?(c.nao_achada?'<span class="chip c-red">não achada na recontagem</span>':'<span class="chip c-am">bipe num carrinho</span>')
      : filtro==='entregues'?'<span class="chip c-ok">entregue</span>'
      : filtro==='etq'?'<span class="chip c-mu">esperando a 201</span>':'';
    return linha(c,dir); }).join(''):'<div class="vazio">'+vazio+'</div>')+'</div>'
    +(filtro==='sem'?'<div class="nota">Caixas já conferidas (o estoque já baixou) que não estão em carrinho nenhum. Bipe cada uma: ela entra no carrinho ativo sem baixar de novo.</div>':'')
    +(filtro==='etq'?'<div class="nota">Vendas do dia que ainda não tiveram a etiqueta impressa na 201. Contam na entrega do dia, mas ainda não se bipam.</div>':'');
}
function desenharHist(){
  if(!verHist || !D){ $('#hist').innerHTML=''; return; }
  var l=D.saidas_hoje||[];
  $('#hist').innerHTML='<div class="hist">'+(l.length?l.map(function(s){
    var dest=(s.carrinhos||[]).length?s.carrinhos.map(nomeDest).join(' + '):(s.tipo==='agencia'?'viagem à agência':'saída do caminhão');
    return '<div>'+horaDe(s.fechada_em)+' — '+esc0(s.fechado_por||'?')+' entregou '+esc0(dest)+' '+(s.tipo==='agencia'?'à agência':'ao motorista')
      +': sistema '+s.sistema+', '+(s.tipo==='agencia'?'atendente ':'motorista ')+s.externa+(s.divergente?' · <b>liberado com divergência</b>: '+esc0(s.motivo||''):' ✓')
      +(s.quem_levou?' · levou: '+esc0(s.quem_levou):'')+(s.foto?' · <a href="'+s.foto+'" target="_blank" rel="noopener">foto</a>':'')+'</div>'; }).join('')
    :'<div>Nenhuma entrega fechada hoje.</div>')+'</div>';
}

/* ===================== O PAINEL DA ESQUERDA ===================== */
function desenharPainel(){
  $('#titEsq').textContent={bipar:'Bipar caixas',entrega:'Entregar',recontar:'Recontar carrinho',cancelada:'✕ Venda cancelada',naopassou:'🚚 A coleta não passou'}[estado];
  if(estado==='entrega') return desenharEntrega();
  if(estado==='recontar') return desenharRecontar();
  if(estado==='cancelada') return desenharCancelada();
  if(estado==='naopassou') return desenharNaoPassou();
  if(!D) return;
  $('#painel').innerHTML='<div class="dest">'+(D.destinos||[]).map(function(d){
    var ag=d.codigo==='AG', at=!ag && ativo===d.codigo;
    return '<div class="dc'+(at?' ativo':'')+(ag?' ag':'')+'"><div class="n"><span>'+(ag?'🚗 ':'🛒 ')+esc0(d.nome)+'</span>'
      +(d.recontado?'<span class="chip c-ok">recontado</span>':'')+'</div><div class="q">'+d.n+'</div>'
      +'<div class="l">'+(ag?'caixas de agência entram aqui':at?'ATIVO — o bipe da coleta vem para cá':'bipe a etiqueta do carrinho para usar')+'</div>'
      +'<div class="acoes">'+(!ag&&!at?'<button class="btn sm" onclick="usar(\''+d.codigo+'\')">Usar este</button>':'')
      +(d.n?'<button class="btn sm" onclick="abrirRecontar(\''+d.codigo+'\')">🔁 Recontar</button><button class="btn sm ok" onclick="abrirEntrega(\''+d.codigo+'\')">Entregar →</button>':'')+'</div></div>';
  }).join('')+'</div>'+(ativo?'':'<div class="banner warn"><div class="bt">Escolha o carrinho</div><div class="bs">Bipe a etiqueta colada no carrinho, ou toque em "Usar este".</div></div>')+'<div class="nota">Os carrinhos vêm do cadastro "Carrinhos da expedição" (902 Cadastros). Bipar a etiqueta do carrinho troca o ativo.</div>';
}
function usar(c){ setAtivo(c); banner('ok','Agora a coleta vai para o '+nomeDest(c),''); beep(true); desenharPainel(); $('#scan').focus(); }
function voltarBipar(){ estado='bipar'; ENT=null; REC=null; CANC=null; banner('','Pronto','Bipe a etiqueta de venda da caixa.'); desenharPainel(); desenharFaixa(); $('#scan').focus(); }

/* ===================== O BIPE ===================== */
function semConexao(){
  banner('err','⚠ SEM CONEXÃO — O BIPE NÃO CHEGOU', caixaPecas
    ? 'Não sei se a última persiana contou. Toque em <b>↺ Recomeçar esta caixa</b> e bipe todas de novo.<div class="acoes" style="margin-top:8px"><button class="btn" onclick="recomecarCaixa()">↺ Recomeçar esta caixa</button></div>'
    : 'Confira o Wi-Fi e <b>bipe a mesma caixa de novo</b>. Se ela já tiver entrado, o sistema avisa.');
  beep(false);
}
async function bip(code){
  code=String(code||'').trim(); if(!code) return;
  if(estado==='recontar') return bipRecontar(code);
  if(estado==='cancelada') return bipCancelada(code);
  if(caixaPecas) return bipPeca(code);
  var agora=Date.now(); if(last.c===code && agora-last.t<600) return; last={c:code,t:agora};
  /* Com a entrega aberta, a caixa bipada (a que o motorista levou sem bipe, ou
     a que faltava) vai para o carrinho QUE ESTÁ SENDO ENTREGUE, e entra na
     conta dela — e não no carrinho ativo (③ REVISÃO). A de agência vai para o
     Carro da agência, como sempre. */
  var destino=ativo||'';
  if(estado==='entrega' && ENT){ var cs=ENT.sel.filter(function(c){ return c!=='AG'; }); if(cs.length) destino=cs[0]; }
  ultimoDestino=destino;
  var corpo=aguardando?{code:aguardando.code, sku:code, carrinho:destino}:{code:code, carrinho:destino};
  var r=await postJ('/api/carregar',corpo);
  aguardando=null;
  mostrar(r, corpo.code);
  carregar();
  if(estado==='entrega' && ENT){
    if(r.ok && ENT.passo===3 && ENT.res){ ENT.res=null; banner('ok','✓ Conferida — no '+esc0(nomeDest(r.carrinho||destino)),'Agora toque em <b>Comparar e fechar</b> de novo.'); }
    atualizarPrevia(); }
}
function quem(r){ var p=r.pedido||{}; return esc0(p.buyer||'')+(p.nf?' · NF '+esc0(p.nf):''); }
function mostrar(r, enviado){
  if(r.__status===401){ banner('err','Sessão encerrada','Entre de novo com o seu PIN.'); beep(false); return; }
  if(r.trocar_carrinho){ setAtivo(r.trocar_carrinho); banner('ok','Agora a coleta vai para o '+esc0(r.nome),''); beep(true); desenharPainel(); return; }
  if(r.ok && r.recolocada){ banner('ok','✓ No '+esc0(nomeDest(r.carrinho))+' (já estava conferida)',quem(r)+' · o estoque não baixou de novo'); beep(true); return; }
  if(r.ok){ banner('ok','✓ Conferida — no '+esc0(nomeDest(r.carrinho||'?')),quem(r)+(r.adiantado?' · <b>⏩ adiantada</b>':'')); beep(true); return; }
  var m=r.motivo;
  if(m==='falta_sku'){ aguardando={code:enviado}; banner('esp','Agora bipe a persiana desta caixa',quem(r)+' — a etiqueta do SKU colada por fora.'); beep(true); return; }
  if(m==='sku_divergente'){ banner('err','Persiana errada nesta caixa','A venda é <b>'+esc0(r.esperado)+'</b>, você bipou <b>'+esc0(r.lido)+'</b>. <b>Não coloque no carrinho.</b> Separe a caixa e avise.'); beep(false); return; }
  if(m==='conferir_pecas'){ caixaPecas={id:r.pedido.id, r:r, destino:ultimoDestino}; desenharPecas(r,''); beep(true); return; }
  if(m==='mesma_pessoa'){ banner('err','Você imprimiu esta etiqueta','Outra pessoa confere esta caixa, com o login dela. Ela continua em "Faltam bipar".'
    +'<div class="acoes" style="margin-top:8px"><button class="btn" onclick="trocarPessoa()">👤 Trocar de pessoa</button></div>'); beep(false); return; }
  if(m==='ja_no_carrinho'){ banner('warn','Já está no '+esc0(nomeDest(r.carrinho)),quem(r)); beep(false); return; }
  if(m==='duplicado'){ banner('warn','Esta caixa já saiu ou já foi conferida',quem(r)); beep(false); return; }
  if(m==='nao_encontrado'){ banner('err','Etiqueta não reconhecida','O código '+esc0(r.lido||enviado||'')+' não é de nenhuma caixa com etiqueta de venda. Bipe a etiqueta de VENDA da caixa.'); beep(false); return; }
  banner(m==='sem_carrinho'?'warn':'err', {sem_carrinho:'Escolha o carrinho primeiro',carrinho_invalido:'Carrinho fora do cadastro',cancelada:'Venda cancelada: não carregar',
    bloqueado:'BLOQUEADO — SKU fora do cadastro',nao_embalado:'Esta caixa não tem etiqueta de venda'}[m]||'Não deu para conferir',
    (r.pedido?quem(r)+'<br>':'')+esc0(r.aviso||''));
  beep(false);
}
function desenharPecas(r, erro){
  var p=r.pecas||[];
  banner('esp','📦 Esta caixa leva '+(r.pecas_total||pecasDe(p))+' persianas: bipe cada uma ('+(r.bipadas||0)+' de '+(r.pecas_total||'?')+')',
    quem(r)+' — as etiquetas coladas por fora da caixa.'
    +'<div class="pecas">'+p.map(function(x){ var ok=(x.bipadas||0)>=Math.max(1,x.qtd||1);
      return '<div class="pc'+(ok?' ok':'')+'"><span>'+(ok?'✓':'○')+'</span><b>'+Math.max(1,x.qtd||1)+' ×</b> '+esc0(x.codigo)+(x.qtd>1?' — '+(x.bipadas||0)+' de '+x.qtd:'')+'</div>'; }).join('')+'</div>'
    +(erro?'<div style="margin-top:8px;font-weight:700;color:var(--red)">'+esc0(erro)+'</div>':'')
    +'<div class="acoes" style="margin-top:8px"><button class="btn" onclick="recomecarCaixa()">↺ Recomeçar esta caixa</button><button class="btn" onclick="sairDaCaixa()">Deixar esta caixa para depois</button></div>');
}
async function bipPeca(code){
  /* O LEITOR QUE REPETE NÃO VIRA PERSIANA A MAIS (R-PEC-04): o mesmo código em
     menos de 700 ms é a mesma leitura. O servidor não tem trava própria. */
  var agora=Date.now();
  if(ultimaPeca.c===code && agora-ultimaPeca.t<700) return;
  ultimaPeca={c:code,t:agora};
  /* As peças vão para o MESMO destino do bipe da etiqueta: com a entrega
     aberta, o carrinho que está sendo entregue (③ REVISÃO, rodada 2). */
  var r=await postJ('/api/carregar/peca',{lote_id:caixaPecas.id, sku:code, carrinho:caixaPecas.destino||ativo||''});
  if(r.ok && r.bipadas<r.pecas_total){ caixaPecas.r=r; desenharPecas(r,''); beep(true); return; }
  if(r.ok){ caixaPecas=null; banner('ok','✓ Caixa de '+r.pecas_total+' persianas no '+esc0(nomeDest(r.carrinho||'?')),quem(r)); beep(true); carregar();
    if(estado==='entrega' && ENT){ if(ENT.passo===3 && ENT.res){ ENT.res=null; banner('ok','✓ Caixa de '+r.pecas_total+' persianas no '+esc0(nomeDest(r.carrinho||'?')),'Agora toque em <b>Comparar e fechar</b> de novo.'); } atualizarPrevia(); }
    return; }
  if(r.motivo==='peca_divergente'){ caixaPecas.r=Object.assign({},caixaPecas.r,{pecas:r.pecas,bipadas:r.bipadas}); desenharPecas(caixaPecas.r,r.aviso); beep(false); return; }
  caixaPecas=null; mostrar(r);
}
async function recomecarCaixa(){ if(!caixaPecas) return; ultimaPeca={c:'',t:0};
  var r=await postJ('/api/carregar/recomecar',{lote_id:caixaPecas.id});
  caixaPecas.r=Object.assign({},caixaPecas.r,{pecas:r.pecas,bipadas:r.bipadas}); desenharPecas(caixaPecas.r,''); $('#scan').focus(); }
function sairDaCaixa(){ caixaPecas=null; banner('','Pronto','Bipe a etiqueta de venda da caixa.'); $('#scan').focus(); }

/* ===================== RECONTAGEM (cega) ===================== */
function abrirRecontar(c, daEntrega){ estado='recontar'; REC={c:c, codes:[], fim:null, daEntrega:!!daEntrega};
  banner('esp','Bipe cada caixa do '+nomeDest(c),'Contagem cega: a tela não mostra quantas deveria ter. Conte o que está no carrinho.'); desenharPainel(); $('#scan').focus(); }
async function bipRecontar(code){
  var k=code.toUpperCase();
  if(REC.codes.indexOf(k)>=0){ banner('warn','Já bipada nesta recontagem',''); beep(false); return; }
  /* Depois de "Terminei", o bipe é o "achei" da caixa que faltou: a conta se
     refaz no servidor com ela (③ REVISÃO: antes o bipe era ignorado, calado). */
  if(REC.fim){
    var r=await postJ('/api/carrinho/recontar',{carrinho:REC.c, codes:REC.codes.concat([k]), ids:REC.ids||[]});
    if(r.ok){ REC.codes.push(k); REC.fim=r; banner(r.bateu?'ok':'warn', r.bateu?'Recontagem bateu':'✓ Contada — a conta foi refeita',''); beep(true); desenharRecontar(); carregar(); }
    else { banner('err','Não deu',esc0(r.aviso||'')); beep(false); }
    return; }
  REC.codes.push(k); banner('ok','✓ Contada','Bipadas: '+REC.codes.length); beep(true); desenharRecontar();
}
function desenharRecontar(){
  var R=REC, h='';
  if(!R.fim){
    h='<div style="font-size:26px;font-weight:800">Bipadas: '+R.codes.length+'</div>'
     +'<div class="acoes"><button class="btn" onclick="voltarBipar()">Desistir</button><button class="btn ok big" onclick="terminarRecontar()">Terminei a recontagem</button></div>';
  } else {
    var f=R.fim;
    h='<div class="cmp"><div>Recontagem<b>'+f.contadas+'</b></div><div>Na conferência<b>'+f.esperadas+'</b></div></div>';
    if(f.bateu) h+='<div class="banner ok"><div class="bt">Bateu ✓</div><div class="bs">Fica registrado quem recontou.</div></div>';
    if(f.faltam.length) h+='<div class="banner err"><div class="bt">Faltam '+f.faltam.length+' no carrinho</div><div class="bs">A conferência pôs estas no '+nomeDest(R.c)+' e a recontagem não achou. "Não achei" tira a caixa do carrinho e cria uma pendência; o estoque não mexe.</div></div>'
      +'<div class="lista">'+f.faltam.map(function(c){ return linha(c,'<button class="btn sm ok" onclick="recAchei('+c.id+')">Achei</button><button class="btn sm red" onclick="recNao('+c.id+')">Não achei</button>'); }).join('')+'</div>';
    if(f.sobraram.length) h+='<div class="banner warn"><div class="bt">'+f.sobraram.length+' caixa de outro carrinho</div><div class="bs">Estava aqui, mas a conferência pôs em outro lugar.</div></div>'
      +'<div class="lista">'+f.sobraram.map(function(c){ return linha(c,'<button class="btn sm pri" onclick="recPassar('+c.id+')">Passar para o '+esc0(nomeDest(R.c))+'</button>'); }).join('')+'</div>';
    if(f.nao_conferidas && f.nao_conferidas.length) h+='<div class="banner warn"><div class="bt">'+f.nao_conferidas.length+' caixa sem conferência no carrinho</div><div class="bs">Ela foi impressa e ninguém bipou. Termine a recontagem e confira a caixa no bipe normal.</div></div>'
      +'<div class="lista">'+f.nao_conferidas.map(function(c){ return linha(c); }).join('')+'</div>';
    if(f.desconhecidos && f.desconhecidos.length) h+='<div class="nota">Códigos que não são caixa conferida: '+f.desconhecidos.map(esc0).join(', ')+'. Tire do carrinho e deixe separado.</div>';
    var pend=f.faltam.length||f.sobraram.length;
    h+='<div class="acoes"><button class="btn ok big"'+(pend?' disabled':'')+' onclick="fimRecontar()">'+(R.daEntrega?'Voltar para a entrega':'Concluir')+'</button></div>';
  }
  $('#painel').innerHTML=h;
}
async function terminarRecontar(){
  var r=await postJ('/api/carrinho/recontar',{carrinho:REC.c, codes:REC.codes});
  if(!r.ok){ banner('err','Não deu para recontar',esc0(r.aviso||'')); beep(false); return; }
  REC.fim=r; banner(r.bateu?'ok':'warn', r.bateu?'Recontagem bateu':'Recontagem não bateu',''); desenharRecontar(); carregar();
}
async function recAchei(id){
  /* "Achei" (ou o bipe dela): a caixa estava no carrinho. A recontagem refaz
     no servidor, com ela junto, e a linha nova fica gravada. */
  REC.ids=(REC.ids||[]).concat([id]);
  var r=await postJ('/api/carrinho/recontar',{carrinho:REC.c, codes:REC.codes, ids:REC.ids});
  if(r.ok){ REC.fim=r; desenharRecontar(); carregar(); } else { banner('err','Não deu',esc0(r.aviso||'')); beep(false); } }
async function recNao(id){ var r=await postJ('/api/carrinho/nao-achou',{lote_id:id});
  if(!r.ok){ banner('err','Não deu',esc0(r.aviso||'')); beep(false); return; }
  REC.fim.faltam=REC.fim.faltam.filter(function(x){ return x.id!==id; }); REC.fim.esperadas--;
  banner('warn','Caixa fora do carrinho','Ela virou pendência para procurar. Achando, bipe num carrinho: ela entra sem baixar o estoque de novo.');
  desenharRecontar(); carregar(); }
async function recPassar(id){ var r=await postJ('/api/carrinho/passar',{lote_id:id, carrinho:REC.c});
  if(!r.ok){ banner('err','Não deu',esc0(r.aviso||'')); beep(false); return; }
  REC.fim.sobraram=REC.fim.sobraram.filter(function(x){ return x.id!==id; }); REC.fim.esperadas++;
  if(!REC.fim.faltam.length && !REC.fim.sobraram.length) REC.fim.bateu=true;
  desenharRecontar(); carregar(); }
function fimRecontar(){ var volta=REC.daEntrega; REC=null;
  if(volta && ENT){ estado='entrega'; ENT.passo=3; ENT.res=null; banner('','Entrega','Digite de novo o número do '+(ENT.para==='agencia'?'atendente':'motorista')+'.'); desenharPainel(); }
  else voltarBipar(); }

/* ===================== ENTREGA ===================== */
function abrirEntrega(c){
  estado='entrega'; ENT={sel:[c], passo:0, para:c==='AG'?'agencia':'motorista', foto:null, numero:'', levou:'', motivo:'', res:null, previa:null};
  banner('','Entregar','Quem entrega é quem está logado.'); desenharFaixa(); atualizarPrevia();
}
async function atualizarPrevia(){
  try{ ENT.previa=await (await fetch('/api/entrega/previa?destinos='+encodeURIComponent(ENT.sel.join(',')))).json(); }catch(e){ ENT.previa=null; }
  if(ENT.passo===0 && ENT.previa && !(ENT.previa.faltam_bipar||[]).length) ENT.passo=1;
  if(!digitando()) desenharEntrega();
}
function desenharEntrega(){
  var E=ENT; if(!E) return;
  var quemRecebe=E.para==='agencia'?'atendente da agência':'motorista';
  var h='<div class="passos">'+['Antes de entregar','Carrinhos','Foto','Número'].map(function(n,i){ return '<span class="'+(E.passo===i?'on':E.passo>i?'feito':'')+'">'+n+'</span>'; }).join('')+'</div>';
  if(E.passo===0){
    var pend=(E.previa&&E.previa.faltam_bipar)||[];
    h+='<div class="banner warn"><div class="bt">'+(pend.length===1?'Ainda falta 1 caixa impressa sem bipar':'Ainda faltam '+pend.length+' caixas impressas sem bipar')+'</div><div class="bs">Bipe agora se estiverem aí. Elas não entram nesta entrega sem o bipe.</div></div>'
      +'<div class="lista">'+pend.map(function(c){ return linha(Object.assign({coleta:c.modalidade==='coleta'},c)); }).join('')+'</div>'
      +'<div class="acoes"><button class="btn" onclick="voltarBipar()">Voltar</button><button class="btn" onclick="ENT.passo=1;desenharEntrega()">Seguir sem elas →</button></div>';
  } else if(E.passo===1){
    var temAG=(D.destinos||[]).some(function(d){ return d.codigo==='AG' && d.n; });
    var disp=(D.destinos||[]).filter(function(d){ return d.n && (E.para==='motorista' || d.codigo==='AG'); });
    h+='<div class="banner"><div class="bt">O que vai ser entregue?</div><div class="bs">Pode entregar um carrinho agora e o outro depois, ou vários juntos com uma foto só.</div></div>';
    if(temAG) h+='<div class="acoes"><span class="nota">Para quem:</span><button class="btn sm'+(E.para==='motorista'?' pri':'')+'" onclick="setPara(\'motorista\')">🚚 Motorista da coleta</button>'
      +'<button class="btn sm'+(E.para==='agencia'?' pri':'')+'" onclick="setPara(\'agencia\')">🚗 Agência</button></div>';
    h+='<div class="dest">'+disp.map(function(d){ var on=E.sel.indexOf(d.codigo)>=0;
      return '<button class="dc'+(on?' ativo':'')+'" onclick="selDest(\''+d.codigo+'\')"><span class="n">'+(on?'☑ ':'☐ ')+esc0(d.nome)+'</span><span class="q">'+d.n+'</span><span class="l">caixas'+(d.recontado?' · recontado ✓':'')+'</span></button>'; }).join('')+'</div>'
      +(function(){ var ad=((E.previa&&E.previa.caixas)||[]).filter(function(c){ return c.adiantada; });
        return ad.length?'<div class="banner warn"><div class="bt">'+ad.length+' caixa'+(ad.length===1?' adiantada':'s adiantadas')+' nesta entrega</div><div class="bs">'
          +ad.map(function(c){ return esc0(c.buyer)+' (despacha '+dataBR(c.despachar_em)+')'; }).join(' · ')+'</div></div>':''; })()
      +'<div class="acoes"><button class="btn" onclick="voltarBipar()">Voltar</button><button class="btn ok big"'+(E.sel.length?'':' disabled')+' onclick="ENT.passo=2;desenharEntrega()">Continuar →</button></div>';
  } else if(E.passo===2){
    h+='<div class="banner"><div class="bt">Foto da tela do '+quemRecebe+'</div><div class="bs">A tela do celular dele com a quantidade que ele bipou. Sem a foto não fecha.</div></div>'
      +'<div class="acoes"><div class="foto">'+(E.foto?'<img alt="Foto da tela" src="'+E.foto+'">':'sem foto')+'</div>'
      +'<label class="btn pri" style="display:inline-flex;align-items:center">📷 '+(E.foto?'Tirar outra':'Tirar ou escolher a foto')+'<input id="fotoIn" type="file" accept="image/*" hidden></label></div>'
      +'<div class="acoes"><button class="btn" onclick="ENT.passo=1;desenharEntrega()">← Voltar</button><button class="btn ok big"'+(E.foto?'':' disabled')+' onclick="ENT.passo=3;desenharEntrega()">Continuar →</button></div>';
  } else {
    var sis=(D.destinos||[]).filter(function(d){ return E.sel.indexOf(d.codigo)>=0; }).reduce(function(s,d){ return s+d.n; },0);
    h+='<div class="nota">Entregando: '+E.sel.map(nomeDest).join(' + ')+' ao '+quemRecebe+'.</div>';
    if(E.para==='agencia') h+='<label><b>Quem levou à agência</b><select class="txt" id="quemLevou" onchange="ENT.levou=this.value"><option value="">— escolha —</option>'
      +(pessoas||[]).map(function(p){ return '<option value="'+p.id+'"'+(String(E.levou)===String(p.id)?' selected':'')+'>'+esc0(p.nome)+'</option>'; }).join('')+'</select></label>';
    h+='<div class="acoes"><b>Quantas o '+quemRecebe+' bipou?</b><input id="numEnt" class="num" type="number" min="0" inputmode="numeric" value="'+esc0(E.numero)+'" oninput="ENT.numero=this.value">'
      +'<button class="btn ok big" onclick="fecharEntrega(false)">Comparar e fechar</button></div>';
    if(E.res && E.res.motivo==='divergente'){
      h+='<div class="cmp"><div>Sistema<b>'+E.res.sistema+'</b></div><div>'+(E.para==='agencia'?'Atendente':'Motorista')+'<b>'+E.res.numero+'</b></div></div>'
        +'<div class="banner err"><div class="bt">Não bateu</div><div class="bs">'+(E.res.numero>E.res.sistema
          ?'O '+quemRecebe+' bipou a mais: uma caixa foi sem o bipe. <b>Ache a caixa e bipe-a agora</b> — ela entra no carrinho e na conta.'
          :'Pode ter ficado caixa no carrinho. Reconte antes de liberar.')+'</div></div>'
        +'<div class="acoes">'+E.sel.map(function(c){ return '<button class="btn" onclick="abrirRecontar(\''+c+'\',true)">🔁 Recontar '+esc0(nomeDest(c))+'</button>'; }).join('')+'</div>'
        +'<div class="card" data-perm="saida.liberar" style="background:var(--panel)"><b>Liberar com divergência</b><div class="nota">Só quem tem a permissão de liberar, com o motivo.</div>'
        +'<input class="txt" id="motivoLib" placeholder="Por que está liberando com número diferente?" maxlength="300" value="'+esc0(E.motivo)+'" oninput="ENT.motivo=this.value">'
        +(E.res.aviso_lib?'<div style="font-weight:700;color:var(--red)">'+esc0(E.res.aviso_lib)+'</div>':'')
        +'<div class="acoes"><button class="btn red" data-perm="saida.liberar" onclick="fecharEntrega(true)">Liberar com divergência</button></div></div>';
    } else if(E.res && E.res.aviso){
      h+='<div class="banner err"><div class="bt">Não fechou</div><div class="bs">'+esc0(E.res.aviso)+'</div></div>';
    }
    h+='<div class="acoes"><button class="btn" onclick="ENT.passo=2;desenharEntrega()">← Voltar</button><button class="btn" onclick="voltarBipar()">Cancelar a entrega</button></div>';
  }
  $('#painel').innerHTML=h;
  var fi=document.getElementById('fotoIn');
  if(fi) fi.onchange=async function(){ var f=fi.files&&fi.files[0]; if(!f) return;
    try{ ENT.foto=await reduzirFoto(f); }catch(e){ ENT.foto=null; banner('err','Não deu para ler a foto','Tente de novo.'); }
    desenharEntrega(); };
  if(E.passo===3 && E.para==='agencia' && !pessoas) carregarPessoas();
}
function setPara(p){ ENT.para=p; ENT.sel=p==='agencia'?ENT.sel.filter(function(c){ return c==='AG'; }):ENT.sel; desenharEntrega(); }
function selDest(c){ var i=ENT.sel.indexOf(c); if(i>=0) ENT.sel.splice(i,1); else ENT.sel.push(c); atualizarPrevia(); }
/* Quem levou: as pessoas ativas do cadastro. Chegam depois do passo aberto, e
   por isso preenchem SÓ a lista — redesenhar o passo apagaria o número e o
   motivo que a pessoa já está digitando (§12). */
async function carregarPessoas(){
  try{ pessoas=await (await fetch('/api/auth/pessoas')).json(); }catch(e){ pessoas=null; return; }
  var sel=document.getElementById('quemLevou'); if(!sel) return;
  sel.innerHTML='<option value="">— escolha —</option>'+(pessoas||[]).map(function(p){ return '<option value="'+p.id+'"'+(ENT&&String(ENT.levou)===String(p.id)?' selected':'')+'>'+esc0(p.nome)+'</option>'; }).join('');
}
function reduzirFoto(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ var img=new Image();
      img.onload=function(){ var max=1600, w=img.width, h=img.height, k=Math.min(1,max/Math.max(w,h));
        var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.85)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
async function fecharEntrega(liberar){
  var E=ENT;
  var r=await postJ(liberar?'/api/entrega/liberar':'/api/entrega/fechar',{destinos:E.sel, para:E.para, numero:E.numero, foto:E.foto,
    quem_levou_id:E.levou, motivo:E.motivo});
  if(r.__status===403){ banner('err','Sem permissão','Liberar com número diferente é de quem tem a permissão de liberar a saída.'); beep(false); return; }
  if(r.ok){ banner('ok','✓ Entrega fechada','Sistema '+r.sistema+' · '+(E.para==='agencia'?'atendente':'motorista')+' '+r.numero+(r.divergente?' · liberado com divergência':'')+'. As caixas saíram da fábrica.');
    beep(true); ENT=null; estado='bipar'; carregar(); desenharPainel(); desenharFaixa(); $('#scan').focus(); return; }
  /* A recusa do liberar (sem motivo) não apaga o bloco da divergência: o
     motivo se escreve ali mesmo (③ REVISÃO). */
  if(r.motivo==='sem_motivo' && E.res && E.res.motivo==='divergente'){ E.res.aviso_lib=r.aviso; beep(false); desenharEntrega(); return; }
  E.res=r; beep(false); desenharEntrega();
}

/* ===================== VENDA CANCELADA ===================== */
function abrirCancelada(){ estado=estado==='cancelada'?'bipar':'cancelada'; CANC={pend:null, skus:[], motivo:null, texto:'', erro:''};
  if(estado==='bipar') return voltarBipar();
  banner('err','✕ Venda cancelada','Bipe a etiqueta de VENDA da caixa cancelada. Separar não mexe no estoque.'); desenharPainel(); $('#scan').focus(); }
function soCod(c){ return String(c||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase(); }
async function bipCancelada(code){
  if(!CANC.pend){
    var r=await postJ('/api/carregamento/sobra',{code:code});
    if(!r.ok){ banner('err','Não dá para separar esta caixa',(r.pedido?quem(r)+'<br>':'')+esc0(r.aviso||'')); beep(false); return; }
    CANC.pend=r; CANC.faltam=r.faltam||0; beep(true); desenharCancelada(); return;
  }
  var lista=CANC.skus.concat([code]);
  var r2=await postJ('/api/carregamento/sobra',{id:CANC.pend.pedido.id, skus:lista});
  if(!r2.ok){ CANC.erro=r2.aviso||'Este bipe não vale para esta caixa.'; beep(false); desenharCancelada(); return; }
  CANC.skus=lista; CANC.faltam=r2.faltam||0; CANC.erro=''; beep(true); desenharCancelada();
}
function desenharCancelada(){
  var C=CANC, h='';
  if(C && C.pend){
    var r=C.pend, bip={}; C.skus.forEach(function(c){ var k=soCod(c); bip[k]=(bip[k]||0)+1; });
    h+=linha(Object.assign({itens:r.pecas},r.pedido,{coleta:r.pedido.modalidade==='coleta'}))
      +'<div class="pecas">'+(r.pecas||[]).map(function(p){ if(p.sob_medida) return '<div class="pc">'+esc0(p.codigo)+' — sob medida, não tem SKU a bipar</div>';
        var q=Math.max(1,p.qtd||1), b=Math.min(q,bip[soCod(p.codigo)]||0);
        return '<div class="pc'+(b>=q?' ok':'')+'"><span>'+(b>=q?'✓':'○')+'</span><b>'+q+' ×</b> '+esc0(p.codigo)+(q>1?' — '+b+' de '+q:'')+'</div>'; }).join('')+'</div>'
      +(C.faltam?'<div class="nota"><b>Bipe o SKU de cada persiana</b> (falta'+(C.faltam===1?' 1':'m '+C.faltam)+').</div>':'')
      +(C.erro?'<div style="font-weight:700;color:var(--red)">'+esc0(C.erro)+'</div>':'')
      +'<b>Motivo</b><div class="acoes">'+[['cancelada','Venda cancelada'],['motorista','Motorista recusou'],['outro','Outro']].map(function(m){
        return '<button class="btn sm'+(C.motivo===m[0]?' pri':'')+'" onclick="CANC.motivo=\''+m[0]+'\';desenharCancelada()">'+m[1]+'</button>'; }).join('')+'</div>'
      +(C.motivo==='outro'?'<input class="txt" id="cancTexto" maxlength="160" placeholder="Escreva o motivo" value="'+esc0(C.texto)+'" oninput="CANC.texto=this.value">':'')
      +'<div class="acoes"><button class="btn red"'+(!C.faltam&&C.motivo?'':' disabled')+' onclick="separar()">Separar como venda cancelada</button>'
      +'<button class="btn" onclick="CANC={pend:null,skus:[],motivo:null,texto:\'\',erro:\'\'};desenharCancelada();$(\'#scan\').focus()">Bipei a caixa errada</button></div>';
  }
  var sep=CANC_LISTA.caixas||[], ag=CANC_LISTA.aguardando||[];
  h+='<h2 style="margin-top:6px">Canceladas no ML ainda na fábrica ('+sep.length+')</h2><div class="lista">'+(sep.length?sep.map(function(v){
      return linha({buyer:v.buyer,nf:v.nf,codigo:v.codigo,coleta:v.modalidade==='coleta'},'<span class="nota">'+esc0(v.cancelada_motivo||'venda cancelada')+' — bipe a etiqueta</span>'); }).join(''):'<div class="vazio">Nenhuma.</div>')+'</div>'
    +'<h2>Aguardando confirmação no ML ('+ag.length+')</h2><div class="lista">'+(ag.length?ag.map(function(p){
      return linha({buyer:p.buyer,nf:p.nf,codigo:((p.pecas||[])[0]||{}).codigo||p.codigo,itens:p.pecas,coleta:p.modalidade==='coleta'},
        '<span class="nota">separada por '+esc0(p.marcado_por||'?')+' · '+esc0(p.motivo||'')+'</span>'
        +(CANC_LISTA.pode_confirmar?'<button class="btn sm ok" onclick="decidir('+p.id+',\'confirmar\')">Confirmar no ML</button><button class="btn sm" onclick="decidir('+p.id+',\'recusar\')">Recusar</button>':'')); }).join(''):'<div class="vazio">Nenhuma.</div>')+'</div>'
    +(ag.length&&!CANC_LISTA.pode_confirmar?'<div class="nota">Confirma outra pessoa, com a permissão "Confirmar venda cancelada".</div>':'')
    +'<div class="acoes"><button class="btn" onclick="voltarBipar()">Fechar</button></div>';
  $('#painel').innerHTML=h;
}
async function separar(){
  var r=await postJ('/api/carregamento/sobra',{id:CANC.pend.pedido.id, skus:CANC.skus, motivo:CANC.motivo, texto:CANC.texto, confirmar:true});
  if(!r.ok){ CANC.erro=r.aviso||'Não separei. Tente de novo.'; beep(false); desenharCancelada(); return; }
  banner('warn','✕ Separada como venda cancelada',quem(r)+'<br>'+esc0(r.aviso||'')); beep(true);
  CANC={pend:null, skus:[], motivo:null, texto:'', erro:''}; carregar();
}
async function decidir(id, acao){
  var corpo={id:id};
  if(acao==='confirmar'){ if(!confirm('Confirmar que a venda está CANCELADA no Mercado Livre? Se a caixa já tinha baixado, as peças voltam ao estoque.')) return; }
  else { var m=prompt('Por que o cancelamento foi recusado? A caixa volta para a lista.'); if(m===null) return;
    if(!String(m).trim()){ banner('warn','Escreva o motivo da recusa',''); beep(false); return; } corpo.motivo=m; }
  var r=await postJ('/api/carregamento/cancelada/'+acao,corpo);
  if(r.__status===403){ banner('err','Sem permissão','Confirmar ou recusar é de quem tem a permissão "Confirmar venda cancelada".'); beep(false); return; }
  banner(r.ok?(acao==='confirmar'?'ok':'warn'):'err', r.ok?(acao==='confirmar'?'✓ Cancelamento confirmado':'Cancelamento recusado'):'Não deu', esc0(r.aviso||r.erro||'')); beep(!!r.ok);
  carregar();
}

/* ===================== A COLETA NÃO PASSOU ===================== */
function abrirNaoPassou(){ estado=estado==='naopassou'?'bipar':'naopassou'; if(estado==='bipar') return voltarBipar(); desenharPainel(); }
function desenharNaoPassou(){
  /* O mesmo conjunto que o servidor registra (o fimdia): toda caixa com
     etiqueta ainda na fábrica — impressa sem bipe, nos carrinhos e conferida
     fora deles, coleta e agência (③ REVISÃO: a frase dizia só as de coleta). */
  var hoje=function(c){ return !c.adiantada; };   // a venda futura não "ficou": o servidor não a registra
  var n=((D&&D.nos)||[]).filter(hoje).length + ((D&&D.faltam)||[]).filter(hoje).length + ((D&&D.sem_carrinho)||[]).filter(hoje).length;
  $('#painel').innerHTML='<div class="banner warn"><div class="bt">'+(n===1?'1 caixa com etiqueta fica':n+' caixas com etiqueta ficam')+' na fábrica</div><div class="bs">Fica registrado quem marcou e quais caixas. Amanhã elas aparecem em cima, com o selo "de ontem". Nada muda no estoque, e as caixas continuam nos carrinhos.</div></div>'
    +'<div class="acoes"><button class="btn" onclick="voltarBipar()">Voltar</button><button class="btn pri big" onclick="naoPassou()">Confirmar: a coleta não passou</button></div>';
}
async function naoPassou(){
  var r=await postJ('/api/carregamento/fimdia',{});
  if(r.ok){ banner('ok','🚚 Registrado: a coleta não passou hoje','<b>'+r.caixas+'</b> caixa'+(r.caixas===1?'':'s')+' ficam esperando.'); beep(true); voltarBiparSemBanner(); }
  else { banner('err','Não registrei',esc0(r.aviso||r.erro||'')); beep(false); }
  carregar();
}
function voltarBiparSemBanner(){ estado='bipar'; desenharPainel(); desenharFaixa(); $('#scan').focus(); }

/* ===================== O CAMPO DO BIPE ===================== */
var scan=$('#scan');
scan.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); var v=scan.value.trim(); scan.value=''; if(v) bip(v).catch(semConexao); } });
scan.focus();
/* O CAMPO DO BIPE NÃO FICA SEM DONO (§12, ③ REVISÃO): o leitor digita no que
   tem o foco. Depois de tocar num botão, num filtro ou no vazio, o foco volta
   ao bipe — menos quando a pessoa está num campo de digitar. preventScroll:
   devolver o foco não arrasta a tela. */
var semKeepAte=0;   // tocar na foto abre o seletor do aparelho: o foco não volta ao bipe por cima dele
function keep(){ if(Date.now()<semKeepAte) return; var a=document.activeElement; if(a===scan) return;
  if(a && (DIGITACAO.indexOf(a.id)>=0 || a.id==='fotoIn' || a.tagName==='SELECT' || (a.tagName==='INPUT' && a.type!=='button'))) return;
  scan.focus({preventScroll:true}); }
scan.addEventListener('blur',function(){ setTimeout(keep,50); });
document.addEventListener('click',function(e){ if(e.target.closest('label')) semKeepAte=Date.now()+4000;
  if(!e.target.closest('input,select,label,textarea')) setTimeout(keep,50); });
/* A atualização de 4 s espera quem está digitando: redesenhar por baixo de um
   campo com foco fecha o teclado do iPad (§12). O campo do bipe não conta. */
var DIGITACAO=['numEnt','motivoLib','cancTexto','quemLevou'];
function digitando(){ var a=document.activeElement; return !!(a && DIGITACAO.indexOf(a.id)>=0); }
carregar(); setInterval(function(){ if(!digitando()) carregar(); },4000);
</script><script src="/nav.js"></script>
