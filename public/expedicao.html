<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expedição — leitura de PDFs</title>
<style>
  body{margin:0;background:#0e1217;color:#e6edf3;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid #262d37;display:flex;gap:12px;align-items:center}
  .mark{width:32px;height:32px;border-radius:8px;background:#ffb800;display:grid;place-items:center;color:#1a1300;font-weight:800}
  .wrap{max-width:900px;margin:0 auto;padding:22px}
  .drop{border:2px dashed #262d37;border-radius:14px;padding:34px;text-align:center;background:#161b22;cursor:pointer}
  .drop:hover{border-color:#ffb800}
  .res{margin:16px 0;font-size:14px;color:#8b97a5}
  .res b{color:#e6edf3}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #262d37}
  th{font-size:11px;color:#8b97a5;text-transform:uppercase}
  td.c{font-family:ui-monospace,monospace}
  button{cursor:pointer;border:0;border-radius:8px;font-weight:600;padding:8px 14px}
  .pr{background:#0b0f14;border:1px solid #262d37;color:#e6edf3;font-size:12px}
  .link{margin-left:auto;font-size:13px;color:#8b97a5;text-decoration:none;border:1px solid #262d37;padding:8px 12px;border-radius:8px}
  iframe{position:fixed;left:-9999px;width:0;height:0;border:0}
</style></head><body>
<header><div class="mark">X</div><div><b>Expedição — leitura de PDFs</b><div style="font-size:12px;color:#8b97a5">Suba um ou vários PDFs do Mercado Livre</div></div>
<a class="link" href="/painel">Painel</a></header>
<div class="wrap">
  <div class="drop" id="drop">📄 Clique ou solte um ou mais PDFs do Mercado Livre aqui
    <input type="file" id="file" accept="application/pdf" multiple style="display:none"></div>
  <div class="res" id="res"></div>
  <table id="tbl" style="display:none"><thead><tr><th>#</th><th>SKU</th><th>Comprador</th><th>NF</th><th>Estágio</th><th></th></tr></thead><tbody id="corpo"></tbody></table>
</div>
<iframe id="pr"></iframe>
<script>
const $=s=>document.querySelector(s);
$('#drop').onclick=()=>$('#file').click();
$('#file').onchange=e=>{ upMany(e.target.files); e.target.value=''; };
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>e.preventDefault()));
$('#drop').addEventListener('drop',e=>{e.preventDefault(); upMany(e.dataTransfer.files);});
function b64(f){ return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);}); }
function avisoQuantidade(qtd,contas){
  /* A conferencia da quantidade (spec CONFERENCIA-DA-QUANTIDADE): caixa retida
     porque as leituras da folha discordam, e PDF cuja conta de persianas nao
     fecha. Os dois em vermelho: o segundo nao retem ninguem, e por isso mesmo
     precisa gritar antes de alguem imprimir.
     A venda da folha SEM etiqueta no PDF sai pelo numero (27/10/2026): o
     primeiro caso real era uma venda que nunca entrou no sistema, e o aviso
     generico mandava procurar uma caixa errada que nao existia. */
  var e=function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var caixa=function(t){ return '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:#fdecea;border:2px solid #c62828;color:#8e1b1b;font-weight:700">⚠ '+t+'</div>'; };
  var h='';
  if(qtd) h+=caixa(qtd+' caixa(s) retida(s) por QUANTIDADE EM DÚVIDA — a folha foi lida de jeitos diferentes e eles não bateram. Confira o pedido no Mercado Livre e libere em Admin → Pendências (pacote).');
  (contas||[]).forEach(function(c){
    var sem=c.semEtiqueta||[];
    sem.forEach(function(v){
      h+=caixa(e(c.nome)+': a venda <b>'+e(v.venda||v.packId)+'</b> ('+e(v.sku)+(v.qtd>1?', '+v.qtd+' peças':'')+') está na folha do ML e <b>sem etiqueta neste PDF</b> — ela não entrou no sistema. Confira no Mercado Livre: se não foi cancelada, falta subir o PDF com a etiqueta dela.');
    });
    var resto=(c.resto!=null)?c.resto:(c.folha-c.sistema);
    if(resto) h+=caixa(e(c.nome)+': a folha do ML tem '+c.folha+' persiana(s) e o sistema gravou '+c.sistema
      +(sem.length?' — '+(c.folha-c.sistema-resto)+' explicada(s) acima, e '+resto+' sem explicação':'')
      +'. Alguma caixa pode estar com peça a menos (ou a mais) — confira antes de imprimir.');
  });
  return h;
}
async function upMany(fileList){
  const files=[...fileList].filter(f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!files.length) return;
  let totQtd=0,contas=[],totNov=0,totRep=0,totRel=0,totSem=0,totPdf=0,totCol=0,totMod=0,ok=0;
  for(let i=0;i<files.length;i++){
    $('#res').innerHTML='Lendo '+(i+1)+' de '+files.length+': <b>'+files[i].name+'</b>…';
    try{
      const j=await (await fetch('/api/lote/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdf:await b64(files[i])})})).json();
      if(j.erro){ console.error(files[i].name, j.erro); continue; }
      totNov+=j.novos; totRep+=j.repetidas; totRel+=j.religadas||0; totQtd+=j.quantidade_duvida||0; if(j.conta_pdf&&!j.conta_pdf.fecha) contas.push(Object.assign({nome:files[i].name},j.conta_pdf)); totSem+=j.sem_sku; totPdf+=j.total; totCol+=j.coleta||0; totMod+=j.modalidade_duvida||0; ok++;
    }catch(e){ console.error(files[i].name,e); }
  }
  $('#res').innerHTML='<b>'+ok+' PDF(s) processado(s)</b> · '+totNov+' vendas adicionadas · '+totPdf+' no total · '+totRep+' repetidas ignoradas · '+totSem+' sem SKU'
    +(totRel?' · <b>'+totRel+' antiga(s) voltaram a ter PDF</b> (já dá pra reimprimir)':'')
    +(totCol?' · <b style="color:#b9a3e6">🚚 '+totCol+' pra coleta (o caminhão do ML vem buscar)</b>':'')
    +(totMod?'<div style="margin-top:8px;color:#d2b8ff;font-weight:700">⚠ '+totMod+' etiqueta(s) num formato desconhecido — retidas. Defina agência ou coleta em Admin → Pendências.</div>':'')
    +avisoQuantidade(totQtd,contas);
  lista();
}
async function lista(){
  const d=await (await fetch('/api/lote')).json();
  $('#tbl').style.display=d.length?'table':'none';
  /* O BOTÃO SÓ EXISTE PARA QUEM JÁ FOI EMBALADO (dívida 13, 17/09/2026).
     Imprimir daqui um volume 'pendente' punha a etiqueta de venda na mão do
     operador sem que o estoque tivesse baixado — a caixa ia pro carro e o saldo
     ficava alto para sempre. O servidor recusa (409), e a lista diz por onde
     imprimir em vez de oferecer um botão que não funciona mais. */
  $('#corpo').innerHTML=d.map(r=>'<tr><td>'+r.id+'</td><td class="c">'+(r.codigo||'<span style=color:#f85149>sem SKU</span>')+'</td><td>'+r.buyer+'</td><td>'+(r.nf||'—')+'</td><td>'+r.estagio+'</td><td>'
    +(r.estagio==='pendente'
        ? '<span style="font-size:12px;color:#8b97a5">imprima pela <b>Etiqueta de Venda</b> (é lá que a peça fica reservada)</span>'
        : '<button class="pr" onclick="imp('+r.id+')">imprimir</button>')
    +'</td></tr>').join('');
}
function imp(id){ const fr=$('#pr'); fr.onload=()=>{ try{fr.contentWindow.print();}catch(e){ window.open('/api/print/'+id,'_blank'); } }; fr.src='/api/print/'+id; }
lista();
</script><script src="/nav.js"></script>
</body></html>
