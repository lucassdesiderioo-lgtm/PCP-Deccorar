<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:#12141a;color:#eef1f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:460px}
  h1{font-size:20px;margin:0 0 4px}.sub{color:#8c94a6;font-size:14px;margin-bottom:22px}
  .nomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nome{padding:18px 14px;background:#1c1f28;border:1px solid #2a2f3a;border-radius:14px;
        font-size:16px;font-weight:600;cursor:pointer;text-align:center}
  .nome:active{background:#252a35}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .k{padding:20px;background:#1c1f28;border:1px solid #2a2f3a;border-radius:14px;
     font-size:22px;font-weight:600;text-align:center;cursor:pointer;user-select:none}
  .k:active{background:#2f3542}
  .dots{display:flex;gap:14px;justify-content:center;margin:22px 0 6px}
  .d{width:16px;height:16px;border-radius:50%;border:2px solid #4a5163}
  .d.on{background:#f0b429;border-color:#f0b429}
  .err{color:#ff6b6b;text-align:center;height:20px;font-size:14px;margin-top:10px}
  .volta{margin-top:16px;text-align:center;color:#8c94a6;font-size:14px;cursor:pointer}
  .hide{display:none}
</style></head><body>
<div class="box">
  <div id="etapa1">
    <h1>Quem esta usando?</h1>
    <div class="sub">Toque no seu nome</div>
    <div class="nomes" id="nomes"></div>
  </div>
  <div id="etapa2" class="hide">
    <h1 id="oi"></h1>
    <div class="sub" id="pede">Digite seu PIN</div>
    <div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div></div>
    <div class="pad">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div>
      <div class="k" data-a="del">&#9003;</div><div class="k">0</div><div class="k" data-a="ok">OK</div>
    </div>
    <div class="err" id="err"></div>
    <div class="volta" id="volta">Nao sou eu &mdash; trocar</div>
  </div>
</div>
<script>
/* PIN DE 6 DIGITOS (ACESSOS-UNIFICADOS fase 5-A, 21/10/2026).
   A tela nao sabe o tamanho do PIN de cada pessoa: quem ja tem 6 entra
   sozinho no sexto digito, e quem ainda tem 4 toca OK. Quem entra com 4 e
   levado a criar o de 6 — e quem tem sessao aberta com PIN de 4 chega aqui
   pelo /login?trocar=1, mandado pelo servidor.

   As etapas usam o mesmo teclado:
     pin   — o PIN de entrar
     atual — o PIN de hoje, para trocar (so quando chegou ja logado)
     novo  — o PIN novo de 6
     conf  — o PIN novo de novo, para conferir */
var alvo=null, pin='', etapa='pin', atual='', novoPin='';
var q=new URLSearchParams(location.search);
var destino=q.get('r')||'';
var MAX=6;
function $(s){return document.querySelector(s);}
var TEXTO={
  pin:'Digite seu PIN. Se ele tem 4 números, toque OK.',
  atual:'O PIN agora tem 6 números. Para trocar, digite o seu PIN de hoje e toque OK.',
  novo:'Crie seu PIN novo, com 6 números.',
  conf:'Digite o PIN novo de novo, para conferir.'
};
function mostrar(e){
  etapa=e; pin=''; pontos();
  $('#pede').textContent=TEXTO[e];
  $('#volta').textContent=(e==='pin')?'Nao sou eu \u2014 trocar':'Entrar com outro usuario';
  $('#etapa1').classList.add('hide'); $('#etapa2').classList.remove('hide');
}
fetch('/api/auth/pessoas').then(r=>r.json()).then(function(l){
  $('#nomes').innerHTML=l.map(p=>'<div class="nome" data-id="'+p.id+'">'+p.nome+'</div>').join('');
});
/* Chegou com a sessao aberta e o PIN ainda de 4: pede o de hoje e troca. */
fetch('/api/auth/eu').then(r=>r.json()).then(function(e){
  if(e&&e.logado&&e.trocarPin){
    alvo={id:e.id,nome:e.nome}; $('#oi').textContent='Ola, '+e.nome; mostrar('atual');
  }
}).catch(function(){});
document.addEventListener('click',function(e){
  var n=e.target.closest('.nome');
  if(n){ alvo={id:+n.dataset.id,nome:n.textContent}; $('#err').textContent='';
         $('#oi').textContent='Ola, '+alvo.nome; mostrar('pin'); return; }
  if(e.target.id==='volta'){
    if(etapa==='pin'){ $('#etapa2').classList.add('hide'); $('#etapa1').classList.remove('hide'); return; }
    fetch('/api/auth/logout',{method:'POST'}).finally(function(){ location.href='/login'; });
    return;
  }
  var k=e.target.closest('.k'); if(!k) return;
  var a=k.dataset.a;
  if(a==='del'){ pin=pin.slice(0,-1); pontos(); return; }
  if(a==='ok'){ enviar(); return; }
  digito(k.textContent.trim());
});
document.addEventListener('keydown',function(e){
  if(!alvo) return;
  if(/^[0-9]$/.test(e.key)) digito(e.key);
  if(e.key==='Backspace'){ pin=pin.slice(0,-1); pontos(); }
  if(e.key==='Enter') enviar();
});
function digito(c){
  if(pin.length>=MAX) return;
  pin+=c; pontos();
  if(pin.length===MAX) setTimeout(enviar,120);
}
function pontos(){
  document.querySelectorAll('.d').forEach(function(d,i){ d.classList.toggle('on',i<pin.length); });
}
function erro(t){ $('#err').textContent=t; pin=''; pontos(); }
function seguir(d){ location.href=destino||((d&&d.inicial)||'/login'); }
function enviar(){
  if(!alvo) return;
  $('#err').textContent='';
  if(etapa==='pin'){
    if(pin.length<4) return;
    var digitado=pin;
    fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:alvo.id,pin:digitado})})
     .then(r=>r.json().then(j=>({ok:r.ok,j:j})))
     .then(function(r){
       if(!r.ok) return erro(r.j.erro||'Erro');
       /* Entrou com o PIN de 4: o de hoje ja foi digitado, vai direto ao novo. */
       if(r.j.trocar_pin){ atual=digitado; return mostrar('novo'); }
       seguir(r.j.destino);
     });
    return;
  }
  if(etapa==='atual'){ if(pin.length<4) return; atual=pin; return mostrar('novo'); }
  if(etapa==='novo'){
    if(pin.length<MAX) return erro('O PIN novo tem que ter 6 números.');
    novoPin=pin; return mostrar('conf');
  }
  if(etapa==='conf'){
    if(pin.length<MAX) return;
    if(pin!==novoPin){ mostrar('novo'); return erro('Os dois PINs não batem. Crie de novo.'); }
    fetch('/api/auth/trocar-pin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({atual:atual,novo:novoPin})})
     .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,j:j})))
     .then(function(r){
       if(r.ok) return seguir(r.j.destino);
       /* O PIN de hoje estava errado: volta a pedi-lo. Os outros erros
          (429, formato) voltam ao PIN novo, com a frase do servidor. */
       if(r.status===401){ mostrar('atual'); return erro(r.j.erro||'PIN atual incorreto'); }
       mostrar(r.status===429?'atual':'novo'); erro(r.j.erro||'Erro');
     });
  }
}
// PARA ONDE A PESSOA VAI DEPOIS DO PIN: quem responde e o servidor
// (`destino.js`, o dono unico), na propria resposta do login. A copia que
// morava aqui tinha divergido da /setor e deixava o vendedor e a bancada do
// sob medida sem destino — voltavam para o login depois do PIN.
</script></body></html>
