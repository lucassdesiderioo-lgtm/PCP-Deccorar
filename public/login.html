<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:#12141a;color:#eef1f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{width:100%;max-width:460px}
  h1{font-size:20px;margin:0 0 4px}.sub{color:#8c94a6;font-size:14px;margin-bottom:22px}
  .nomes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nome{padding:18px 14px;background:#1c1f28;border:1px solid #2a2f3a;border-radius:14px;
        font-size:16px;font-weight:600;cursor:pointer;text-align:center}
  .nome:active{background:#252a35}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .k{padding:20px;background:#1c1f28;border:1px solid #2a2f3a;border-radius:14px;
     font-size:22px;font-weight:600;text-align:center;cursor:pointer;user-select:none}
  .k:active{background:#2f3542}
  .dots{display:flex;gap:14px;justify-content:center;margin:22px 0 6px}
  .d{width:16px;height:16px;border-radius:50%;border:2px solid #4a5163}
  .d.on{background:#f0b429;border-color:#f0b429}
  .err{color:#ff6b6b;text-align:center;height:20px;font-size:14px;margin-top:10px}
  .volta{margin-top:16px;text-align:center;color:#8c94a6;font-size:14px;cursor:pointer}
  .hide{display:none}
  /* A porta para o modulo de tecido. Fica na tela de login porque e onde o
     tablet da bancada ja esta parado — e o cortador nao tem que decorar
     endereco nenhum. E outro sistema, com PIN proprio, e a tela diz isso. */
  .outro{margin-top:26px;padding-top:20px;border-top:1px solid #2a2f3a}
  .outro a{display:block;padding:18px 14px;background:#1c1f28;border:1px solid #f0b429;
     border-radius:14px;color:#f0b429;font-size:17px;font-weight:700;text-align:center;
     text-decoration:none}
  .outro a:active{background:#252a35}
  .outro .obs{color:#8c94a6;font-size:13px;text-align:center;margin-top:8px}
</style></head><body>
<div class="box">
  <div id="etapa1">
    <h1>Quem esta usando?</h1>
    <div class="sub">Toque no seu nome</div>
    <div class="nomes" id="nomes"></div>
    <div class="outro">
      <a id="tecido" href="#">Plano de corte &mdash; tecido sob medida</a>
      <div class="obs">Outro sistema, com PIN proprio</div>
    </div>
  </div>
  <div id="etapa2" class="hide">
    <h1 id="oi"></h1>
    <div class="sub">Digite seu PIN de 4 digitos</div>
    <div class="dots"><div class="d"></div><div class="d"></div><div class="d"></div><div class="d"></div></div>
    <div class="pad">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div>
      <div class="k" data-a="del">&#9003;</div><div class="k">0</div><div class="k" data-a="ok">OK</div>
    </div>
    <div class="err" id="err"></div>
    <div class="volta" id="volta">Nao sou eu &mdash; trocar</div>
  </div>
</div>
<script>
// O modulo de tecido roda na MESMA maquina, em outra porta. O endereco e
// montado a partir de onde esta tela foi aberta: assim funciona pelo IP da
// fabrica, pelo nome da maquina ou pelo localhost, sem ninguem editar nada.
var PORTA_TECIDO=3020;
var alvo=null, pin='';
var destino=new URLSearchParams(location.search).get('r')||'';
function $(s){return document.querySelector(s);}
$('#tecido').href=location.protocol+'//'+location.hostname+':'+PORTA_TECIDO+'/';
fetch('/api/auth/pessoas').then(r=>r.json()).then(function(l){
  $('#nomes').innerHTML=l.map(p=>'<div class="nome" data-id="'+p.id+'">'+p.nome+'</div>').join('');
});
document.addEventListener('click',function(e){
  var n=e.target.closest('.nome');
  if(n){ alvo={id:+n.dataset.id,nome:n.textContent}; pin=''; pontos();
         $('#oi').textContent='Ola, '+alvo.nome; $('#etapa1').classList.add('hide'); $('#etapa2').classList.remove('hide'); return; }
  if(e.target.id==='volta'){ $('#etapa2').classList.add('hide'); $('#etapa1').classList.remove('hide'); return; }
  var k=e.target.closest('.k'); if(!k) return;
  var a=k.dataset.a;
  if(a==='del'){ pin=pin.slice(0,-1); }
  else if(a==='ok'){ enviar(); }
  else if(pin.length<4){ pin+=k.textContent.trim(); }
  pontos();
  if(pin.length===4) setTimeout(enviar,120);
});
document.addEventListener('keydown',function(e){
  if(/^[0-9]$/.test(e.key)&&pin.length<4&&alvo){ pin+=e.key; pontos(); if(pin.length===4) setTimeout(enviar,120); }
  if(e.key==='Backspace'&&alvo){ pin=pin.slice(0,-1); pontos(); }
});
function pontos(){
  document.querySelectorAll('.d').forEach(function(d,i){ d.classList.toggle('on',i<pin.length); });
}
function enviar(){
  if(!alvo||pin.length<4) return;
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:alvo.id,pin:pin})})
   .then(r=>r.json().then(j=>({ok:r.ok,j:j})))
   .then(function(r){
     if(!r.ok){ $('#err').textContent=r.j.erro||'Erro'; pin=''; pontos(); return; }
     location.href=destino||primeira(r.j.areas);
   });
}
function primeira(a){
  var m={admin:'/admin',painel:'/painel',operador:'/operador',montagem:'/montagem',
         expedicao:'/expedicao',embalagem:'/embalagem',carregamento:'/carregamento',
         relatorios:'/relatorios',necessidade:'/necessidade'};
  for(var i=0;i<a.length;i++) if(m[a[i]]) return m[a[i]];
  return '/login';
}
</script></body></html>
