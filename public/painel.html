<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do dia</title>
<style>
  :root{--bg:#0e1217;--panel:#161b22;--line:#262d37;--txt:#e6edf3;--muted:#8b97a5;--amber:#ffb800;--green:#2ea043;--red:#f85149;--blue:#4493f8;--violet:#a371f7}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
  .wrap{max-width:1150px;margin:0 auto;padding:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .kpi .n{font-size:28px;font-weight:800}.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px}
  .kpi.dem .n{color:var(--blue)}.kpi.est .n{color:var(--green)}.kpi.prod .n{color:var(--amber)}.kpi.emb .n{color:var(--violet)}.kpi.car .n{color:#7ee2a0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#11161d;position:sticky;top:0}
  td.code{font-family:ui-monospace,monospace;font-weight:600;text-align:left}
  .cor{font-size:11px;color:var(--muted)}
  .baixo{color:var(--red);font-weight:700}.ok{color:var(--green)}.zero{color:var(--muted)}
  .upd{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}
</style></head><body>
<header><div class="mark">P</div><div><h1>Painel do dia</h1><div class="sub">Produção → estoque → embalado → carregado</div></div>
<div class="links"><a class="link" href="/">Admin</a><a class="link" href="/operador">Revisão</a><a class="link" href="/montagem">Montagem</a><a class="link" href="/embalagem">Expedição</a><a class="link" href="/carregamento">Carregamento</a></div></header>
<div class="wrap">
  <div class="cards">
    <div class="kpi dem"><div class="n" id="kDem">0</div><div class="l">Demanda</div></div>
    <div class="kpi est"><div class="n" id="kEst">0</div><div class="l">Estoque</div></div>
    <div class="kpi prod"><div class="n" id="kProd">0</div><div class="l">Produzido</div></div>
    <div class="kpi emb"><div class="n" id="kEmb">0</div><div class="l">Embalado</div></div>
    <div class="kpi car"><div class="n" id="kCar">0</div><div class="l">Carregado</div></div>
  </div>
  <div class="card"><table><thead><tr>
    <th>SKU</th><th>Demanda</th><th>Estoque</th><th>Alvo</th><th>A produzir</th><th>Produzido</th><th>Embalado</th><th>Carregado</th>
  </tr></thead><tbody id="corpo"></tbody></table></div>
  <div class="upd" id="upd"></div>
</div>
<script>
const $=s=>document.querySelector(s);
async function load(){
  let d; try{ d=await (await fetch('/api/painel')).json(); }catch(e){ return; }
  let dem=0,est=0,prod=0,emb=0,car=0;
  const rows=d.map(r=>{ dem+=r.demanda;est+=r.estoque;prod+=r.produzido;emb+=r.embalado;car+=r.carregado;
    const ec=r.estoque<r.alvo?'baixo':(r.estoque>0?'ok':'zero');
    return '<tr><td class="code">'+r.codigo+'<div class="cor">'+(r.cor||'')+'</div></td>'+
      '<td>'+r.demanda+'</td><td class="'+ec+'">'+r.estoque+'</td><td class="zero">'+r.alvo+'</td>'+
      '<td class="'+(r.aProduzir>0?'baixo':'ok')+'">'+(r.aProduzir||'—')+'</td>'+
      '<td>'+r.produzido+'</td><td style="color:#a371f7">'+r.embalado+'</td><td style="color:#7ee2a0">'+r.carregado+'</td></tr>';
  }).join('');
  $('#corpo').innerHTML=rows||'<tr><td colspan="8" style="color:#8b97a5;padding:20px;text-align:center">Sem dados hoje.</td></tr>';
  $('#kDem').textContent=dem;$('#kEst').textContent=est;$('#kProd').textContent=prod;$('#kEmb').textContent=emb;$('#kCar').textContent=car;
  $('#upd').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR');
}
load(); setInterval(load,3000);
</script><script src="/nav.js"></script>
</body></html>
