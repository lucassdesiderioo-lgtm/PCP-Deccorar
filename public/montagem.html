<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embalagem — Montagem</title>
<style>
  :root{--bg:#0e1217;--panel:#161b22;--line:#262d37;--txt:#e6edf3;--muted:#8b97a5;--amber:#ffb800;--green:#2ea043;--red:#f85149;--blue:#4493f8}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Roboto,sans-serif}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--amber);display:grid;place-items:center;color:#1a1300;font-weight:800}
  h1{font-size:17px;margin:0}.sub{font-size:12px;color:var(--muted)}
  .link{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:8px}
  .links{margin-left:auto;display:flex;gap:8px}
  .wrap{max-width:820px;margin:0 auto;padding:18px}
  .cfg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .cfg.warn{border-color:#7a6017;background:#3a2e10}
  .cfg input{flex:1;min-width:160px;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0b0f14;color:var(--txt)}
  .cfg button{background:var(--amber);color:#1a1300;border:0;border-radius:8px;font-weight:700;padding:9px 14px;cursor:pointer}
  .cfg .lab{font-size:12px;color:var(--muted)}
  .banner{border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:28px;text-align:center;margin-bottom:14px}
  .banner.go{background:#0f2233;border-color:#1d4f78}.banner.kit{background:#231d06;border-color:#7a6017}.banner.ok{background:#10331c;border-color:#1f6f37}.banner.err{background:#3a1513;border-color:#7d2820}
  .bt{font-size:28px;font-weight:780}.bs{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.5}.bs b{color:var(--txt)}
  .timer{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:10px;letter-spacing:2px}
  .steps{display:flex;justify-content:center;gap:10px;margin-top:14px}
  .chip{font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .chip.done{background:#10331c;border-color:#1f6f37;color:#7ee2a0}
  #scan{position:absolute;left:-9999px;opacity:0}
  .stats{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}.stats b{color:var(--txt)}
</style></head><body>
<header><div class="mark">M</div><div><h1>Embalagem — Montagem</h1><div class="sub">Bipa SKU · prepara · bipa kit · bipa SKU pra finalizar</div></div>
<div class="links"><a class="link" href="/embalagem">Expedição de venda</a><a class="link" href="/painel">Painel</a></div></header>
<div class="wrap">
  <div class="cfg" id="cfg">
    <span class="lab">Código do kit:</span>
    <input id="kitin" placeholder="bipe ou digite o código do kit aqui e salve">
    <button onclick="salvarKit()">Salvar</button>
    <span class="lab" id="kitatual"></span>
  </div>
  <div class="banner" id="banner"></div>
  <input id="scan" autocomplete="off">
  <div class="stats" id="stats"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let SKUS=[], KIT=null, emb=null, tick=null, last={c:null,t:0};
async function load(){
  SKUS=await (await fetch('/api/skus')).json();
  KIT=(await (await fetch('/api/config/kit')).json()).kit;
  $('#kitatual').textContent = KIT ? ('atual: '+KIT) : '';
  $('#cfg').className = 'cfg' + (KIT?'':' warn');
  stats();
  if(!emb) idle();
}
async function stats(){
  const st=await (await fetch('/api/montagem/hoje')).json();
  const tot=st.reduce((a,b)=>a+b.qtd,0);
  $('#stats').innerHTML='Hoje: <b>'+tot+'</b> embaladas' + (st.length?(' · '+st.map(x=>x.codigo+': '+x.qtd+' (méd '+fmt(x.tmedio)+')').join(' · ')):'');
}
function fmt(s){ s=+s||0; const m=Math.floor(s/60); return (m?m+'m':'')+(s%60)+'s'; }
function mmss(ms){ const t=Math.floor(ms/1000),m=Math.floor(t/60); return String(m).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }
function steps(){ return '<div class="steps"><span class="chip done">1 · SKU ✓</span><span class="chip '+(emb&&emb.kitOk?'done':'')+'">2 · Kit '+(emb&&emb.kitOk?'✓':'…')+'</span><span class="chip">3 · SKU final</span></div>'; }
function banner(kind,title,sub,extra){ $('#banner').className='banner '+(kind||''); $('#banner').innerHTML='<div class="bt">'+title+'</div><div class="bs">'+(sub||'')+'</div>'+(extra||''); }
function idle(){ emb=null; if(!KIT){ banner('err','Configure o código do kit','Bipe/aponte o código do kit no campo acima e clique em Salvar. Sem isso não dá pra conferir o kit.'); return; } banner('','Pronto','Bipe o <b>SKU</b> da persiana pra começar a embalagem.'); }
function startTimer(){ clearInterval(tick); tick=setInterval(()=>{ const t=$('#tm'); if(emb&&t) t.textContent=mmss(Date.now()-emb.inicio); },250); }
function handle(code){
  code=(code||'').trim().toUpperCase(); if(!code) return;
  const now=Date.now(); if(last.c===code && now-last.t<700) return; last={c:code,t:now};
  if(KIT && code===KIT){
    if(!emb){ banner('err','Bipe o SKU primeiro','O kit só entra depois de começar uma persiana.'); beep(false); return; }
    emb.kitOk=true; banner('kit','Kit confirmado ✓','Agora cole a etiqueta de SKU e <b>bipe o SKU de novo</b> pra finalizar.<div class="timer" id="tm">'+mmss(Date.now()-emb.inicio)+'</div>'+steps()); beep(true); return;
  }
  const info=SKUS.find(s=>s.codigo.toUpperCase()===code);
  if(info){
    if(!emb){ emb={codigo:info.codigo,cor:info.cor||'',inicio:Date.now(),kitOk:false}; startTimer();
      banner('go','Embalando '+info.codigo,(info.cor||'')+' — prepare e depois <b>bipe o KIT</b>.<div class="timer" id="tm">00:00</div>'+steps()); beep(true); return; }
    if(emb.codigo.toUpperCase()===code){
      if(!emb.kitOk){ banner('err','⚠ FALTOU O KIT','Bipe o <b>kit</b> antes de finalizar '+emb.codigo+'.<div class="timer" id="tm">'+mmss(Date.now()-emb.inicio)+'</div>'+steps()); beep(false); return; }
      finish(); return;
    }
    banner('err','Termine a persiana atual','Você está embalando '+emb.codigo+'. Bipe o kit e o SKU pra finalizar antes de começar outra.'); beep(false); return;
  }
  banner('err','Código não reconhecido',code+' não é um SKU cadastrado nem o kit.'); beep(false);
}
async function finish(){
  const cur=emb; clearInterval(tick); tick=null; emb=null;
  const seg=Math.round((Date.now()-cur.inicio)/1000);
  try{
    await fetch('/api/montagem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:cur.codigo,segundos:seg,kit_ok:1,inicio:new Date(cur.inicio).toISOString(),fim:new Date().toISOString()})});
    banner('ok','Embalada ✓ ('+fmt(seg)+')', cur.codigo+' · kit conferido · foi pro estoque.'); beep(true); stats();
  }catch(e){ banner('err','Falha de conexão',String(e)); beep(false); }
}
async function salvarKit(){ const v=$('#kitin').value.trim(); if(!v) return; await fetch('/api/config/kit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kit:v})}); $('#kitin').value=''; await load(); }
const scan=$('#scan');
const keep=()=>{ if(document.activeElement!==scan && document.activeElement!==$('#kitin')) scan.focus(); };
scan.addEventListener('blur',()=>setTimeout(keep,50));
document.addEventListener('click',e=>{ if(!e.target.closest('button,a,input')) keep(); });
scan.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=scan.value.trim(); scan.value=''; handle(v); } });
scan.focus();
function beep(ok){ try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?820:240;g.gain.value=.05;o.start();setTimeout(()=>{o.stop();a.close();},ok?100:220);}catch(e){} }
load(); setInterval(()=>{ if(!emb) load(); },4000);
</script><script src="/nav.js"></script>
</body></html>
