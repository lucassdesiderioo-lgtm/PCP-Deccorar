# Os testes do sob medida, a cada push e a cada pull request.
#
# ⚠️ NAO HA `npm install` DENTRO DE `tecido/`, e isso e decisao do modulo.
# As dependencias (better-sqlite3, express, pdf-lib) sao as mesmas versoes da
# raiz e o Node resolve subindo. Uma segunda arvore de dependencias aqui seria
# uma segunda coisa para atualizar e esquecer — e o dia em que as duas
# divergissem, o CI estaria testando um modulo diferente do que sobe no
# servidor. Por isso o `npm ci` e um so, na raiz.
#
# ⚠️ E NAO HA FILTRO POR `paths`. Filtrar por `tecido/**` faria o teste PASSAR
# POR NAO TER RODADO em todo PR que mexesse na raiz — e a raiz monta o modulo
# (`server.js` -> `tecido/montar.js`). Check que fica verde sem rodar e pior
# que check nenhum: ele afirma com autoridade uma coisa que ninguem conferiu.
# A suite inteira leva segundos; nao ha o que economizar.
name: Sob medida

on:
  pull_request:
  push:
    branches: [main]

# Push novo na mesma branch cancela a rodada anterior: o que interessa e o
# estado do ultimo commit, e fila de rodadas velhas so atrasa a resposta.
concurrency:
  group: sobmedida-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: teste/rodar.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A mesma versao maior que o servidor roda. Node novo demais quebra o
      # better-sqlite3 (modulo nativo), e a quebra aparece como "nao instalou",
      # que nao se parece nada com a causa.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar as dependencias (raiz)
        run: npm ci

      # O runner cria um banco descartavel POR ARQUIVO de teste, do zero, pelo
      # schema — entao a migracao e exercitada a cada rodada. Nenhum teste toca
      # em banco de trabalho, e nao ha servico para subir.
      - name: Testes do sob medida
        run: npm test
        working-directory: tecido
