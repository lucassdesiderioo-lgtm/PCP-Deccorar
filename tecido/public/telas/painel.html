<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Tecido</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
tr.soRetalho td{background:var(--alerta-fraca); font-weight:600}
.seta{color:var(--alerta); font-weight:700}
.barra{height:8px; background:var(--acao-fraca); border-radius:4px; min-width:2px}
/* SEIS CARDS EM 3 x 2, e nao auto-fit. Com auto-fit a ultima linha fica com
   um card sozinho ocupando a largura toda, e o olho le aquilo como "este e o
   mais importante" — que nao e verdade. Tres colunas fecham exato, e ainda
   dao largura para "R$ 13.575,00" caber numa linha so. */
.cards{display:grid; gap:12px; margin:14px 0; grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){ .cards{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){ .cards{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="topo">
  <h1>Painel</h1>
  <span class="espaco"></span>
</header>

<div class="corpo">
  <div class="abas" id="abas"></div>
  <div id="conteudo"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,el,limpar,$,num,formatarMedida,formatarMetros,formatarArea}=window.ui;

let aba='gerencial';
/* A ABA GERENCIAL E A PRIMEIRA, e "O que sai" saiu — o conteudo dela esta
   toda dentro da nova, num grao mais fino. Duas abas respondendo "quanto sai
   e quanto tenho" com recortes diferentes seriam duas reguas para a mesma
   pergunta (armadilha #12 do CLAUDE.md). */
const ABAS=[
  {id:'gerencial',nome:'Gerencial'},
  {id:'estoque', nome:'Rolo × retalho'},
  {id:'encalhe', nome:'Encalhe'},
  {id:'refugo',  nome:'Refugo'},
  {id:'recusas', nome:'Recusas'},
  {id:'cortes',  nome:'Cortes'}
];
const dinheiro=v=>v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',
  {minimumFractionDigits:2,maximumFractionDigits:2});

function montarAbas(){
  const c=limpar($('#abas'));
  ABAS.forEach(a=>c.appendChild(el('button',{texto:a.nome,'aria-selected':String(a.id===aba),
    onclick:()=>{ aba=a.id; desenhar(); }})));
}
function cartao(pai,titulo,nota){
  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:titulo}));
  if(nota) c.appendChild(el('p',{class:'nota',texto:nota}));
  pai.appendChild(c); return c;
}
function tabela(cabecalho,linhas){
  const t=el('table',{});
  t.appendChild(el('tr',{},cabecalho.map(h=>el('th',{class:h.num?'num':'',texto:h.nome||h}))));
  linhas.forEach(l=>t.appendChild(l));
  return t;
}

function desenhar(){
  montarAbas();
  const c=limpar($('#conteudo'));
  return ({gerencial:telaGerencial,estoque:telaEstoque,encalhe:telaEncalhe,
    refugo:telaRefugo,recusas:telaRecusas,cortes:telaCortes})[aba](c);
}

// ── ESTOQUE — o cruzamento que da razao ao painel ────────────────────────
async function telaEstoque(pai){
  const linhas=await api('/api/painel/estoque');
  pai=limpar(pai);
  const c=cartao(pai,'Estoque por tecido',
    'Rolo e retalho lado a lado. A linha em ambar e o cruzamento que evita comprar tecido que ja esta na prateleira.');

  const t=tabela([{nome:'Tecido'},{nome:'Saldo',num:true},{nome:'Rolos'},
    {nome:'Sobras',num:true},{nome:'m² de retalho',num:true},{nome:''}],
    linhas.map(l=>el('tr',{class:l.so_retalho?'soRetalho':''},[
      el('td',{texto:[l.linha_nome,l.abertura_nome,l.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:formatarMetros(l.saldo)}),
      el('td',{texto:l.abertos?(l.abertos+' aberto'+(l.fechados?' + '+l.fechados+' fechado':'')):
        (l.fechados?l.fechados+' fechado':'—')}),
      el('td',{class:'num',texto:String(l.sobras)}),
      el('td',{class:'num',texto:formatarArea(l.m2_sobra)}),
      el('td',{},[l.so_retalho?el('span',{class:'seta',texto:'◀ sem rolo, com retalho'}):el('span',{})])
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nada em estoque ainda.'}));

  const destaque=linhas.filter(l=>l.so_retalho);
  if(destaque.length) c.appendChild(el('p',{class:'ajuda',texto:
    destaque.length+' tecido(s) sem rolo mas com retalho na prateleira: '+
    destaque.map(l=>[l.linha_nome,l.abertura_nome,l.cor_nome].join(' ')+' ('+formatarArea(l.m2_sobra)+')').join(' · ')+
    '. Antes de comprar, olhe aqui.'}));
}

/* ══ GRAFICOS — SVG puro, sem biblioteca ══════════════════════════════════
   O projeto nao tem build nem dependencia de front (README). Puxar uma lib
   de grafico por CDN traria uma segunda coisa para atualizar e esquecer, e
   um estilo que nao e o do sistema. Duas formas cobrem tudo que este painel
   precisa: barra horizontal e linha.

   BARRA HORIZONTAL, e nao vertical: os rotulos aqui sao nomes ("Rolo · 3%",
   "mais de 180 dias") e em barra vertical eles saem deitados ou cortados. */
const SVG='http://www.w3.org/2000/svg';
const svg=(tag,attrs,filhos)=>{
  const e=document.createElementNS(SVG,tag);
  for(const k in (attrs||{})) if(attrs[k]!=null) e.setAttribute(k,attrs[k]);
  (filhos||[]).forEach(f=>e.appendChild(f));
  return e;
};
const svgTexto=(x,y,txt,attrs)=>{
  const t=svg('text',{x,y,'font-size':12,fill:'currentColor',...(attrs||{})});
  t.textContent=txt; return t;
};

/* `series` = [{nome, cor}]; cada item traz um valor por serie.
   Duas series lado a lado servem ao unico cruzamento que interessa aqui:
   ESTOQUE contra CONSUMO. Separados em dois graficos, o olho teria que
   guardar a altura de um para comparar com o outro. */
function barras(itens,{series,rotulo,formatar,altura}){
  if(!itens.length) return el('div',{class:'vazio',texto:'Sem dados.'});
  const linhaAlt=series.length>1?34:26, pad=8, rotuloLarg=170, valorLarg=110;
  const larg=760, h=itens.length*linhaAlt+pad*2;
  const max=Math.max(...itens.map(i=>Math.max(...series.map(s=>s.valor(i)||0))),0.0001);
  const util=larg-rotuloLarg-valorLarg;

  const g=[];
  itens.forEach((it,i)=>{
    const y0=pad+i*linhaAlt;
    g.push(svgTexto(0,y0+linhaAlt/2+4,rotulo(it),{fill:'var(--tinta)'}));
    const altBarra=series.length>1?10:12;
    series.forEach((s,k)=>{
      const v=s.valor(it)||0;
      const y=y0+(linhaAlt-series.length*(altBarra+2))/2+k*(altBarra+2);
      g.push(svg('rect',{x:rotuloLarg,y,width:Math.max(1,util*(v/max)),height:altBarra,
        rx:3,fill:s.cor}));
    });
    g.push(svgTexto(larg-4,y0+linhaAlt/2+4,
      series.map(s=>formatar(s.valor(it)||0)).join('  ·  '),
      {'text-anchor':'end',fill:'var(--tinta-fraca)'}));
  });
  const box=svg('svg',{viewBox:'0 0 '+larg+' '+(altura||h),width:'100%',
    height:(altura||h),style:'max-width:100%;color:var(--tinta)'},g);
  const leg=el('div',{class:'ajuda',style:'display:flex;gap:16px;flex-wrap:wrap'},
    series.length>1?series.map(s=>el('span',{},[
      el('span',{style:'display:inline-block;width:10px;height:10px;border-radius:2px;'+
        'margin-right:6px;background:'+s.cor}),
      el('span',{texto:s.nome})])):[]);
  return el('div',{},[box,leg]);
}

/* A LINHA DO TEMPO. Sempre com o eixo ancorado no ZERO — comecar o eixo no
   menor valor faz uma variacao de 2% parecer despencar, que e a forma mais
   comum de um grafico honesto mentir. */
function linhaTempo(pontos,{formatar}){
  if(pontos.length<2) return el('div',{class:'vazio',
    texto:'Um mes so ainda nao desenha tendencia. O grafico aparece a partir do segundo.'});
  const larg=760, alt=200, m={e:70,d:12,c:16,b:28};
  const max=Math.max(...pontos.map(p=>p.valor),0.0001);
  const x=i=>m.e+(larg-m.e-m.d)*(pontos.length===1?0:i/(pontos.length-1));
  const y=v=>m.c+(alt-m.c-m.b)*(1-v/max);
  const g=[];
  [0,0.5,1].forEach(f=>{
    g.push(svg('line',{x1:m.e,x2:larg-m.d,y1:y(max*f),y2:y(max*f),
      stroke:'var(--linha)','stroke-width':1}));
    g.push(svgTexto(m.e-8,y(max*f)+4,formatar(max*f),{'text-anchor':'end',fill:'var(--tinta-fraca)'}));
  });
  g.push(svg('polyline',{fill:'none',stroke:'var(--acao)','stroke-width':2.5,
    'stroke-linejoin':'round',points:pontos.map((p,i)=>x(i)+','+y(p.valor)).join(' ')}));
  pontos.forEach((p,i)=>{
    g.push(svg('circle',{cx:x(i),cy:y(p.valor),r:4,fill:'var(--acao)'}));
    g.push(svgTexto(x(i),alt-8,p.rotulo,{'text-anchor':'middle',fill:'var(--tinta-fraca)','font-size':11}));
  });
  return svg('svg',{viewBox:'0 0 '+larg+' '+alt,width:'100%',height:alt,
    style:'max-width:100%;color:var(--tinta)'},g);
}

/* ══ PAINEL GERENCIAL ═════════════════════════════════════════════════════
   ⚠️ ESTA ABA SUBSTITUIU "O QUE SAI", e nao ficou ao lado dela. Duas abas
   respondendo "quanto sai e quanto tenho" com recortes diferentes seriam
   duas reguas para a mesma pergunta — a armadilha #12 do CLAUDE.md, que ja
   custou a reforma inteira da aba Estoque do PCP. O conteudo daquela aba
   esta todo aqui, num grao mais fino.

   O GRAO E TECIDO × LARGURA DE BOBINA. Somar as bobinas de um mesmo tecido
   responde bem "o que mais sai" e responde ERRADO a cobertura: 120 m² de
   bobina 2,00 nao cobrem uma peca de 2,20, e aqui nao ha emenda. */
const ESTADO_G={dias:90, linha:'', abertura:'', cor:'', largura:''};

const STATUS={
  sem_estoque:{nome:'SEM ESTOQUE', cor:'var(--erro)',    fundo:'var(--erro-fraca)'},
  critico:    {nome:'CRITICO',     cor:'var(--erro)',    fundo:'var(--erro-fraca)'},
  atencao:    {nome:'ATENCAO',     cor:'var(--alerta)',  fundo:'var(--alerta-fraca)'},
  parado:     {nome:'PARADO',      cor:'var(--sobra)',   fundo:'var(--alerta-fraca)'},
  normal:     {nome:'NORMAL',      cor:'var(--bom)',     fundo:'var(--bom-fraca)'}
};

const cartaoNum=(rotulo,valor,nota,cor)=>el('div',{class:'cartao',style:'margin:0'},[
  el('p',{class:'ajuda',style:'margin:0 0 4px',texto:rotulo}),
  el('p',{style:'font-size:26px;font-weight:700;margin:0'+(cor?';color:'+cor:''),texto:valor}),
  nota?el('p',{class:'ajuda',style:'margin:4px 0 0',texto:nota}):el('span',{})
]);

async function telaGerencial(pai){
  const q=new URLSearchParams({dias:ESTADO_G.dias});
  ['linha','abertura','cor','largura'].forEach(k=>{ if(ESTADO_G[k]) q.set(k,ESTADO_G[k]); });
  const g=await api('/api/painel/gerencial?'+q);
  const temCusto=g.resumo.valor!==undefined;
  pai=limpar(pai);

  // ── FILTROS ────────────────────────────────────────────────────────────
  const cf=el('div',{class:'cartao'});
  const filtro=(rotulo,chave,opcoes,formatar)=>{
    const f=el('div',{class:'fileira'});
    f.appendChild(el('span',{class:'rotulo',texto:rotulo}));
    f.appendChild(el('button',{class:'op',texto:'Todos',
      'aria-pressed':String(!ESTADO_G[chave]),
      onclick:()=>{ ESTADO_G[chave]=''; desenhar(); }}));
    opcoes.forEach(o=>f.appendChild(el('button',{class:'op',texto:(formatar||String)(o),
      'aria-pressed':String(String(ESTADO_G[chave])===String(o)),
      onclick:()=>{ ESTADO_G[chave]=String(o); desenhar(); }})));
    cf.appendChild(f);
  };
  filtro('JANELA','dias',[30,60,90,180,365],d=>d+' dias');
  filtro('LINHA','linha',g.opcoes.linhas);
  filtro('COLECAO','abertura',g.opcoes.aberturas);
  filtro('COR','cor',g.opcoes.cores);
  filtro('BOBINA','largura',g.opcoes.larguras,v=>num(v)+' m');
  pai.appendChild(cf);

  // ── CARDS ──────────────────────────────────────────────────────────────
  const piso=g.resumo.piso?'≥ ':'';
  const cards=el('div',{class:'cards'});
  if(temCusto) cards.appendChild(cartaoNum('Valor do estoque',piso+dinheiro(g.resumo.valor),
    g.resumo.piso?g.resumo.rolos_sem_preco+' rolo(s) sem nota — este e o minimo':
                  'todos os rolos com preco lancado'));
  cards.appendChild(cartaoNum('Em estoque',formatarArea(g.resumo.m2),
    formatarMetros(g.resumo.metros)+' · '+g.resumo.rolos+' rolo(s) · '+g.resumo.materiais+' material(is)'));
  cards.appendChild(cartaoNum('Consumo medio',formatarArea(g.resumo.media_mes)+'/mes',
    formatarArea(g.resumo.media_dia)+'/dia · janela de '+g.dias+' dia(s)'));
  cards.appendChild(cartaoNum('Cobertura',
    g.resumo.cobertura==null?'—':num(g.resumo.cobertura)+' dias',
    'so o que GIRA: estoque ÷ consumo. O parado tem card proprio — somado aqui, ele faria a folga parecer maior'));
  cards.appendChild(cartaoNum('Precisam de atencao',String(g.resumo.criticos+g.resumo.atencao),
    g.resumo.criticos+' critico(s) · '+g.resumo.atencao+' em atencao',
    g.resumo.criticos?'var(--erro)':null));
  cards.appendChild(cartaoNum('Parado',
    temCusto?piso+dinheiro(g.resumo.valor_parado):formatarArea(g.resumo.m2_parado),
    g.resumo.parados+' material(is) sem corte ha '+g.parametros.parado_dias+'+ dias',
    g.resumo.parados?'var(--sobra)':null));
  pai.appendChild(cards);

  /* ── PROBLEMAS ─────────────────────────────────────────────────────────
     Vem ANTES dos graficos, e nao no rodape: se o dado esta furado, ler o
     grafico e pior que nao ler nada — ele confirma com autoridade um numero
     que nao descreve a prateleira. */
  if(g.problemas.length){
    const cp=el('div',{class:'cartao',style:'border-color:var(--erro)'});
    cp.appendChild(el('h2',{texto:'Conferir os dados — '+g.problemas.length+' problema(s)'}));
    cp.appendChild(el('p',{class:'nota',texto:
      'Nada foi corrigido automaticamente. Numero errado que a tela arruma sozinha e pior que numero errado visivel: some a chance de alguem descobrir a causa.'}));
    g.problemas.forEach(p=>cp.appendChild(el('p',{style:'color:var(--erro)',texto:'• '+p})));
    pai.appendChild(cp);
  }

  // ── GRAFICOS ───────────────────────────────────────────────────────────
  const cg=el('div',{class:'cartao'});
  cg.appendChild(el('h2',{texto:'Consumo mes a mes'}));
  cg.appendChild(el('p',{class:'nota',texto:
    'A serie inteira, sem a janela: a janela e da media, a serie e a historia. O eixo comeca no zero — comecar no menor valor faz variacao de 2% parecer despencar.'}));
  cg.appendChild(linhaTempo(g.meses.slice().reverse().map(m=>({rotulo:m.mes.slice(2),valor:m.m2})),
    {formatar:v=>Math.round(v)+' m²'}));
  pai.appendChild(cg);

  const cc=el('div',{class:'cartao'});
  cc.appendChild(el('h2',{texto:'Estoque × consumo, por colecao'}));
  cc.appendChild(el('p',{class:'nota',texto:
    'Os dois lado a lado porque o que interessa e a proporcao. Colecao com muito estoque e pouco consumo e dinheiro dormindo; o contrario e risco de faltar.'}));
  cc.appendChild(barras(g.por_colecao.slice().sort((a,b)=>b.m2_parado-a.m2_parado),{
    series:[{nome:'em estoque (m²)',cor:'var(--acao)',valor:i=>i.m2_parado},
            {nome:'consumido na janela (m²)',cor:'var(--sobra)',valor:i=>i.m2}],
    rotulo:i=>i.chave, formatar:v=>num(Math.round(v*10)/10)}));
  pai.appendChild(cc);

  const cb=el('div',{class:'cartao'});
  cb.appendChild(el('h2',{texto:'Por largura de bobina'}));
  cb.appendChild(el('p',{class:'nota',texto:
    'Bobinas diferentes sao estoques diferentes: nao ha emenda, entao 2,00 nao cobre peca de 2,20. Por isso elas nunca se somam nas contas de cobertura.'}));
  cb.appendChild(barras(g.por_largura.slice().sort((a,b)=>b.m2_parado-a.m2_parado),{
    series:[{nome:'em estoque (m²)',cor:'var(--acao)',valor:i=>i.m2_parado},
            {nome:'consumido (m²)',cor:'var(--sobra)',valor:i=>i.m2}],
    rotulo:i=>num(i.chave)+' m', formatar:v=>num(Math.round(v*10)/10)}));
  cb.appendChild(el('h2',{style:'margin-top:20px;font-size:16px',texto:'Por cor'}));
  cb.appendChild(barras(g.por_cor.slice().sort((a,b)=>b.m2_parado-a.m2_parado),{
    series:[{nome:'em estoque (m²)',cor:'var(--acao)',valor:i=>i.m2_parado},
            {nome:'consumido (m²)',cor:'var(--sobra)',valor:i=>i.m2}],
    rotulo:i=>i.chave, formatar:v=>num(Math.round(v*10)/10)}));
  pai.appendChild(cb);

  const cp2=el('div',{class:'cartao'});
  cp2.appendChild(el('h2',{texto:'Ha quanto tempo sem sair'}));
  cp2.appendChild(el('p',{class:'nota',texto:
    'Onde o dinheiro esta dormindo. Material que NUNCA foi cortado cai na ultima faixa, e nao numa faixa propria no fim da lista — do ponto de vista do dinheiro parado ele e o caso mais grave, e separa-lo o tiraria de onde o olho procura.'}));
  cp2.appendChild(barras(g.por_faixa,{
    series:temCusto
      ?[{nome:'valor parado',cor:'var(--sobra)',valor:i=>i.valor||0}]
      :[{nome:'m² parados',cor:'var(--sobra)',valor:i=>i.m2||0}],
    rotulo:i=>i.nome,
    formatar:v=>temCusto?dinheiro(v):num(Math.round(v))+' m²'}));
  pai.appendChild(cp2);

  // ── TABELA ─────────────────────────────────────────────────────────────
  const ct=el('div',{class:'cartao'});
  ct.appendChild(el('h2',{texto:'Material a material'}));
  ct.appendChild(el('p',{class:'nota',texto:
    'O grao e TECIDO × LARGURA DE BOBINA. Estoque minimo = consumo medio diario × '+
    g.parametros.dias_alvo+' dias'+(g.parametros.seguranca?' + '+g.parametros.seguranca+'% de seguranca':'')+
    ' — os dois em Cadastros → Parametros. Sem consumo, minimo e cobertura sao "—": nao da pra dizer, que nao e zero.'}));

  const ordem={sem_estoque:0,critico:1,parado:2,atencao:3,normal:4};
  const cab=[{nome:'Colecao'},{nome:'Cor'},{nome:'Bobina',num:true},
    {nome:'Em estoque',num:true},{nome:'Media/mes',num:true},{nome:'Media/dia',num:true},
    {nome:'Cobertura',num:true},{nome:'Minimo',num:true},{nome:'Ultimo corte'},
    {nome:'Sem sair',num:true}].concat(temCusto?[{nome:'Valor',num:true}]:[]).concat([{nome:'Status'}]);

  ct.appendChild(tabela(cab, g.linhas.slice()
    .sort((a,b)=>ordem[a.status]-ordem[b.status]||(b.m2||0)-(a.m2||0))
    .map(l=>{
      const s=STATUS[l.status];
      return el('tr',{},[
        el('td',{texto:l.linha_nome+' · '+l.abertura_nome}),
        el('td',{texto:l.cor_nome}),
        el('td',{class:'num',texto:num(l.largura)+' m'}),
        el('td',{class:'num',texto:formatarArea(l.m2_parado)}),
        el('td',{class:'num',texto:l.media_dia>0?formatarArea(l.media_mes):'—'}),
        el('td',{class:'num',texto:l.media_dia>0?formatarArea(l.media_dia):'—'}),
        el('td',{class:'num',texto:l.cobertura==null?'—':num(l.cobertura)+' d'}),
        /* O MINIMO SO E COBRANCA QUANDO ESTA ABAIXO. Pintar de ambar todo
           minimo faria a coluna inteira gritar, e coluna que grita sempre
           ninguem le. */
        el('td',{class:'num'+(l.abaixo_do_minimo>0?' aviso':''),
          texto:l.minimo==null?'—':formatarArea(l.minimo),
          title:l.abaixo_do_minimo>0?('faltam '+formatarArea(l.abaixo_do_minimo)):''}),
        el('td',{texto:l.ultimo_corte||'nunca'}),
        el('td',{class:'num',texto:l.dias_sem_consumo==null?'—':l.dias_sem_consumo+' d'})
      ].concat(temCusto?[el('td',{class:'num',
          texto:l.valor==null?'—':(l.rolos_sem_preco?'≥ ':'')+dinheiro(l.valor)})]:[])
       .concat([el('td',{},[el('span',{class:'tag',
          style:'background:'+s.fundo+';color:'+s.cor,texto:s.nome})])]));
    })));

  ct.appendChild(el('p',{class:'ajuda',texto:
    'CRITICO: cobertura abaixo de metade dos '+g.parametros.dias_alvo+' dias-alvo, ou estoque zerado. '+
    'PARADO: tem estoque e nenhum corte ha '+g.parametros.parado_dias+'+ dias. '+
    'ATENCAO: cobertura abaixo do alvo. A ordem e de precedencia: sem estoque nao e "parado", e a urgencia.'}));
  pai.appendChild(ct);
}

// ── ENCALHE ──────────────────────────────────────────────────────────────
async function telaEncalhe(pai){
  const linhas=await api('/api/painel/encalhe');
  pai=limpar(pai);
  const c=cartao(pai,'Encalhe — a sobra mais parada primeiro',
    'Retalho que nao sai ha meses e dinheiro dormindo. Em alguns meses este relatorio responde melhor que o palpite de 50% do peso da sobra.');
  const t=tabela([{nome:'Etiqueta'},{nome:'Tecido'},{nome:'Medida',num:true},
    {nome:'m²',num:true},{nome:'Condição'},{nome:'Parada há',num:true}],
    linhas.map(s=>el('tr',{},[
      el('td',{texto:s.codigo}),
      el('td',{texto:[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:formatarMedida(s.largura,s.altura)}),
      el('td',{class:'num',texto:formatarArea(s.area)}),
      el('td',{texto:s.condicao}),
      el('td',{class:'num',texto:s.dias_parada+' dias'})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhuma sobra disponivel.'}));
}

// ── REFUGO ───────────────────────────────────────────────────────────────
async function telaRefugo(pai){
  const linhas=await api('/api/painel/refugo');
  pai=limpar(pai);
  const c=cartao(pai,'Refugo por mês e motivo',
    'A perda fica medida, não some. Sem esta tabela o desperdício do mês é uma sensação.');
  const t=tabela([{nome:'Mês'},{nome:'Motivo'},{nome:'Linhas',num:true},{nome:'m²',num:true}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.mes}), el('td',{texto:r.motivo||'—'}),
      el('td',{class:'num',texto:String(r.linhas)}),
      el('td',{class:'num',texto:formatarArea(r.area)})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhum refugo registrado.'}));
}

// ── RECUSAS ──────────────────────────────────────────────────────────────
async function telaRecusas(pai){
  const linhas=await api('/api/painel/recusas');
  pai=limpar(pai);
  const c=cartao(pai,'Recusas — onde o reaproveitamento trava',
    'O motivo não é burocracia, é o diagnóstico. Se "tonalidade" dominar, a resposta é registrar o tom no cadastro da sobra; se for "defeito não cadastrado", o problema está no lançamento na bancada.');
  const maior=linhas.reduce((m,r)=>Math.max(m,r.vezes),1);
  const t=tabela([{nome:'Motivo'},{nome:'Vezes',num:true},{nome:''},{nome:'Última'}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.motivo||'—'}),
      el('td',{class:'num',texto:String(r.vezes)}),
      el('td',{},[el('div',{class:'barra',style:'width:'+(r.vezes/maior*100)+'%'})]),
      el('td',{texto:r.ultima||''})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',
    texto:'Nenhuma recusa ainda — e isso e uma boa noticia.'}));
}

// ── CORTES ───────────────────────────────────────────────────────────────
async function telaCortes(pai){
  const linhas=await api('/api/painel/cortes');
  pai=limpar(pai);
  const c=cartao(pai,'Cortes confirmados, por mês',
    'Quanto de rolo saiu, quanto virou peça, quanto virou retalho e quanto se perdeu.');
  const t=tabela([{nome:'Mês'},{nome:'Planos',num:true},{nome:'Rolo consumido',num:true},
    {nome:'Peças',num:true},{nome:'Virou sobra',num:true},{nome:'Desperdício',num:true}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.mes}),
      el('td',{class:'num',texto:String(r.planos)}),
      el('td',{class:'num',texto:formatarMetros(r.consumo_linear)}),
      el('td',{class:'num',texto:formatarArea(r.area_pecas)}),
      el('td',{class:'num',texto:formatarArea(r.area_sobra)}),
      el('td',{class:'num',texto:formatarArea(r.desperdicio)})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhum plano confirmado ainda.'}));
}

desenhar();
