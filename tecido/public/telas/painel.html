<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel · Tecido</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
tr.soRetalho td{background:var(--alerta-fraca); font-weight:600}
.seta{color:var(--alerta); font-weight:700}
.barra{height:8px; background:var(--acao-fraca); border-radius:4px; min-width:2px}
</style>
</head>
<body>
<header class="topo">
  <h1>Painel</h1>
  <span class="espaco"></span>
</header>

<div class="corpo">
  <div class="abas" id="abas"></div>
  <div id="conteudo"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,el,limpar,$,num,formatarMedida,formatarMetros,formatarArea}=window.ui;

let aba='estoque', diasGiro=30;
const ABAS=[
  {id:'estoque', nome:'Estoque'},
  {id:'giro',    nome:'O que sai'},
  {id:'encalhe', nome:'Encalhe'},
  {id:'refugo',  nome:'Refugo'},
  {id:'recusas', nome:'Recusas'},
  {id:'cortes',  nome:'Cortes'}
];
const dinheiro=v=>v==null?'—':'R$ '+Number(v).toLocaleString('pt-BR',
  {minimumFractionDigits:2,maximumFractionDigits:2});

function montarAbas(){
  const c=limpar($('#abas'));
  ABAS.forEach(a=>c.appendChild(el('button',{texto:a.nome,'aria-selected':String(a.id===aba),
    onclick:()=>{ aba=a.id; desenhar(); }})));
}
function cartao(pai,titulo,nota){
  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:titulo}));
  if(nota) c.appendChild(el('p',{class:'nota',texto:nota}));
  pai.appendChild(c); return c;
}
function tabela(cabecalho,linhas){
  const t=el('table',{});
  t.appendChild(el('tr',{},cabecalho.map(h=>el('th',{class:h.num?'num':'',texto:h.nome||h}))));
  linhas.forEach(l=>t.appendChild(l));
  return t;
}

function desenhar(){
  montarAbas();
  const c=limpar($('#conteudo'));
  return ({estoque:telaEstoque,giro:telaGiro,encalhe:telaEncalhe,refugo:telaRefugo,
    recusas:telaRecusas,cortes:telaCortes})[aba](c);
}

// ── ESTOQUE — o cruzamento que da razao ao painel ────────────────────────
async function telaEstoque(pai){
  const linhas=await api('/api/painel/estoque');
  pai=limpar(pai);
  const c=cartao(pai,'Estoque por tecido',
    'Rolo e retalho lado a lado. A linha em ambar e o cruzamento que evita comprar tecido que ja esta na prateleira.');

  const t=tabela([{nome:'Tecido'},{nome:'Saldo',num:true},{nome:'Rolos'},
    {nome:'Sobras',num:true},{nome:'m² de retalho',num:true},{nome:''}],
    linhas.map(l=>el('tr',{class:l.so_retalho?'soRetalho':''},[
      el('td',{texto:[l.linha_nome,l.abertura_nome,l.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:formatarMetros(l.saldo)}),
      el('td',{texto:l.abertos?(l.abertos+' aberto'+(l.fechados?' + '+l.fechados+' fechado':'')):
        (l.fechados?l.fechados+' fechado':'—')}),
      el('td',{class:'num',texto:String(l.sobras)}),
      el('td',{class:'num',texto:formatarArea(l.m2_sobra)}),
      el('td',{},[l.so_retalho?el('span',{class:'seta',texto:'◀ sem rolo, com retalho'}):el('span',{})])
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nada em estoque ainda.'}));

  const destaque=linhas.filter(l=>l.so_retalho);
  if(destaque.length) c.appendChild(el('p',{class:'ajuda',texto:
    destaque.length+' tecido(s) sem rolo mas com retalho na prateleira: '+
    destaque.map(l=>[l.linha_nome,l.abertura_nome,l.cor_nome].join(' ')+' ('+formatarArea(l.m2_sobra)+')').join(' · ')+
    '. Antes de comprar, olhe aqui.'}));
}

/* ── O QUE SAI ────────────────────────────────────────────────────────────
   ⚠️ A JANELA VEM ESCRITA NO TOPO, SEMPRE. Media diaria sem dizer de quantos
   dias e um numero que engana com cara de fato — e o erro nao aparece: uma
   media de 12 dias apresentada como se fosse de 30 sai 2,5x menor e leva
   alguem a comprar errado. Quando a historia e menor que a janela pedida, a
   tarja ambar diz isso com todas as letras. */
async function telaGiro(pai){
  const g=await api('/api/painel/giro?dias='+diasGiro);
  pai=limpar(pai);

  const c=cartao(pai,'O que sai da prateleira',
    'So o CONSUMO dos planos confirmados. Ajuste de contagem e acerto de fim de rolo tambem mexem no saldo e nenhum dos dois e corte — somados, o numero deixaria de responder "quanto a fabrica cortou" e passaria a responder "quanto a coluna variou".');

  // A janela e um botao, nao um numero fixo: 7 dias responde "o que estamos
  // gastando agora", 90 responde "o que essa fabrica gasta".
  const fil=el('div',{class:'fileira'});
  fil.appendChild(el('span',{class:'rotulo',texto:'JANELA'}));
  [7,15,30,60,90].forEach(d=>fil.appendChild(el('button',{class:'op',texto:d+' dias',
    'aria-pressed':String(d===diasGiro), onclick:()=>{ diasGiro=d; desenhar(); }})));
  c.appendChild(fil);

  if(g.janela.vazia){
    c.appendChild(el('div',{class:'vazio',texto:
      'Nenhum corte confirmado ainda. Este painel comeca a existir no primeiro plano confirmado — nao da para reconstruir o que passou antes de o modulo entrar.'}));
    return;
  }

  if(!g.janela.completa) c.appendChild(el('p',{class:'ajuda',style:'color:var(--alerta)',texto:
    '⚠ A media abaixo e de '+g.janela.dias+' dia(s), e nao de '+g.janela.pedidos+
    ': o primeiro corte registrado foi em '+g.janela.desde+', e nao existe historico antes disso. '+
    'Dividir por '+g.janela.pedidos+' devolveria um numero menor que a verdade, sem erro e sem aviso.'}));
  else c.appendChild(el('p',{class:'ajuda',texto:
    'Media dos ultimos '+g.janela.dias+' dias corridos — fins de semana incluidos, porque a pergunta e quanto essa fabrica gasta por dia.'}));

  const linhas=(itens,nome)=>itens.map(l=>el('tr',{},[
    el('td',{texto:nome(l)}),
    el('td',{class:'num',texto:formatarArea(l.m2)}),
    el('td',{class:'num',texto:formatarMetros(l.metros)}),
    el('td',{class:'num',texto:formatarArea(l.media_dia)+'/dia'}),
    el('td',{class:'num',texto:formatarArea(l.media_mes)}),
    el('td',{class:'num',texto:formatarArea(l.m2_parado)}),
    /* COBERTURA MEDE RISCO, e a quantidade nao. 200 m² de um tecido que gira
       40/dia e menos folga que 50 m² de um que gira 1. Sem consumo a
       cobertura e "nao da pra dizer" — nunca zero. */
    el('td',{class:'num'+(l.cobertura!=null&&l.cobertura<7?' aviso':''),
      texto:l.cobertura==null?'—':num(l.cobertura)+' d'}),
    el('td',{class:'quem',texto:l.dias_com_corte+' dia(s) com corte'})
  ]));
  /* Nenhum cabecalho vazio: o `tabela()` faz `h.nome||h`, entao string vazia
     cai no objeto e a coluna sai escrita "[object Object]". E "Dias com
     corte" e informacao de verdade — e ele que diz de quantos dias uteis
     aquela media saiu. */
  const cab=[{nome:'—'},{nome:'Saiu (m²)',num:true},{nome:'Saiu (m)',num:true},
    {nome:'Media',num:true},{nome:'Por mes',num:true},{nome:'Parado',num:true},
    {nome:'Cobertura',num:true},{nome:'Dias com corte'}];

  const bloco=(titulo,itens,nome,ajuda)=>{
    if(!itens.length) return;
    c.appendChild(el('h2',{style:'margin-top:22px;font-size:16px',texto:titulo}));
    if(ajuda) c.appendChild(el('p',{class:'ajuda',texto:ajuda}));
    c.appendChild(tabela(cab,linhas(itens,nome)));
  };
  bloco('Por tecido — o que mais sai',g.tecidos,
    l=>[l.linha_nome,l.abertura_nome,l.cor_nome].join(' · '),
    'Ordenado por m², e nao por metro linear: 10 m de bobina 3,00 e mais tecido que 10 m de 2,00, e comparar metro com metro entre bobinas diferentes esconde isso.');
  bloco('Por largura de bobina — qual mais usa',g.larguras,l=>num(l.chave)+' m');
  bloco('Por cor',g.cores,l=>l.chave);

  /* O QUE NAO SAIU NA JANELA NAO APARECE ACIMA — a lista de giro parte do
     consumo. Sem esta lista o tecido parado SOME da tela, que e o pior lugar
     onde um tecido parado pode estar. */
  if(g.sem_saida.length){
    const cs=el('div',{class:'cartao',style:'border-color:var(--alerta)'});
    cs.appendChild(el('h2',{texto:'Nao saiu nada em '+g.janela.dias+' dia(s) — '+g.sem_saida.length+' tecido(s)'}));
    cs.appendChild(el('p',{class:'nota',texto:
      'Estes nao aparecem na lista de cima porque ela parte do consumo. Cobertura deles nao e zero: nao da pra dizer, que e outra coisa — e por isso eles precisam de lista propria.'}));
    const temValor=g.sem_saida.some(l=>l.valor!==undefined);
    cs.appendChild(tabela(
      [{nome:'Tecido'},{nome:'Rolos',num:true},{nome:'Parado (m²)',num:true}]
        .concat(temValor?[{nome:'Valor',num:true}]:[]),
      g.sem_saida.map(l=>el('tr',{},[
        el('td',{texto:[l.linha_nome,l.abertura_nome,l.cor_nome].join(' · ')}),
        el('td',{class:'num',texto:String(l.rolos)}),
        el('td',{class:'num',texto:formatarArea(l.m2_parado)})
      ].concat(temValor?[el('td',{class:'num',
        texto:(l.rolos_sem_preco?'≥ ':'')+dinheiro(l.valor)})]:[])))));
    pai.appendChild(cs);
  }

  if(g.meses.length>1){
    const cm=cartao(pai,'Consumo mes a mes','A serie inteira, sem a janela: a janela e da media, a serie e a historia.');
    cm.appendChild(tabela([{nome:'Mes'},{nome:'m²',num:true},{nome:'Metros',num:true},{nome:'Rolos',num:true}],
      g.meses.map(m=>el('tr',{},[
        el('td',{texto:m.mes}),
        el('td',{class:'num',texto:formatarArea(m.m2)}),
        el('td',{class:'num',texto:formatarMetros(m.metros)}),
        el('td',{class:'num',texto:String(m.rolos)})
      ]))));
  }
}

// ── ENCALHE ──────────────────────────────────────────────────────────────
async function telaEncalhe(pai){
  const linhas=await api('/api/painel/encalhe');
  pai=limpar(pai);
  const c=cartao(pai,'Encalhe — a sobra mais parada primeiro',
    'Retalho que nao sai ha meses e dinheiro dormindo. Em alguns meses este relatorio responde melhor que o palpite de 50% do peso da sobra.');
  const t=tabela([{nome:'Etiqueta'},{nome:'Tecido'},{nome:'Medida',num:true},
    {nome:'m²',num:true},{nome:'Condição'},{nome:'Parada há',num:true}],
    linhas.map(s=>el('tr',{},[
      el('td',{texto:s.codigo}),
      el('td',{texto:[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:formatarMedida(s.largura,s.altura)}),
      el('td',{class:'num',texto:formatarArea(s.area)}),
      el('td',{texto:s.condicao}),
      el('td',{class:'num',texto:s.dias_parada+' dias'})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhuma sobra disponivel.'}));
}

// ── REFUGO ───────────────────────────────────────────────────────────────
async function telaRefugo(pai){
  const linhas=await api('/api/painel/refugo');
  pai=limpar(pai);
  const c=cartao(pai,'Refugo por mês e motivo',
    'A perda fica medida, não some. Sem esta tabela o desperdício do mês é uma sensação.');
  const t=tabela([{nome:'Mês'},{nome:'Motivo'},{nome:'Linhas',num:true},{nome:'m²',num:true}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.mes}), el('td',{texto:r.motivo||'—'}),
      el('td',{class:'num',texto:String(r.linhas)}),
      el('td',{class:'num',texto:formatarArea(r.area)})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhum refugo registrado.'}));
}

// ── RECUSAS ──────────────────────────────────────────────────────────────
async function telaRecusas(pai){
  const linhas=await api('/api/painel/recusas');
  pai=limpar(pai);
  const c=cartao(pai,'Recusas — onde o reaproveitamento trava',
    'O motivo não é burocracia, é o diagnóstico. Se "tonalidade" dominar, a resposta é registrar o tom no cadastro da sobra; se for "defeito não cadastrado", o problema está no lançamento na bancada.');
  const maior=linhas.reduce((m,r)=>Math.max(m,r.vezes),1);
  const t=tabela([{nome:'Motivo'},{nome:'Vezes',num:true},{nome:''},{nome:'Última'}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.motivo||'—'}),
      el('td',{class:'num',texto:String(r.vezes)}),
      el('td',{},[el('div',{class:'barra',style:'width:'+(r.vezes/maior*100)+'%'})]),
      el('td',{texto:r.ultima||''})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',
    texto:'Nenhuma recusa ainda — e isso e uma boa noticia.'}));
}

// ── CORTES ───────────────────────────────────────────────────────────────
async function telaCortes(pai){
  const linhas=await api('/api/painel/cortes');
  pai=limpar(pai);
  const c=cartao(pai,'Cortes confirmados, por mês',
    'Quanto de rolo saiu, quanto virou peça, quanto virou retalho e quanto se perdeu.');
  const t=tabela([{nome:'Mês'},{nome:'Planos',num:true},{nome:'Rolo consumido',num:true},
    {nome:'Peças',num:true},{nome:'Virou sobra',num:true},{nome:'Desperdício',num:true}],
    linhas.map(r=>el('tr',{},[
      el('td',{texto:r.mes}),
      el('td',{class:'num',texto:String(r.planos)}),
      el('td',{class:'num',texto:formatarMetros(r.consumo_linear)}),
      el('td',{class:'num',texto:formatarArea(r.area_pecas)}),
      el('td',{class:'num',texto:formatarArea(r.area_sobra)}),
      el('td',{class:'num',texto:formatarArea(r.desperdicio)})
    ])));
  c.appendChild(linhas.length?t:el('div',{class:'vazio',texto:'Nenhum plano confirmado ainda.'}));
}

desenhar();
</script>
</body>
</html>
