<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastros · Tecido</title>
<link rel="stylesheet" href="/sobmedida/base.css">
</head>
<body>
<header class="topo">
  <h1>Cadastros</h1>
  <span class="espaco"></span>
</header>

<div class="corpo">
  <div class="abas" id="abas"></div>
  <!-- Container PROPRIO, fora do #conteudo: cada aba faz limpar(#conteudo) ao
       desenhar, e a lista do que falta conferir nao pertence a aba nenhuma. -->
  <div id="conferir"></div>
  <div id="conteudo"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,banner,el,limpar,$,num,comoNumero,formatarMetros}=window.ui;

let eu={}, aba='tecido';
const estado={linhas:[],aberturas:[],cores:[],tecidos:[],linhaSel:null,armazem:'ROLO',arvore:[],
  /* `linhaSel`/`aberturas` sao do cartao COLECAO ("de qual linha estou
     editando as colecoes"); `linhaForm`/`aberturasForm` sao do formulario de
     ITEM DE TECIDO ("em qual linha entra o tecido novo"). Sao perguntas
     diferentes e por isso variaveis diferentes — ver `carregarTecido`. */
  linhaForm:null, aberturasForm:[],
  // Qual tecido esta com o cartao de preco do m² aberto (um de cada vez).
  precificando:null};
const podeEditar=()=>eu.papel==='diretor';

const ABAS=[
  {id:'tecido',    nome:'Tecido'},
  {id:'endereco',  nome:'Enderecos'},
  {id:'motivo',    nome:'Motivos e condicoes'},
  {id:'parametro', nome:'Parametros'},
  {id:'acesso',    nome:'Quem entra', soDiretor:true}
];

function montarAbas(){
  const c=limpar($('#abas'));
  ABAS.filter(a=>!a.soDiretor||podeEditar()).forEach(a=>c.appendChild(el('button',{
    texto:a.nome,'aria-selected':String(a.id===aba),onclick:()=>{ aba=a.id; desenhar(); }})));
}

async function desenhar(){
  montarAbas();
  const c=limpar($('#conteudo'));
  // Em todas as abas, no topo: o que espera conferencia nao e de uma aba so.
  cartaoConferir();
  if(aba==='tecido')    return telaTecido(c);
  if(aba==='endereco')  return telaEndereco(c);
  if(aba==='motivo')    return telaMotivo(c);
  if(aba==='parametro') return telaParametro(c);
  if(aba==='acesso')    return telaAcesso(c);
}

// Um cartao com titulo, nota e conteudo — a moldura repetida das quatro abas.
function cartao(pai,titulo,nota){
  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:titulo}));
  if(nota) c.appendChild(el('p',{class:'nota',texto:nota}));
  pai.appendChild(c);
  return c;
}

// Linha de formulario: campos + botao. Some inteira para quem nao edita.
function formulario(pai,campos,rotuloBotao,aoEnviar){
  if(!podeEditar()) return null;
  const f=el('div',{class:'campos'});
  const refs={};
  campos.forEach(cp=>{
    const box=el('div',{class:'campo'+(cp.cresce?' cresce':'')});
    box.appendChild(el('label',{texto:cp.rotulo}));
    const input=cp.opcoes
      ? el('select',{})
      : el('input',{type:cp.tipo||'text',inputmode:cp.inputmode||null,placeholder:cp.dica||''});
    if(cp.opcoes){
      cp.opcoes.forEach(o=>input.appendChild(el('option',{value:o.valor,texto:o.nome})));
      /* O VALOR INICIAL E DECLARADO, e nao "o primeiro da lista".
         Sem isto o select nasce sempre no primeiro item, mesmo quando a tela
         ja sabe qual e a escolha — e o campo passa a mostrar uma coisa
         enquanto o resto do formulario descreve outra. */
      if(cp.valor!==undefined&&cp.valor!==null) input.value=String(cp.valor);
    }
    // O `aoMudar` recebe os campos do proprio formulario: mudar um seletor
    // quase sempre significa mexer no seletor do lado, e nao redesenhar tudo.
    if(cp.aoMudar) input.addEventListener('change',()=>cp.aoMudar(input.value,refs));
    box.appendChild(input);
    refs[cp.id]=input;
    f.appendChild(box);
  });
  const bt=el('button',{class:'bt primario',texto:rotuloBotao,onclick:async()=>{
    const valores={};
    for(const k in refs) valores[k]=refs[k].value;
    bt.disabled=true;
    try{ await aoEnviar(valores,refs); }catch(e){}
    bt.disabled=false;
  }});
  f.appendChild(el('div',{class:'campo'},[bt]));
  pai.appendChild(f);
  return refs;
}

// Botao de ligar/desligar o cadastro. Cadastro nao se apaga — se desativa.
function botaoAtivo(item,rota,recarregar){
  if(!podeEditar()) return el('span',{class:'tag '+(item.ativo?'bom':'off'),texto:item.ativo?'ativo':'inativo'});
  return el('button',{class:'bt pequeno',texto:item.ativo?'Desativar':'Reativar',onclick:async()=>{
    await api(rota,{metodo:'PUT',corpo:{ativo:item.ativo?0:1}});
    await recarregar();
  }});
}

/* RENOMEAR. O servidor sempre aceitou (o PUT do cadastro leva `nome`), e a
   tela nunca ofereceu o botao — entao a unica saida para um "Pinpoit" sem o
   segundo N era desativar e criar de novo, deixando uma linha morta na lista
   e perdendo o vinculo com quem ja apontava para ela.

   Cadastro que so sabe DESATIVAR obriga a errar duas vezes para consertar
   uma. E nome de tecido muda de verdade: fornecedor renomeia colecao, e a
   equipe passa a chamar pelo nome novo enquanto a tela mostra o velho. */
function botaoRenomear(item,rota,recarregar){
  if(!podeEditar()) return el('span',{});
  return el('button',{class:'bt pequeno',texto:'Renomear',onclick:async()=>{
    const nome=prompt('Novo nome para "'+item.nome+'":',item.nome);
    if(nome===null) return;                      // cancelou
    if(!nome.trim()||nome.trim()===item.nome) return;
    try{
      await api(rota,{metodo:'PUT',corpo:{nome:nome.trim()}});
      banner('Renomeado para "'+nome.trim()+'".');
      await recarregar();
    }catch(e){}
  }});
}

/* APAGAR DE VERDADE. A regra da casa e "cadastro nao se apaga, desativa",
   e ela existe porque linha de historico aponta para o cadastro — apagar a
   cor faria o plano de tres meses atras deixar de saber o que foi cortado.

   So que a regra sozinha produz o problema oposto: o cadastro digitado
   errado no primeiro dia fica na lista para sempre, riscado, e a tela vira
   deposito de coisa morta que ninguem le mais.

   Quem decide e o servidor: se NINGUEM aponta, apaga; se alguem aponta,
   recusa dizendo QUEM ("3 rolos usam este endereco"). O botao aparece
   sempre — esconde-lo exigiria uma consulta por linha e, pior, deixaria a
   pessoa sem saber POR QUE nao pode. */
function botaoApagar(item,tipo,recarregar){
  if(!podeEditar()) return el('span',{});
  return el('button',{class:'bt pequeno perigo',texto:'Apagar',onclick:async()=>{
    if(!confirm('Apagar "'+(item.nome||item.valor)+'" de vez?\n\n'+
                'Se algo no historico usar este cadastro, o sistema recusa e diz o que e.')) return;
    try{
      await api('/api/cadastro/'+tipo+'/'+item.id,{metodo:'DELETE'});
      banner('Apagado.');
      await recarregar();
    }catch(e){}
  }});
}

// O trio que toda linha de cadastro carrega: renomear, apagar, ligar/desligar.
const acoes=(item,rota,recarregar,tipo)=>
  el('td',{style:'text-align:right;white-space:nowrap'},
    [botaoRenomear(item,rota,recarregar),
     el('span',{texto:' '}),
     tipo?botaoApagar(item,tipo,recarregar):el('span',{}),
     el('span',{texto:' '}),
     botaoAtivo(item,rota,recarregar)]);

/* ── O QUE A BANCADA CRIOU E FALTA CONFERIR ───────────────────────────────
   A outra metade de deixar a bancada cadastrar. Sem esta lista o que mudou
   nao foi "a chefia confere depois" — foi "ninguem confere", e a marcacao no
   banco viraria uma promessa que a tela nao cumpre.

   Ela abre em TODAS as abas de cadastro, no topo, porque o que espera
   conferencia pode ser de qualquer uma delas. Some inteira quando esta vazia:
   um cartao permanente escrito "nada a conferir" e ruido que ensina o olho a
   pular a regiao onde o aviso de verdade vai aparecer. */
async function cartaoConferir(){
  const pai=limpar($('#conferir'));
  if(!podeEditar()) return;
  const itens=await api('/api/cadastro/conferir');
  if(!itens.length) return;

  const c=el('div',{class:'cartao',style:'border-color:var(--alerta)'});
  c.appendChild(el('h2',{texto:'Conferir — '+itens.length+' cadastro(s) criado(s) na bancada'}));
  c.appendChild(el('p',{class:'nota',texto:
    'A bancada cria largura de bobina e endereco sem esperar, porque a alternativa nao era esperar: era lancar errado (largura) ou nao enderecar (rolo perdido na estante). O que sai de la entra valendo e cai aqui para voce olhar com calma.'}));

  const t=el('table',{});
  t.appendChild(el('tr',{},[el('th',{texto:'O que'}),el('th',{texto:'Cadastro'}),
    el('th',{texto:'Quem'}),el('th',{texto:'Quando'}),el('th',{texto:'Onde arrumar'}),el('th',{texto:''})]));
  itens.forEach(i=>t.appendChild(el('tr',{},[
    el('td',{texto:i.oque}),
    el('td',{texto:i.rotulo}),
    el('td',{texto:i.criado_por||'—'}),
    el('td',{texto:(i.criado_em||'').slice(0,16)}),
    el('td',{class:'quem',texto:i.onde}),
    el('td',{style:'text-align:right'},[
      /* "Conferi" so tira da lista — nao arruma nada. Corrigir tem botao
         proprio (Renomear, Apagar) na aba certa; um conferir que tambem
         arrumasse esconderia qual das duas coisas a pessoa fez. */
      el('button',{class:'bt pequeno',texto:'Conferi',onclick:async()=>{
        await api('/api/cadastro/conferir/'+i.tipo+'/'+i.id,{metodo:'POST'});
        await cartaoConferir();
      }})])
  ])));
  c.appendChild(t);
  pai.appendChild(c);
}

// ── ABA TECIDO ───────────────────────────────────────────────────────────
async function carregarTecido(){
  estado.linhas=await api('/api/linhas');
  estado.cores=await api('/api/cores');
  if(!estado.linhaSel&&estado.linhas.length) estado.linhaSel=estado.linhas[0].id;
  estado.aberturas=estado.linhaSel?await api('/api/aberturas?linha_id='+estado.linhaSel):[];

  /* ⚠️ A LINHA DO FORMULARIO DE ITEM DE TECIDO E OUTRA ESCOLHA, e ate
     15/09/2026 as duas eram a mesma variavel (`estado.linhaSel`). Duas coisas
     quebravam por causa disso:

     1. Trocar a linha no formulario redesenhava a aba inteira, e o cartao
        "Colecao" la em cima passava a listar as colecoes da outra linha.
        Como esse cartao fica ACIMA, ele muda de altura e EMPURRA o
        formulario — a pessoa escolhe a linha e o campo seguinte sai de
        debaixo do dedo dela.
     2. Pior: o select era recriado sem valor, entao voltava sozinho para a
        PRIMEIRA linha ativa, enquanto as colecoes ao lado ja eram as da
        linha escolhida. O formulario passava a descrever uma combinacao que
        o servidor recusa (`abertura_de_outra_linha`), e a recusa nao tinha
        como fazer sentido para quem leu a tela.

     O cartao de cima e "qual linha estou editando as colecoes"; este e "qual
     linha vai o tecido novo". Nomes proprios porque sao perguntas diferentes.

     `linhaForm` pode apontar para linha INATIVA (o seletor oferece as duas,
     ver `comInativasNoFim`), mas NASCE na primeira ativa: o caso normal e
     cadastrar no que esta em uso, e abrir o formulario ja apontando para uma
     linha desativada seria oferecer o incomum por acidente. So precisa
     apontar para uma linha que EXISTE — apontar para id apagado deixaria o
     campo sem nada escolhido. */
  const ativas=estado.linhas.filter(l=>l.ativo);
  if(!estado.linhas.some(l=>l.id===estado.linhaForm))
    estado.linhaForm=(ativas[0]||estado.linhas[0]||{}).id||null;
  estado.aberturasForm = estado.linhaForm===estado.linhaSel ? estado.aberturas
    : (estado.linhaForm?await api('/api/aberturas?linha_id='+estado.linhaForm):[]);

  estado.tecidos=await api('/api/tecidos');
}

/* ⚠️ OS TRES SELETORES DO FORMULARIO OFERECEM AS INATIVAS TAMBEM — linha,
   colecao e cor.

   Desativar um cadastro e dizer "nao vendemos mais isto", nao "isto nao
   existe": os rolos continuam na estante, as sobras continuam na prateleira e
   o historico continua apontando para ele. Sem as inativas nos seletores,
   cadastrar um item que faltou numa combinacao dessas exigia REATIVAR,
   cadastrar e desativar de novo — tres passos, e no meio deles o cadastro
   volta a aparecer na entrada de rolo e no corte para a fabrica inteira.

   Elas vao NO FIM e escritas "(inativa)", e essa marca nao e enfeite: as
   fileiras da entrada de rolo, do corte e das sobras olham o `ativo` DO
   TECIDO, nunca o da linha, o da colecao ou o da cor (conferido em
   15/09/2026). Entao um tecido novo numa combinacao desativada aparece para a
   fabrica inteira no mesmo instante — trazendo de volta um cadastro que
   alguem desligou de proposito. Quem escolhe tem que ver que escolheu isso;
   um nome igual ao das outras faria a pessoa reabrir sem perceber.

   O servidor nunca exigiu cadastro ativo (`criarTecido` so exige que linha,
   colecao e cor existam, e que a colecao seja da linha), entao isto e a tela
   alcancando o que o dominio ja permitia.

   As tres passam pela MESMA funcao porque a regra e a mesma: tres copias
   divergiriam no dia em que uma delas mudasse a marca ou a ordem, e ai a
   mesma tela diria que "(inativa)" quer dizer coisas diferentes em campos
   vizinhos. (Linha, colecao e cor sao todas femininas — por isso uma marca
   so serve para as tres.) */
const comInativasNoFim=itens=>
  itens.filter(i=>i.ativo).concat(itens.filter(i=>!i.ativo))
    .map(i=>({valor:i.id, nome:i.ativo?i.nome:i.nome+' (inativa)'}));

/* As colecoes do formulario trocam SEM redesenhar a tela: e so o seletor do
   lado que muda, e redesenhar tudo era justamente o que movia o formulario
   de lugar e perdia a linha escolhida. */
async function colecoesDoFormulario(linha_id,refs){
  estado.linhaForm=Number(linha_id);
  estado.aberturasForm=linha_id?await api('/api/aberturas?linha_id='+linha_id):[];
  const s=limpar(refs.abertura_id);
  const opcoes=comInativasNoFim(estado.aberturasForm);
  if(opcoes.length) opcoes.forEach(o=>s.appendChild(el('option',{value:o.valor,texto:o.nome})));
  // Select vazio nao diz nada e em alguns navegadores nem abre. A frase diz
  // o que falta, no lugar onde a pessoa esta olhando. Ela so aparece quando
  // nao ha colecao NENHUMA — nem inativa —, senao mandaria cadastrar o que
  // ja existe e esta logo ali na lista.
  else s.appendChild(el('option',{value:'',texto:'— esta linha ainda nao tem colecao —'}));
}

async function telaTecido(pai){
  await carregarTecido();
  pai=limpar(pai);

  // Linha
  const cL=cartao(pai,'Linha','Rolo, Romana, Painel. O primeiro dos tres niveis do tecido.');
  formulario(cL,[{id:'nome',rotulo:'Nome da linha',dica:'Rolo',cresce:true}],'Adicionar linha',
    async(v,refs)=>{ if(!v.nome.trim()) return;
      await api('/api/linhas',{metodo:'POST',corpo:{nome:v.nome}});
      refs.nome.value=''; banner('Linha cadastrada.'); await telaTecido($('#conteudo')); });
  const tL=el('table',{});
  estado.linhas.forEach(l=>tL.appendChild(el('tr',{class:l.ativo?'':'inativo'},[
    el('td',{texto:l.nome}),
    acoes(l,'/api/linhas/'+l.id,()=>telaTecido($('#conteudo')),'linha')
  ])));
  cL.appendChild(estado.linhas.length?tL:el('div',{class:'vazio',texto:'Nenhuma linha ainda.'}));

  // Abertura (pendurada na linha escolhida)
  const cA=cartao(pai,'Colecao','Napoles, Pinpoint, 1%, 3%, 5%, Blackout. A colecao pertence a uma LINHA — a de uma nao e a da outra.');
  const fil=el('div',{class:'fileira'});
  fil.appendChild(el('span',{class:'rotulo',texto:'LINHA'}));
  estado.linhas.forEach(l=>fil.appendChild(el('button',{class:'op',texto:l.nome,
    'aria-pressed':String(l.id===estado.linhaSel),
    onclick:async()=>{ estado.linhaSel=l.id; await telaTecido($('#conteudo')); }})));
  cA.appendChild(fil);
  if(estado.linhaSel){
    formulario(cA,[{id:'nome',rotulo:'Nome da colecao',dica:'Napoles',cresce:true}],'Adicionar colecao',
      async(v,refs)=>{ if(!v.nome.trim()) return;
        await api('/api/aberturas',{metodo:'POST',corpo:{nome:v.nome,linha_id:estado.linhaSel}});
        refs.nome.value=''; banner('Abertura cadastrada.'); await telaTecido($('#conteudo')); });
    const tA=el('table',{});
    estado.aberturas.forEach(a=>tA.appendChild(el('tr',{class:a.ativo?'':'inativo'},[
      el('td',{texto:a.nome}),
      acoes(a,'/api/aberturas/'+a.id,()=>telaTecido($('#conteudo')),'abertura')
    ])));
    cA.appendChild(estado.aberturas.length?tA:el('div',{class:'vazio',texto:'Esta linha ainda nao tem colecao.'}));
  }

  // Cor
  const cC=cartao(pai,'Cor','So a COR: Bege, Branco, Cinza. A colecao (Napoles, Pinpoint) fica no campo de cima — "Napoles Bege" aqui faria o sistema deixar de saber que aquilo e bege, e cada colecao nova traria o mesmo punhado de cores de novo.');
  formulario(cC,[{id:'nome',rotulo:'Nome da cor',dica:'Bege',cresce:true}],'Adicionar cor',
    async(v,refs)=>{ if(!v.nome.trim()) return;
      await api('/api/cores',{metodo:'POST',corpo:{nome:v.nome}});
      refs.nome.value=''; banner('Cor cadastrada.'); await telaTecido($('#conteudo')); });
  const tC=el('table',{});
  estado.cores.forEach(c=>tC.appendChild(el('tr',{class:c.ativo?'':'inativo'},[
    el('td',{texto:c.nome}),
    acoes(c,'/api/cores/'+c.id,()=>telaTecido($('#conteudo')),'cor')
  ])));
  cC.appendChild(estado.cores.length?tC:el('div',{class:'vazio',texto:'Nenhuma cor ainda.'}));

  /* AS LARGURAS DE BOBINA.
     Fica nesta aba, logo antes do item de tecido, porque e a resposta da
     pergunta que a nota abaixo levanta: "a largura e do rolo, entao onde ela
     mora?". Mora aqui — e e daqui que saem os botoes da entrada de rolo. */
  const cLarg=cartao(pai,'Larguras de bobina',
    'As larguras que a fabrica compra. Sao elas que viram BOTAO na entrada de rolo, no lugar de o operador digitar.');
  cLarg.appendChild(el('p',{class:'ajuda',texto:
    'Digitar largura erra de dois jeitos que ninguem percebe: "2,5" e "2,50" viram bobinas diferentes na consulta do plano, e um "20,0" com a virgula no lugar errado entra como bobina de vinte metros — e o encaixe passa a achar que cabe qualquer peca.'}));
  if(podeEditar()) formulario(cLarg,[
    {id:'valor',rotulo:'Largura (m)',dica:'2,50',inputmode:'decimal',cresce:true}
  ],'Cadastrar largura',async(v,refs)=>{
    await api('/api/larguras',{metodo:'POST',corpo:{valor:v.valor}});
    refs.valor.value=''; banner('Largura cadastrada.'); await telaTecido($('#conteudo'));
  });
  const larguras=await api('/api/larguras');
  if(larguras.length){
    const tL=el('table',{});
    tL.appendChild(el('tr',{},[el('th',{texto:'Largura'}),
      el('th',{class:'num',texto:'Rolos em uso'}),el('th',{texto:''})]));
    larguras.forEach(l=>{
      const bt=el('button',{class:'bt pequeno',texto:l.ativo?'Tirar da lista':'Reativar',
        onclick:async()=>{
          try{ await api('/api/larguras/'+l.id,{metodo:'PUT',corpo:{ativo:l.ativo?0:1}});
               await telaTecido($('#conteudo')); }catch(e){}
        }});
      tL.appendChild(el('tr',{class:l.ativo?'':'inativo'},[
        el('td',{texto:formatarMetros(l.valor)}),
        el('td',{class:'num',texto:String(l.rolos)}),
        el('td',{style:'text-align:right'},[podeEditar()?bt:el('span',{})])
      ]));
    });
    cLarg.appendChild(tL);
    cLarg.appendChild(el('p',{class:'ajuda',texto:
      'Largura com rolo em uso nao sai da lista: ela ainda descreve a prateleira, e tira-la faria a proxima entrada daquela bobina cair no campo livre com aviso de "nao cadastrada".'}));
  } else cLarg.appendChild(el('div',{class:'vazio',
    texto:'Nenhuma largura ainda. Sem elas, a entrada de rolo pede a largura digitada.'}));

  /* FORNECEDORES. Era texto livre na entrada de rolo, e texto livre nao
     compara: 'Ecotex', 'ecotex' e 'Ecotex Ltda' somam separado, e o defeito
     so aparece meses depois, na hora de responder qual fornecedor esta mais
     caro. A migracao 9 semeou esta lista com o que ja tinha sido digitado —
     marcado para conferir, porque e AQUI que os duplicados aparecem. */
  const cF=cartao(pai,'Fornecedores','De quem o rolo veio. O preco NAO mora aqui.');
  cF.appendChild(el('p',{class:'ajuda',texto:

  cT.appendChild(el('p',{class:'ajuda',texto:

    '"Bobina mais comum" nao muda calculo nenhum: ela so deixa o botao ja marcado na entrada de rolo. Pode ficar em branco. "Pode girar" muda: tecido com sentido (textura, listra, desenho que corre) nao pode ser virado, entao a largura da peca tem que sair no sentido da largura da bobina.'}));

      /* Escolha, nao digitacao — pelo mesmo motivo da entrada de rolo. Um
         campo de texto aqui deixaria entrar 2,5 e 2,50 como coisas
         diferentes, na tela que existe para padronizar o cadastro.

      {id:'permite_girar',rotulo:'Pode girar a peca?',
       opcoes:[{valor:'0',nome:'Nao — o tecido tem sentido'},{valor:'1',nome:'Sim'}]}
    ],'Cadastrar tecido',async(v)=>{
      await api('/api/tecidos',{metodo:'POST',corpo:{
        linha_id:Number(v.linha_id), abertura_id:Number(v.abertura_id), cor_id:Number(v.cor_id),

    });
  }
  const tT=el('table',{});
  /* O PRECO DO M² e o que da valor as sobras (area x preco), e LANCA-SE AQUI
     desde 15/09/2026. Antes a unica porta era Sobras → Catalogo, e ela so
     lista tecido que JA TEM SOBRA: o tecido recem-cadastrado, que nunca
     produziu retalho, nao tinha onde receber preco nenhum — e sem preco ele
     nunca entra na conta do acervo, nem quando a primeira sobra aparecer.
     Um beco igual ao da cor sem item de tecido: a tela sabia mostrar o traco
     na coluna e nao sabia deixar ninguem preencher.

     As duas portas chamam a MESMA rota (`PUT /api/tecidos/:id/preco`), com o
     mesmo historico — nao ha segundo caminho de escrita no preco.
     Quem nao ve custo nem recebe o campo (a poda e do servidor). */
  const veCusto=(eu.permissoes||[]).includes('custo.ver');
  tT.appendChild(el('tr',{},[el('th',{texto:'Codigo'}),el('th',{texto:'Tecido'}),
    el('th',{class:'num',texto:'Largura sugerida'}),el('th',{texto:'Girar'}),
    ...(veCusto?[el('th',{class:'num',texto:'R$/m²'})]:[]),el('th',{texto:''})]));
  estado.tecidos.forEach(t=>tT.appendChild(el('tr',{class:t.ativo?'':'inativo'},[
    el('td',{texto:t.codigo}),
    el('td',{texto:[t.linha_nome,t.abertura_nome,t.cor_nome].join(' · ')}),
    el('td',{class:'num',texto:t.largura_sugerida?num(t.largura_sugerida)+' m':'—'}),
    el('td',{texto:t.permite_girar?'sim':'nao'}),
    ...(veCusto?[el('td',{class:'num'+(t.preco_m2==null?' aviso':''),
      texto:t.preco_m2==null?'—':window.ui.dinheiro(t.preco_m2),
      title:t.preco_m2==null
        ? 'sem preco: as sobras deste tecido ficam fora da conta do acervo. O botao Preco lanca.'
        : 'o preco do m² que da valor as sobras deste tecido'})]:[]),
    /* O tecido nao tem renomear: o nome dele E a combinacao linha+colecao+cor,
       e "renomear" ali seria trocar a combinacao — que e outro tecido. O que
       cabe e apagar (quando nada usa) ou desativar. */
    el('td',{style:'text-align:right;white-space:nowrap'},[
      ...(veCusto&&podeEditar()?[
        el('button',{class:'bt pequeno',texto:t.preco_m2==null?'Preco ⚠':'Preco',
          title:'o preco do m² deste tecido — vale para todas as sobras dele',
          onclick:()=>{ estado.precificando=t.id; telaTecido($('#conteudo')); }}),
        el('span',{texto:' '})]:[]),
      botaoApagar(t,'tecido',()=>telaTecido($('#conteudo'))),
      el('span',{texto:' '}),
      botaoAtivo(t,'/api/tecidos/'+t.id,()=>telaTecido($('#conteudo')))])
  ])));
  cT.appendChild(estado.tecidos.length?tT:el('div',{class:'vazio',texto:'Nenhum tecido cadastrado ainda.'}));

  if(veCusto){
    const semPreco=estado.tecidos.filter(t=>t.ativo&&t.preco_m2==null).length;
    if(semPreco) cT.appendChild(el('p',{class:'ajuda',texto:
      semPreco+' tecido(s) ativo(s) sem preco do m². As sobras deles ficam de fora '+
      'da conta de quanto vale a prateleira — ela sai como PISO ate o ultimo ser lancado.'}));
  }

  // O cartao de preco abre abaixo da tabela, com a linha ainda a vista.
  if(estado.precificando){
    const t=estado.tecidos.find(x=>x.id===estado.precificando);
    if(t&&veCusto&&podeEditar()) await cartaoPreco(cT,t);
    else estado.precificando=null;
  }
}

/* ── O PRECO DO M² DE UM TECIDO ───────────────────────────────────────────
   Um tecido de cada vez, como o resto desta aba: dez campos de preco abertos
   ao mesmo tempo dariam para editar e nao dariam para ler, e ficha que
   ninguem consegue conferir e ficha que ninguem confere.

   O que pre-preenche, quando o tecido ainda nao tem preco, e o ULTIMO PRECO
   PAGO por rolo deste tecido — a mesma fonte da nota do rolo, e a mesma
   sugestao do cartao de Sobras → Catalogo. Tabela de preco mantida a mao
   envelhece calada (armadilha #15 do CLAUDE.md); o ultimo pago, nao. */
async function cartaoPreco(pai,t){
  const nome=[t.linha_nome,t.abertura_nome,t.cor_nome].join(' · ');
  const c=el('div',{class:'cartao',style:'border-color:var(--acao);margin-top:14px'});
  c.appendChild(el('h2',{texto:'Preco do m² — '+nome}));
  c.appendChild(el('p',{class:'nota',texto:t.preco_m2==null
    ? 'Este tecido ainda nao tem preco do m². E ele que da valor as sobras (area × preco).'
    : 'Hoje: '+window.ui.dinheiro(t.preco_m2)+'/m². Mudar aqui muda o valor de TODAS as sobras deste tecido de uma vez.'}));

  const preco=el('input',{type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'ex.: 18,50',
    value:t.preco_m2==null?'':num(t.preco_m2),style:'font-size:22px;min-height:56px'});
  const dica=el('p',{class:'ajuda'});
  if(t.preco_m2==null){
    try{
      const u=await api('/api/rolos/ultimo-preco?tecido_id='+t.id,{silencioso:true});
      if(u&&u.preco!=null){
        preco.value=num(u.preco);
        dica.textContent='Sugestao: ultimo pago por rolo deste tecido, '+
          window.ui.dinheiro(u.preco)+'/m² em '+String(u.quando).slice(0,10)+
          (u.de_outro_fornecedor?' ('+u.de_outro_fornecedor+')':'')+'. Mude se a sobra vale outra coisa.';
      } else dica.textContent='Nenhum rolo deste tecido tem preco lancado — nao ha sugestao.';
    }catch(e){ dica.textContent=''; }
  }

  const campo=el('div',{class:'campo'});
  campo.appendChild(el('label',{texto:'R$ POR M²'}));
  campo.appendChild(preco);
  const bt=el('button',{class:'bt primario',style:'min-height:56px',texto:'Salvar preco'});
  bt.onclick=async()=>{
    if(comoNumero(preco.value)===null) return banner('Diga o preco do metro quadrado.','erro');
    bt.disabled=true;
    try{
      const d=await api('/api/tecidos/'+t.id+'/preco',{metodo:'PUT',corpo:{preco_m2:preco.value}});
      banner(d.mudou?(nome+': '+window.ui.dinheiro(d.preco_m2)+'/m².'):'O preco ja era esse.');
      estado.precificando=null;
      await telaTecido($('#conteudo'));
    }catch(e){ bt.disabled=false; }
  };
  c.appendChild(el('div',{class:'campos'},[campo,
    el('div',{class:'campo'},[bt]),
    el('div',{class:'campo'},[el('button',{class:'bt',style:'min-height:56px',texto:'Cancelar',
      onclick:()=>{ estado.precificando=null; telaTecido($('#conteudo')); }})])]));
  c.appendChild(dica);

  // O historico: quem mudou, quando, de → para. Sem ele, o preco de hoje nao
  // se explica — e preco que nao se explica ninguem corrige com confianca.
  try{
    const h=await api('/api/tecidos/'+t.id+'/preco/historico',{silencioso:true});
    if(h.length){
      const tb=el('table',{});
      h.forEach(x=>tb.appendChild(el('tr',{},[
        el('td',{texto:String(x.criado_em).slice(0,16)}),
        el('td',{texto:window.ui.dinheiro(x.de)+' → '+window.ui.dinheiro(x.para)}),
        el('td',{class:'quem',texto:x.usuario_nome||''})
      ])));
      c.appendChild(el('h2',{style:'margin-top:14px;font-size:16px',texto:'Mudancas do preco'}));
      c.appendChild(tb);
    }
  }catch(e){}
  pai.appendChild(c);
}

async function telaEndereco(pai){
  estado.arvore=await api('/api/enderecos/'+estado.armazem);
  pai=limpar(pai);

  const c=cartao(pai,'Enderecos','Dois armazens, areas fisicas diferentes do mesmo galpao. Haste, andar e nivel sao cadastro livre — nenhuma quantidade e decidida no sistema.');
  c.appendChild(el('p',{class:'ajuda',texto:
    'Rolo fechado e aberto ficam no MESMO armazem ROLO: muda o status, nao o lugar. Sobra so endereca em SOBRA — endereco trocado e sobra que ninguem acha.'}));

  const fil=el('div',{class:'fileira'});
  fil.appendChild(el('span',{class:'rotulo',texto:'ARMAZEM'}));
  [['ROLO','Rolos'],['SOBRA','Sobras']].forEach(([chave,nome])=>
    fil.appendChild(el('button',{class:'op',texto:nome,'aria-pressed':String(chave===estado.armazem),
      onclick:async()=>{ estado.armazem=chave; await telaEndereco($('#conteudo')); }})));
  c.appendChild(fil);

  const recarregar=()=>telaEndereco($('#conteudo'));

  formulario(c,[{id:'nome',rotulo:'Nova haste',dica:'A',cresce:true}],'Adicionar haste',
    async(v,refs)=>{ if(!v.nome.trim()) return;
      await api('/api/hastes',{metodo:'POST',corpo:{nome:v.nome,armazem_chave:estado.armazem}});
      refs.nome.value=''; banner('Haste cadastrada.'); await recarregar(); });

  if(!estado.arvore.length){
    c.appendChild(el('div',{class:'vazio',texto:'Este armazem ainda nao tem haste.'}));
    return;
  }

  estado.arvore.forEach(h=>{
    const cH=el('div',{class:'cartao',style:'margin:14px 0 0'});
    const cab=el('div',{class:'campos',style:'align-items:center'});
    cab.appendChild(el('h2',{style:'margin:0;flex:1',texto:'Haste '+h.nome}));
    cab.appendChild(el('span',{class:'tag '+(estado.armazem==='ROLO'?'rolo':'sobra'),texto:estado.armazem}));
    cab.appendChild(botaoRenomear(h,'/api/hastes/'+h.id,recarregar));
    cab.appendChild(botaoApagar(h,'haste',recarregar));
    cab.appendChild(botaoAtivo(h,'/api/hastes/'+h.id,recarregar));
    cH.appendChild(cab);

    formulario(cH,[{id:'nome',rotulo:'Novo andar nesta haste',dica:'02',cresce:true}],'Adicionar andar',
      async(v,refs)=>{ if(!v.nome.trim()) return;
        await api('/api/andares',{metodo:'POST',corpo:{nome:v.nome,haste_id:h.id}});
        refs.nome.value=''; await recarregar(); });

    h.andares.forEach(a=>{
      const cA=el('div',{style:'border-top:1px solid var(--linha);padding-top:12px;margin-top:12px'});
      const linhaA=el('div',{class:'campos',style:'align-items:center'});
      linhaA.appendChild(el('strong',{style:'flex:1',texto:'Andar '+a.nome}));
      linhaA.appendChild(botaoRenomear(a,'/api/andares/'+a.id,recarregar));
      linhaA.appendChild(botaoApagar(a,'andar',recarregar));
      linhaA.appendChild(botaoAtivo(a,'/api/andares/'+a.id,recarregar));
      cA.appendChild(linhaA);

      const niveis=el('div',{class:'fileira'});
      niveis.appendChild(el('span',{class:'rotulo',texto:'NIVEIS'}));
      /* O NIVEL ERA SO TEXTO: dava para criar e nunca mais tocar. Endereco
         digitado errado ficava para sempre na estante do sistema, e o
         operador procurava um buraco que nao existe. */
      a.niveis.forEach(n=>{
        const cx=el('span',{style:'display:inline-flex;align-items:center;gap:4px;margin:0 10px 6px 0'});
        cx.appendChild(el('span',{class:'tag '+(n.ativo?'bom':'off'),
          texto:estado.armazem+' · '+h.nome+'-'+a.nome+'-'+n.nome}));
        if(podeEditar()){
          cx.appendChild(botaoRenomear(n,'/api/niveis/'+n.id,recarregar));
          cx.appendChild(botaoApagar(n,'nivel',recarregar));
          cx.appendChild(botaoAtivo(n,'/api/niveis/'+n.id,recarregar));
        }
        niveis.appendChild(cx);
      });
      if(!a.niveis.length) niveis.appendChild(el('span',{class:'quem',style:'align-self:center',texto:'sem nivel'}));
      cA.appendChild(niveis);

      formulario(cA,[{id:'nome',rotulo:'Novo nivel neste andar',dica:'03',cresce:true}],'Adicionar nivel',
        async(v,refs)=>{ if(!v.nome.trim()) return;
          await api('/api/niveis',{metodo:'POST',corpo:{nome:v.nome,andar_id:a.id}});
          refs.nome.value=''; await recarregar(); });

      cH.appendChild(cA);
    });

    pai.appendChild(cH);
  });
}

  const papeis=await api('/api/papeis');

  const c=cartao(pai,'A liberacao mora no admin do PCP',
    'Nao ha cadastro de pessoas aqui. Quem entra no sob medida e quem tem a area marcada em Admin -> Acessos.');
  const ir=el('a',{class:'bt primario',href:'/admin',target:'_top',
    style:'text-decoration:none;display:inline-flex;align-items:center',
    texto:'Abrir Admin -> Acessos'});
  c.appendChild(ir);
  c.appendChild(el('p',{class:'ajuda',texto:
    'Duas areas, e a diferenca entre elas e o que se pode ESTRAGAR: a bancada corta e cadastra sobra; a chefia mexe em tecido, endereco e nos parametros do calculo.'}));

  const t=el('table',{});
  t.appendChild(el('tr',{},[el('th',{texto:'Area no PCP'}),el('th',{texto:'Vira'}),el('th',{texto:'Alcanca'})]));
  [['Sob medida - bancada','cortador'],
   ['Sob medida - cadastros','diretor'],
   ['Admin (controle geral)','diretor']].forEach(([area,papel])=>{
    const p=papeis.find(x=>x.papel===papel);
    t.appendChild(el('tr',{},[
      el('td',{texto:area}),
      el('td',{},[el('span',{class:'tag '+(papel==='diretor'?'bom':'rolo'),texto:papel})]),
      el('td',{texto:p?p.permissoes.join(' · '):''})
    ]));
  });
  c.appendChild(t);
  c.appendChild(el('p',{class:'ajuda',texto:
    'Repare que "Descartar sobra" nao esta no cortador: baixa de sobra sem trava e o furo classico de inventario.'}));

  c.appendChild(el('p',{class:'ajuda',texto:
    'Tirar o acesso e desmarcar a area la — ou desligar a pessoa, o que fecha as duas operacoes de uma vez. Era isso que os dois cadastros separados nao davam.'}));
}

  eu=await api('/api/eu');
  desenhar();
})();
