<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolos · Tecido</title>
<link rel="stylesheet" href="/sobmedida/base.css">
</head>
<body>
<header class="topo">
  <h1>Rolos</h1>
  <span class="espaco"></span>
</header>

<div class="corpo">
  <div class="abas" id="abas"></div>
  <div id="conteudo"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,banner,el,limpar,$,num,comoNumero,formatarMetros,formatarArea}=window.ui;

let eu={}, aba='estoque';
const estado={tecidos:[],arvore:[],tecido_id:null,nivel_id:null,
  larguras:null,largura:null,larguraOutra:'',
  fornecedores:null,fornecedor_id:null,nota:null};

// O MESMO arredondamento do servidor (dados/largura.js). Sem ele, o botao de
// 2,50 nao casaria com o 2.5 que volta do banco e a tela nunca marcaria
// nenhuma bobina como escolhida.
const dLargura={arred:v=>Math.round(Number(String(v).replace(',','.'))*1000)/1000};
const ABAS=[{id:'estoque',nome:'Em estoque'},{id:'entrada',nome:'Entrada de rolo'}];
const podeEntrar=()=>['diretor','cortador'].includes(eu.papel);
/* QUEM VE PRECO E QUEM LANCA NOTA. A tela só decide o que DESENHAR — o
   servidor ja mandou o JSON sem os campos de preco para quem nao tem
   custo.ver, entao esconder aqui e conforto, nunca a trava. */
const podeCusto=()=>(eu.permissoes||[]).includes('custo.ver');
const podeNota =()=>(eu.permissoes||[]).includes('rolo.nota');

// O formatador de dinheiro e o do ui.js — sobras escreve pelo mesmo.
const dinheiro=window.ui.dinheiro;

function montarAbas(){
  const c=limpar($('#abas'));
  ABAS.forEach(a=>c.appendChild(el('button',{texto:a.nome,'aria-selected':String(a.id===aba),
    onclick:()=>{ aba=a.id; desenhar(); }})));
}
function desenhar(){
  montarAbas();
  const c=limpar($('#conteudo'));
  return aba==='estoque'?telaEstoque(c):telaEntrada(c);
}
/* O "+ novo" NO FIM DA FILEIRA — a bancada nao espera a chefia.
   Ele so aparece onde faz sentido criar com a peca na mao (endereco). A
   alternativa real nao era o operador esperar: era ele deixar o rolo sem
   endereco "para enderecar depois", e o depois nao existe — o tubo fica na
   estante sem ninguem saber onde, que e pior que um nome digitado torto.
   O que a chefia perde e a vez, nao o controle: o que nasce aqui entra
   marcado e aparece na lista "Conferir" do cadastro. */
function fileira(rotulo,itens,sel,aoEscolher,novo){
  const f=el('div',{class:'fileira'});
  f.appendChild(el('span',{class:'rotulo',texto:rotulo}));
  if(!itens.length) f.appendChild(el('span',{class:'quem',style:'align-self:center',texto:'nada cadastrado'}));
  itens.forEach(i=>f.appendChild(el('button',{class:'op',texto:i.nome,
    'aria-pressed':String(String(i.valor)===String(sel)), onclick:()=>aoEscolher(i.valor)})));
  if(novo) f.appendChild(el('button',{class:'op',style:'border-style:dashed',
    texto:'+ '+novo.rotulo, onclick:async()=>{
      const nome=prompt(novo.pergunta);
      if(nome===null||!nome.trim()) return;
      try{
        const criado=await api(novo.rota,{metodo:'POST',corpo:{...novo.corpo,nome:nome.trim()}});
        banner(novo.rotulo+' "'+criado.nome+'" criada. A chefia confere depois — o rolo nao espera.');
        await novo.aoCriar(criado);
      }catch(e){}
    }}));
  return f;
}

/* ── LANCAR A NOTA DE UM ROLO ─────────────────────────────────────────────
   Formulario, e nao tres `prompt` em fila: sao quatro campos que se leem
   juntos da mesma nota fiscal, e prompt em sequencia obriga a decorar o que
   ja foi digitado. O total sai calculado embaixo — e ele que a pessoa
   confere contra o papel na mao, e o unico jeito de pegar uma virgula fora
   de lugar antes de o numero entrar no estoque. */
function abrirNota(r){ estado.nota=r; telaEstoque($('#conteudo')); }

async function cartaoNota(pai,r){
  const fornecedores=(await api('/api/fornecedores')).filter(f=>f.ativo);
  const c=el('div',{class:'cartao',style:'border-color:var(--acao)'});
  c.appendChild(el('h2',{texto:'Nota do rolo '+r.codigo}));
  c.appendChild(el('p',{class:'nota',texto:
    [r.linha_nome,r.abertura_nome,r.cor_nome].join(' · ')+
    '  ·  bobina '+num(r.largura)+' m  ·  entrou com '+formatarMetros(r.metragem_inicial)}));

  const sel=el('select',{});
  sel.appendChild(el('option',{value:'',texto:'— sem fornecedor —'}));
  fornecedores.forEach(f=>sel.appendChild(el('option',{value:String(f.id),texto:f.nome})));
  sel.value=r.fornecedor_id?String(r.fornecedor_id):'';

  const nf=el('input',{type:'text',value:r.nf||'',inputmode:'numeric'});
  const preco=el('input',{type:'text',value:r.preco_m2==null?'':num(r.preco_m2),inputmode:'decimal'});
  const total=el('p',{class:'ajuda'});

  /* O TOTAL DA COMPRA, ao vivo. m² COMPRADO (metragem inicial), nao o saldo:
     a nota cobra o rolo inteiro, e conferir contra o que sobrou nao fecharia
     com o papel nunca. */
  const m2Comprado=r.metragem_inicial*r.largura;
  const recalcular=()=>{
    const p=comoNumero(preco.value);
    total.textContent=p>0
      ? 'Confira contra a nota: '+formatarArea(m2Comprado)+' × '+dinheiro(p)+
        '/m²  =  '+dinheiro(m2Comprado*p)+' o rolo inteiro.'
      : 'Sem preco, este rolo fica fora da soma do estoque — e contado a parte, nunca como zero.';
  };
  preco.addEventListener('input',recalcular); recalcular();

  /* O ULTIMO PRECO PAGO pre-preenche — e vem das COMPRAS, nao de uma tabela.
     Tabela de preco por fornecedor envelhece calada: o numero fica la
     parecendo atual e ninguem sabe de quando e. */
  const dica=el('p',{class:'ajuda'});
  async function sugerir(){
    dica.textContent='';
    if(!sel.value) return;
    const u=await api('/api/rolos/ultimo-preco?tecido_id='+r.tecido_id+'&fornecedor_id='+sel.value);
    if(u.preco==null){ dica.textContent='Primeira compra deste tecido com este fornecedor.'; return; }
    dica.textContent='Ultimo pago: '+dinheiro(u.preco)+'/m² em '+String(u.quando).slice(0,10)+
      (u.de_outro_fornecedor?' — mas foi de '+u.de_outro_fornecedor+', nao deste.':'');
    if(!preco.value) preco.value=num(u.preco);
    recalcular();
  }
  sel.addEventListener('change',sugerir); sugerir();

  const campo=(rot,input)=>el('div',{class:'campo cresce'},[el('label',{texto:rot}),input]);
  c.appendChild(el('div',{class:'campos'},[
    campo('Fornecedor',sel), campo('NF',nf), campo('R$ por m²',preco)]));
  c.appendChild(dica); c.appendChild(total);

  const bt=el('button',{class:'bt primario',texto:'Salvar',onclick:async()=>{
    bt.disabled=true;
    try{
      await api('/api/rolos/'+r.id+'/dados',{metodo:'PUT',corpo:{
        nf:nf.value, fornecedor_id:sel.value||null, preco_m2:preco.value}});
      banner('Nota do rolo '+r.codigo+' lancada.');
      estado.nota=null; await telaEstoque($('#conteudo'));
    }catch(e){ bt.disabled=false; }
  }});
  c.appendChild(el('div',{class:'campos'},[bt,
    el('button',{class:'bt',texto:'Cancelar',
      onclick:()=>{ estado.nota=null; telaEstoque($('#conteudo')); }})]));
  pai.appendChild(c);
}

/* ── O DINHEIRO PARADO NA PRATELEIRA ──────────────────────────────────────
   ⚠️ O TOTAL SAI COMO PISO (>=) ENQUANTO HOUVER ROLO SEM PRECO. Somar zero
   pelos que faltam faria o estoque parecer mais barato do que e, e ninguem
   saberia por que — regra 4 do COMPRAS.md, a mesma da aba Estoque do PCP. */
async function cartaoValor(pai){
  if(!podeCusto()) return;
  const p=await api('/api/rolos/valor');
  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:'Dinheiro parado em rolo'}));

  const piso=p.resumo.piso;
  c.appendChild(el('p',{style:'font-size:30px;font-weight:700;margin:6px 0',
    texto:(piso?'≥ ':'')+dinheiro(p.resumo.valor)}));
  c.appendChild(el('p',{class:'ajuda'+(piso?'':''),
    style:piso?'color:var(--alerta)':'',
    texto:piso
      ? p.resumo.rolos_sem_preco+' de '+p.resumo.rolos+' rolos ainda nao tem preco lancado, entao este e o MINIMO. '+
        'Eles nao entram como zero: zero e um custo valido e mentiroso.'
      : 'Os '+p.resumo.rolos+' rolos em estoque tem preco lancado — o total e exato.'}));
  c.appendChild(el('p',{class:'ajuda',texto:
    formatarArea(p.resumo.m2)+' de tecido na prateleira. O valor e a soma do que foi PAGO em cada rolo, '+
    'congelado na compra — reajuste de fornecedor nao muda o que ja esta aqui.'}));

  const tabela=(titulo,linhas,coluna)=>{
    if(!linhas.length) return;
    const t=el('table',{style:'margin-top:14px'});
    t.appendChild(el('tr',{},[el('th',{texto:titulo}),el('th',{class:'num',texto:'Rolos'}),
      el('th',{class:'num',texto:'m²'}),el('th',{class:'num',texto:'Valor'})]));
    linhas.forEach(l=>t.appendChild(el('tr',{},[
      el('td',{texto:coluna(l)}),
      el('td',{class:'num',texto:String(l.rolos)}),
      el('td',{class:'num',texto:formatarArea(l.m2)}),
      el('td',{class:'num',texto:(l.rolos_sem_preco?'≥ ':'')+dinheiro(l.valor)})
    ])));
    c.appendChild(t);
  };
  tabela('Tecido',p.tecidos,l=>[l.linha_nome,l.abertura_nome,l.cor_nome].join(' · '));
  tabela('Bobina',p.larguras,l=>num(l.chave)+' m');
  tabela('Cor',p.cores,l=>l.chave);

  /* QUANTO CADA FORNECEDOR COBROU — das COMPRAS, nao de uma tabela. E o que
     foi pago de verdade, e por isso e o unico jeito honesto de comparar. */
  if(p.fornecedores.length){
    const t=el('table',{style:'margin-top:14px'});
    t.appendChild(el('tr',{},[el('th',{texto:'Fornecedor'}),el('th',{texto:'Tecido'}),
      el('th',{class:'num',texto:'Compras'}),el('th',{class:'num',texto:'m² comprado'}),
      el('th',{class:'num',texto:'R$/m² medio'}),el('th',{texto:'Ultima'})]));
    p.fornecedores.forEach(f=>t.appendChild(el('tr',{},[
      el('td',{texto:f.fornecedor_nome}),
      el('td',{texto:[f.linha_nome,f.abertura_nome,f.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:String(f.compras)}),
      el('td',{class:'num',texto:formatarArea(f.m2_comprado)}),
      el('td',{class:'num',texto:dinheiro(f.preco_medio),
        title:f.menor===f.maior?'':'de '+dinheiro(f.menor)+' a '+dinheiro(f.maior)}),
      el('td',{texto:String(f.ultima_compra||'').slice(0,10)})
    ])));
    c.appendChild(el('h2',{style:'margin-top:20px;font-size:16px',texto:'Quanto cada fornecedor cobrou'}));
    c.appendChild(t);
    c.appendChild(el('p',{class:'ajuda',texto:
      'Media ponderada pelo m² comprado, e nao pela quantidade de compras — uma barra de 5 m e uma de 200 m nao pesam igual. Passe o mouse no preco para ver a faixa.'}));
  }
  pai.appendChild(c);

  /* OS ROLOS SEM NOTA. Sem esta lista, "a nota chega depois" vira "a nota
     nunca chega" — mesma licao da lista Conferir (armadilha #14). */
  if(podeNota()&&p.sem_nota.length){
    const cs=el('div',{class:'cartao',style:'border-color:var(--alerta)'});
    cs.appendChild(el('h2',{texto:'Sem nota — '+p.sem_nota.length+' rolo(s)'}));
    cs.appendChild(el('p',{class:'nota',texto:
      'Cada um destes fica FORA da soma do dinheiro parado. Nao entram como zero: sao contados a parte, e por isso o total la em cima sai com ">=" na frente.'}));
    const t=el('table',{});
    t.appendChild(el('tr',{},[el('th',{texto:'Rolo'}),el('th',{texto:'Tecido'}),
      el('th',{texto:'Falta'}),el('th',{class:'num',texto:'Ha'}),el('th',{texto:''})]));
    p.sem_nota.forEach(r=>{
      const falta=[!r.fornecedor_nome&&'fornecedor',!r.nf&&'NF',r.preco_m2==null&&'preco']
        .filter(Boolean).join(', ');
      t.appendChild(el('tr',{},[
        el('td',{texto:r.codigo}),
        el('td',{texto:[r.linha_nome,r.abertura_nome,r.cor_nome].join(' · ')}),
        el('td',{texto:falta}),
        el('td',{class:'num'+(r.dias>=30?' aviso':''),texto:r.dias+' d'}),
        el('td',{style:'text-align:right'},[el('button',{class:'bt pequeno',texto:'Lancar',
          onclick:()=>abrirNota(r)})])
      ]));
    });
    cs.appendChild(t);
    pai.appendChild(cs);
  }
}

// ── EM ESTOQUE ───────────────────────────────────────────────────────────
async function telaEstoque(pai){
  const rolos=await api('/api/rolos');
  const saldo=await api('/api/rolos/saldo');
  pai=limpar(pai);
  if(estado.nota) await cartaoNota(pai,rolos.find(r=>r.id===estado.nota.id)||estado.nota);
  await cartaoValor(pai);

  const cS=el('div',{class:'cartao'});
  cS.appendChild(el('h2',{texto:'Saldo por tecido'}));
  cS.appendChild(el('p',{class:'nota',texto:
    'Nao existe saldo guardado por tecido: e sempre a soma dos rolos. Um total numa coluna e um total que diverge sozinho.'}));
  const tS=el('table',{});
  tS.appendChild(el('tr',{},[el('th',{texto:'Tecido'}),el('th',{class:'num',texto:'Saldo'}),
    el('th',{class:'num',texto:'m²'}),el('th',{texto:'Rolos'})]));
  saldo.filter(s=>s.saldo>0||s.abertos||s.fechados).forEach(s=>tS.appendChild(el('tr',{},[
    el('td',{texto:[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ')}),
    el('td',{class:'num',texto:formatarMetros(s.saldo)}),
    el('td',{class:'num',texto:formatarArea(s.m2)}),
    el('td',{texto:(s.abertos||0)+' aberto(s) + '+(s.fechados||0)+' fechado(s)'})
  ])));
  cS.appendChild(saldo.some(s=>s.saldo>0)?tS:el('div',{class:'vazio',texto:'Nenhum rolo em estoque.'}));
  pai.appendChild(cS);

  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:'Rolos'}));
  const t=el('table',{});
  t.appendChild(el('tr',{},[el('th',{texto:'Codigo'}),el('th',{texto:'Tecido'}),
    el('th',{class:'num',texto:'Bobina'}),el('th',{class:'num',texto:'Saldo'}),
    el('th',{class:'num',texto:'m²'}),
    ...(podeCusto()?[el('th',{class:'num',texto:'Valor'})]:[]),
    el('th',{class:'num',texto:'Parado'}),
    el('th',{texto:'Estado'}),el('th',{texto:'Endereco'}),el('th',{texto:''})]));
  rolos.forEach(r=>{
    const acoes=[];
    if(r.status!=='encerrado'&&podeEntrar()){
      // R9: o acerto no fim. Sem ele o saldo infla mes a mes com metros que
      // nunca existiram — a metragem vem da nota e nao e conferida na entrada.
      acoes.push(el('button',{class:'bt pequeno',texto:'Rolo acabou',onclick:async()=>{
        if(!confirm('Encerrar o rolo '+r.codigo+'? O sistema ainda marca '+formatarMetros(r.saldo)+
          '. A diferenca fica gravada como acerto.')) return;
        await api('/api/rolos/'+r.id+'/encerrar',{metodo:'POST'});
        banner('Rolo '+r.codigo+' encerrado. A diferenca virou acerto.');
        await telaEstoque($('#conteudo'));
      }}));
    }
    if(r.status!=='encerrado'&&eu.papel==='diretor'){
      acoes.push(el('button',{class:'bt pequeno',texto:'Ajustar',onclick:async()=>{
        const s=prompt('Saldo real do rolo '+r.codigo+', em metros:',String(r.saldo).replace('.',','));
        if(s===null) return;
        const obs=prompt('Por que o saldo esta sendo corrigido?');
        if(!obs) return;
        await api('/api/rolos/'+r.id+'/ajustar',{metodo:'POST',corpo:{saldo:comoNumero(s),observacao:obs}});
        banner('Saldo ajustado.'); await telaEstoque($('#conteudo'));
      }}));
    }
    /* MOVER DE LUGAR. O tubo volta da bancada em outro buraco, e sem isto o
       endereco do sistema passa a apontar para um lugar vazio — o proximo
       que procurar aquele rolo nao acha, e conclui que o sistema erra.

       Quem moveu sai da SESSAO, nunca de um campo digitado: campo de nome em
       tela de fabrica e preenchido com o nome de quem esta por perto. */
    if(r.status!=='encerrado') acoes.push(el('button',{class:'bt pequeno',texto:'Mover',
      onclick:async()=>{
        const arvore=await api('/api/enderecos/ROLO');
        const niveis=[];
        arvore.filter(h=>h.ativo).forEach(h=>h.andares.forEach(a=>a.niveis.forEach(n=>
          niveis.push({id:n.id,texto:h.nome+'-'+a.nome+'-'+n.nome}))));
        if(!niveis.length) return banner('Nenhum endereco de ROLO cadastrado.','erro');
        const escolha=prompt('Para onde foi o rolo '+r.codigo+'?\n\n'+
          niveis.map((n,i)=>(i+1)+') '+n.texto).join('\n')+
          '\n\nDigite o numero da opcao:');
        if(!escolha) return;
        const n=niveis[Number(escolha)-1];
        if(!n) return banner('Opcao invalida.','erro');
        try{
          await api('/api/rolos/'+r.id+'/mover',{metodo:'POST',corpo:{nivel_id:n.id}});
          banner(r.codigo+' agora esta em '+n.texto+'.');
          await telaEstoque($('#conteudo'));
        }catch(e){}
      }}));

    /* LANCAR A NOTA DEPOIS. A nota chega dias depois do rolo — e o caso
       normal, nao a excecao. O botao fica marcado em ambar enquanto falta
       alguma coisa: nota que "vai ser lancada depois" sem nada acusando e
       nota que nao e lancada. */
    if(podeNota()&&r.status!=='encerrado'){
      const falta=!r.nf||!r.fornecedor_nome||(podeCusto()&&r.preco_m2==null);
      acoes.push(el('button',{class:'bt pequeno'+(falta?' alerta':''),
        texto:falta?'Nota ⚠':'Nota', onclick:()=>abrirNota(r)}));
    }

    // A etiqueta do tubo. Abre o PDF de 100 x 150 mm, uma pagina.
    acoes.push(el('button',{class:'bt pequeno',texto:'Etiqueta',
      onclick:()=>window.open('/sobmedida/api/rolos/'+r.id+'/etiqueta','_blank')}));

    acoes.push(el('button',{class:'bt pequeno',texto:'Historico',onclick:async()=>{
      const ms=await api('/api/rolos/'+r.id+'/movimentos');
      alert(r.codigo+'\n\n'+ms.map(m=>
        m.criado_em+'  '+(m.delta>0?'+':'')+num(m.delta)+' m  '+m.motivo+
        (m.observacao?'  ('+m.observacao+')':'')).join('\n'));
    }}));
    t.appendChild(el('tr',{class:r.status==='encerrado'?'inativo':''},[
      el('td',{texto:r.codigo}),
      el('td',{texto:[r.linha_nome,r.abertura_nome,r.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:num(r.largura)+' m'}),
      el('td',{class:'num',texto:formatarMetros(r.saldo)}),
      el('td',{class:'num',texto:formatarArea(r.m2)}),
      /* ⚠️ SEM PRECO E TRACO, NUNCA R$ 0,00 — "zero" se le como "nao vale
         nada", que e outra afirmacao. E rolo encerrado tambem: ali o valor
         parado e zero de verdade, mas ele nao esta na prateleira. */
      ...(podeCusto()?[el('td',{class:'num',
        texto:r.valor==null?'—':dinheiro(r.valor),
        title:r.preco_m2==null?'sem nota lancada':('R$ '+num(r.preco_m2)+'/m²')})]:[]),
      /* PARADO NAO E IDADE. Rolo cortado toda semana nao esta parado, mesmo
         tendo entrado ha oito meses. O que conta e o ultimo consumo. */
      el('td',{class:'num'+(r.dias_parado>=60?' aviso':''),
        texto:r.status==='encerrado'?'—':r.dias_parado+' d',
        title:r.ultimo_consumo?('ultimo corte em '+r.ultimo_consumo.slice(0,10))
                              :'nunca foi cortado — conta desde a entrada'}),
      el('td',{},[el('span',{class:'tag '+(r.status==='aberto'?'bom':r.status==='fechado'?'rolo':'off'),texto:r.status})]),
      el('td',{texto:r.endereco||''}),
      el('td',{style:'text-align:right'},acoes)
    ]));
  });
  c.appendChild(rolos.length?t:el('div',{class:'vazio',texto:'Nenhum rolo cadastrado.'}));
  pai.appendChild(c);
}

// ── ENTRADA ──────────────────────────────────────────────────────────────
async function telaEntrada(pai){
  if(!podeEntrar()){ limpar(pai).appendChild(el('div',{class:'vazio',texto:'Sem permissao para dar entrada.'})); return; }
  estado.tecidos=await api('/api/tecidos');
  estado.arvore=await api('/api/enderecos/ROLO');
  if(!estado.larguras) estado.larguras=await api('/api/larguras');
  if(podeNota()&&!estado.fornecedores) estado.fornecedores=await api('/api/fornecedores');
  pai=limpar(pai);

  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:'Entrada de rolo'}));
  c.appendChild(el('p',{class:'ajuda',texto:
    'A largura da bobina e DESTE rolo, nao do tecido. O mesmo Rolo 3% Bege existe em 2,00, 2,50 e 3,00 — e e justamente essa diferenca que o plano de corte explora.'}));
  pai.appendChild(c);

  const ativos=estado.tecidos.filter(t=>t.ativo);
  const linhas=[], aberturas=[], cores=[];
  ativos.forEach(t=>{ if(!linhas.some(x=>x.valor===t.linha_id)) linhas.push({valor:t.linha_id,nome:t.linha_nome}); });
  const sel=ativos.find(t=>t.id===estado.tecido_id);
  const linhaSel=sel?sel.linha_id:(linhas[0]&&linhas[0].valor);
  ativos.filter(t=>t.linha_id===linhaSel).forEach(t=>{
    if(!aberturas.some(x=>x.valor===t.abertura_id)) aberturas.push({valor:t.abertura_id,nome:t.abertura_nome}); });
  const abSel=sel&&sel.linha_id===linhaSel?sel.abertura_id:(aberturas[0]&&aberturas[0].valor);
  ativos.filter(t=>t.linha_id===linhaSel&&t.abertura_id===abSel).forEach(t=>cores.push({valor:t.cor_id,nome:t.cor_nome}));

  const escolher=(l,a,co)=>{
    const t=ativos.find(x=>x.linha_id===l&&x.abertura_id===a&&x.cor_id===co)
      ||ativos.find(x=>x.linha_id===l&&x.abertura_id===a)||ativos.find(x=>x.linha_id===l);
    if(t) estado.tecido_id=t.id;
    telaEntrada($('#conteudo'));
  };
  c.appendChild(fileira('LINHA',linhas,linhaSel,v=>escolher(v,null,null)));
  c.appendChild(fileira('COLECAO',aberturas,abSel,v=>escolher(linhaSel,v,null)));
  c.appendChild(fileira('COR',cores,sel?sel.cor_id:null,v=>escolher(linhaSel,abSel,v)));

  /* A LARGURA VEM DA LISTA, e nao do teclado.
     Digitar largura errava de dois jeitos que ninguem percebia: '2,5' e
     '2,50' viravam bobinas diferentes na consulta do plano, e um '20,0' com
     a virgula no lugar errado entrava como bobina de vinte metros — e o
     encaixe passava a "achar" que cabia qualquer peca.

     O campo livre continua embaixo, de proposito: rolo que chega fora do
     padrao existe, e recusar a entrada dele seria a armadilha #6 — a trava
     que a bancada aprende a contornar lancando a largura errada so para o
     sistema aceitar. Ele avisa, nao bloqueia.

     E DESDE 03/09 ELE CADASTRA. Antes o campo era um beco: a largura entrava
     no rolo e nao entrava na lista, entao o proximo tubo da MESMA bobina caia
     nele de novo, e um '20,0' digitado no lugar de '2,00' ficava escondido
     dentro de um registro — lugar onde ninguem procura. Agora ele vira botao
     na proxima entrada, e o erro de digitacao aparece numa lista onde da para
     apagar. */
  const larguras=(estado.larguras||[]).filter(l=>l.ativo);
  const sugerida=sel&&sel.largura_sugerida?dLargura.arred(sel.largura_sugerida):null;
  if(estado.largura==null&&sugerida&&larguras.some(l=>l.valor===sugerida)) estado.largura=sugerida;

  if(larguras.length){
    c.appendChild(fileira('BOBINA',
      larguras.map(l=>({valor:l.valor,nome:formatarMetros(l.valor)})),
      estado.largura,
      v=>{ estado.largura=v; estado.larguraOutra=''; telaEntrada($('#conteudo')); }));
  } else {
    c.appendChild(el('p',{class:'ajuda',style:'color:var(--alerta)',texto:
      'Nenhuma largura de bobina cadastrada ainda. Digite abaixo e peca para cadastrar em Cadastros -> Tecido.'}));
  }

  const campos={};
  const linha=el('div',{class:'campos'});
  /* O ROTULO DA METRAGEM MUDOU, e nao e cosmetica.
     Ele dizia "Metragem da nota", e para o INVENTARIO INICIAL isso e uma
     armadilha: a fabrica tem bobinas ja abertas, e quem le "da nota" digita
     os 50 m que a nota dizia quando o rolo tem 18 m no tubo.

     O sistema grava esse numero como SALDO. Trinta e dois metros que nao
     existem entrariam no estoque, e o plano de corte prometeria uma faixa
     que o rolo nao tem — o erro apareceria com o tecido na mesa e a peca ja
     comecada. Por isso o campo pergunta o que esta NO ROLO AGORA. */
  [['largura','Bobina que nao esta nos botoes (m) — ela entra na lista',''],
   ['metragem','Metragem AGORA no rolo (m)',''],
   /* NF E R$/m² SO PARA QUEM LANCA NOTA. Para o operador os dois campos nem
      existem: NF e preco sao papel de escritorio, e o JSON dele ja volta sem
      eles — um campo que ele preenche e nunca mais ve de volta e pior que
      campo nenhum. O rolo entra sem os dois e cai na lista "Sem nota". */
   ...(podeNota() ?[['nf','NF (se ja veio)','']]:[]),
   ...(podeCusto()?[['preco_m2','R$ por m² (se ja souber)','']]:[])
  ].forEach(([id,rot,valor])=>{
    const b=el('div',{class:'campo cresce'});
    b.appendChild(el('label',{texto:rot}));
    const i=el('input',{type:'text',value:valor,inputmode:id==='nf'?'text':'decimal'});
    if(id==='largura'){
      i.value=estado.larguraOutra||'';
      i.addEventListener('input',()=>{ estado.larguraOutra=i.value; estado.largura=null;
        aviso.textContent=i.value.trim()&&!larguras.some(l=>l.valor===dLargura.arred(i.value))
          ? 'Esta bobina ainda nao esta na lista. Ela entra junto com o rolo e vira botao na proxima entrada — a chefia confere depois. Confira a virgula: o campo e em METROS (2,50 e nao 250).'
          : ''; });
    }
    b.appendChild(i); campos[id]=i; linha.appendChild(b);
  });
  c.appendChild(linha);
  const aviso=el('p',{class:'ajuda',style:'color:var(--alerta);min-height:1.2em'});
  c.appendChild(aviso);
  c.appendChild(el('p',{class:'ajuda',texto:
    'Metragem: rolo novo e o que diz a nota; rolo JA ABERTO e o que sobrou, medido. E este numero que vira o saldo — se ele vier maior que o real, o plano de corte promete uma faixa que o rolo nao tem.'}));
  c.appendChild(el('p',{class:'ajuda',texto:
    'NF, fornecedor e preco sao opcionais: a nota chega dias depois do rolo, e no inventario inicial quase nunca existe nota. Faltar nota nao pode impedir a bobina de entrar no sistema — o rolo entra e fica na lista "sem nota" ate alguem lancar, no botao Nota da lista de rolos.'}));

  /* DE QUEM VEIO. Fileira de botoes, como todo o resto da tela: texto livre
     era o que fazia 'Ecotex', 'ecotex' e 'Ecotex Ltda' somarem separado, e o
     defeito so aparecia meses depois, na hora de comparar fornecedor.
     O "+ fornecedor" existe pelo mesmo motivo do "+ haste": o rolo desce do
     caminhao de quem ninguem cadastrou, e a alternativa nao e esperar — e
     lancar o rolo sem fornecedor, que e o dado que se perde para sempre. */
  /* ⚠️ A FILEIRA DE FORNECEDOR SO EXISTE PARA QUEM LANCA NOTA. De quem a
     fabrica compra e dado de escritorio: nao ajuda o operador a por o tubo na
     estante, e sai da fabrica junto com quem sai. O rolo entra sem fornecedor
     e cai na lista "Sem nota", que ja e o trabalho de quem fecha compras. */
  const forns=podeNota()?(estado.fornecedores||[]).filter(f=>f.ativo):[];
  if(podeNota()) c.appendChild(fileira('FORNECEDOR',
    forns.map(f=>({valor:f.id,nome:f.nome})), estado.fornecedor_id,
    v=>{ estado.fornecedor_id=(String(estado.fornecedor_id)===String(v)?null:v); telaEntrada($('#conteudo')); },
    {rotulo:'fornecedor', pergunta:'Nome do fornecedor novo:',
     rota:'/api/fornecedores', corpo:{},
     aoCriar:async f=>{ estado.fornecedores=await api('/api/fornecedores');
                        estado.fornecedor_id=f.id; await telaEntrada($('#conteudo')); }}));
  else c.appendChild(el('p',{class:'ajuda',texto:
    'Fornecedor, NF e preco entram depois, no escritorio — o rolo fica na lista "Sem nota" ate la. Aqui basta o tecido, a bobina, a metragem e o endereco.'}));

  // endereco na estante de ROLO
  const hastes=estado.arvore.filter(h=>h.ativo).map(h=>({valor:h.id,nome:h.nome}));
  const hAtual=estado.arvore.find(h=>h.id===estado.haste_id)||estado.arvore[0];
  const andares=hAtual?hAtual.andares.map(a=>({valor:a.id,nome:a.nome})):[];
  const aAtual=hAtual&&(hAtual.andares.find(a=>a.id===estado.andar_id)||hAtual.andares[0]);
  const niveis=aAtual?aAtual.niveis.map(n=>({valor:n.id,nome:n.nome})):[];

  // O que for criado aqui ja fica ESCOLHIDO. Criar e ter de procurar o proprio
  // botao na fileira e o tipo de passo a mais que faz a bancada parar de usar.
  const recarregar=async(campo,criado)=>{
    estado.arvore=await api('/api/enderecos/ROLO');
    if(campo==='haste'){ estado.haste_id=criado.id; estado.andar_id=null; estado.nivel_id=null; }
    if(campo==='andar'){ estado.andar_id=criado.id; estado.nivel_id=null; }
    if(campo==='nivel'){ estado.nivel_id=criado.id; }
    await telaEntrada($('#conteudo'));
  };

  c.appendChild(fileira('HASTE',hastes,hAtual&&hAtual.id,
    v=>{ estado.haste_id=v; estado.andar_id=null; estado.nivel_id=null; telaEntrada($('#conteudo')); },
    {rotulo:'haste', pergunta:'Nome da haste nova (ex.: A):',
     rota:'/api/hastes', corpo:{armazem_chave:'ROLO'},
     aoCriar:c=>recarregar('haste',c)}));

  c.appendChild(fileira('ANDAR',andares,aAtual&&aAtual.id,
    v=>{ estado.andar_id=v; estado.nivel_id=null; telaEntrada($('#conteudo')); },
    hAtual&&{rotulo:'andar', pergunta:'Nome do andar novo na haste '+hAtual.nome+' (ex.: 2):',
     rota:'/api/andares', corpo:{haste_id:hAtual.id},
     aoCriar:c=>recarregar('andar',c)}));

  c.appendChild(fileira('NIVEL',niveis,estado.nivel_id,
    v=>{ estado.nivel_id=v; telaEntrada($('#conteudo')); },
    aAtual&&{rotulo:'nivel', pergunta:'Nome da posicao nova no andar '+aAtual.nome+' (ex.: 3):',
     rota:'/api/niveis', corpo:{andar_id:aAtual.id},
     aoCriar:c=>recarregar('nivel',c)}));

  const bt=el('button',{class:'bt primario',style:'min-height:60px;font-size:18px',texto:'Dar entrada',onclick:async()=>{
    bt.disabled=true;
    try{
      const r=await api('/api/rolos',{metodo:'POST',corpo:{
        // O botao escolhido ganha do campo livre — se a pessoa tocou num
        // botao, foi essa a bobina que ela quis dizer.
        tecido_id:estado.tecido_id,
        largura:estado.largura!=null?estado.largura:campos.largura.value,
        metragem:campos.metragem.value,
        nf:campos.nf?campos.nf.value:null, nivel_id:estado.nivel_id,
        fornecedor_id:estado.fornecedor_id,
        preco_m2:campos.preco_m2?campos.preco_m2.value:null}});
      banner('Rolo '+r.codigo+' cadastrado com '+formatarMetros(r.saldo)+'.'+
        // Cadastrar em silencio faria a lista de bobinas crescer sozinha, e
        // lista que cresce sem ninguem ver e lista que ninguem le.
        (r.largura_cadastrada?' A bobina de '+formatarMetros(r.largura)+
          ' entrou na lista — na proxima entrada ela ja e botao.':''));
      aba='estoque'; desenhar();
    }catch(e){}
    bt.disabled=false;
  }});
  c.appendChild(el('div',{class:'campos'},[bt]));
}

(async function(){ eu=await api('/api/eu'); desenhar(); })();
</script>
</body>
</html>
