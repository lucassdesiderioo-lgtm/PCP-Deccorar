<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancada · Sob medida</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
/* ⚠️ O CAMPO DE BIPE E GRANDE E FICA VISIVEL, e isso nao e estetica: no iPad
   o iOS tira o foco de campo fora da tela e o leitor bipa sem nada acontecer
   (§12 do CLAUDE.md). Ele tambem e o primeiro elemento do corpo — quem chega
   na bancada ja bipa. */
#bipe{width:100%; font-size:26px; padding:16px; text-align:center; letter-spacing:.06em}
.fila{list-style:none; padding:0; margin:10px 0 0}
.fila li{padding:12px 10px; border-bottom:1px solid var(--linha); display:flex;
  gap:12px; align-items:baseline; flex-wrap:wrap}
.fila .tarefa{font-size:19px; font-weight:700; flex:1 1 320px}
.fila .de{font-size:14px; color:var(--tinta-fraca)}
.fila li.andando{background:var(--linha)}
.fila .marca{font-size:12px; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; padding:3px 9px; border-radius:99px;
  background:#1565c0; color:#fff}
.vazia{color:var(--tinta-fraca); padding:14px 0; font-size:16px}
.grande{font-size:30px; font-weight:800; margin:6px 0}
.segura{background:var(--linha); border-left:4px solid var(--alerta);
  border-radius:var(--raio); padding:10px 12px; margin-top:10px; font-size:16px}
.segura b{color:var(--tinta)}
/* A recusa desfaz trabalho, entao ela nao e um botao discreto nem um botao
   que se toca sem querer: ele mora ABAIXO da resposta do bipe, e so aparece
   quando ha peca na mao. */
#recusar{margin-top:12px}
.motivos{display:grid; gap:8px; margin-top:10px}
.motivos button{font-size:17px; padding:14px 12px; text-align:left}
.motivos .destino{color:var(--tinta-fraca); font-size:14px}
.fila .refeita{background:#b3261e}
.caixa{border:1px solid var(--linha); border-radius:var(--raio);
  padding:12px; margin-top:12px}
.caixa h3{margin:0 0 4px; font-size:17px}
.caixa input{width:100%; font-size:17px; padding:12px; margin:10px 0}
.caixa .bt{margin-right:8px}
</style>
</head>
<body>
<header class="topo">
  <h1>Bancada</h1>
  <span class="espaco"></span>
  <span class="quem" id="quem"></span>
</header>

<div class="corpo">
  <div class="cartao">
    <div class="fileira" id="setores"></div>
    <input id="bipe" autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" placeholder="bipe a etiqueta">
    <div id="resposta"></div>
    <div id="recusar"></div>
  </div>
  <div class="cartao"><h2 id="tituloFila">Fila</h2><div id="fila"></div></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,banner,beep,el,limpar,$}=window.ui;

let SETOR=null, EU=null, EMBALANDO=null, NA_MAO=null;

/* ⚠️ A COR/ESTADO DO SETOR ESCOLHIDO SAI DO `base.css`, e nao de uma fileira
   propria. Foi o defeito da fase 4-A: cinco botoes identicos, sem o azul do
   escolhido, e so um texto ao lado dizendo qual era — e o maco saia do setor
   errado. E o mesmo mecanismo da cor dos tres modos da Revisao do PCP (§3):
   nao e decoracao, e o que impede meia hora de trabalho no lugar errado. */
function desenharSetores(){
  const fs=$('#setores'); limpar(fs);
  (EU.setores||[]).forEach(s=>{
    const b=el('button',{class:'op',type:'button','aria-pressed':String(s.chave===SETOR)},[s.nome]);
    b.onclick=()=>{ SETOR=s.chave; EMBALANDO=null; NA_MAO=null;
      localStorage.setItem('sm_bancada',s.chave);
      limpar($('#resposta')); desenharSetores(); desenharRecusa(); verFila(); };
    fs.appendChild(b);
  });
}

async function verFila(){
  const alvo=$('#fila'); limpar(alvo);
  $('#tituloFila').textContent='Fila'+(SETOR?' · '+nomeDo(SETOR):'');
  if(!SETOR){ alvo.appendChild(el('div',{class:'vazia'},['Escolha a bancada acima.'])); return; }
  let linhas=[];
  try{ linhas=await api('/api/producao/fila/'+encodeURIComponent(SETOR)); }catch(e){ return; }
  if(!linhas.length){
    /* ⚠️ "NADA AQUI" NAO E "ESTA QUEBRADO". Tela vazia se parece com tela
       quebrada — a licao da 4-C, onde a primeira leitura deu vazio e estava
       certa. Por isso a frase diz o que o vazio significa. */
    alvo.appendChild(el('div',{class:'vazia'},
      ['Nada liberado para esta bancada agora — ou tudo já foi feito, ou as peças estão esperando o setor anterior.']));
    return;
  }
  const ul=el('ul',{class:'fila'});
  linhas.forEach(l=>{
    const marcas=[];
    /* ⚠️ REFAZER VEM PRIMEIRO E EM VERMELHO. Sem a marca, a peca recusada
       fica identica a qualquer outra da lista — e quem corta corta de novo
       sem saber que ja existe uma etiqueta igual a esta na bancada. */
    if(l.refeitas) marcas.push(el('span',{class:'marca refeita'},
      [l.refeitas>1?('refazer · '+(l.refeitas+1)+'ª vez'):'refazer']));
    if(l.em_andamento) marcas.push(el('span',{class:'marca'},['em andamento']));
    ul.appendChild(el('li',{class:l.em_andamento?'andando':''},[
      el('span',{class:'tarefa'},[l.o_que_fazer]),
      el('span',{class:'de'},['pedido '+l.pedido_numero+' · peça '+l.item_n+' · '+(l.revenda||'')]),
      ...marcas
    ]));
  });
  alvo.appendChild(ul);
}

const nomeDo=chave=>((EU.setores||[]).find(s=>s.chave===chave)||{}).nome||chave;

/* ── O BIPE ──────────────────────────────────────────────────────────────
   Um campo so. Se ha uma embalagem esperando o kit, o proximo bipe e lido
   como kit; senao e a peca. E o mesmo desenho da Embalagem do PCP (§4), onde
   os tres bipes entram pelo mesmo campo — quem esta de luva nao troca de
   campo entre um codigo e outro. */
async function bipou(codigo){
  const limpoCod=String(codigo||'').replace(/[^A-Za-z0-9-]/g,'');
  if(!limpoCod) return;
  const r=$('#resposta'); limpar(r);
  try{
    if(EMBALANDO){
      await api('/api/producao/kit',{metodo:'POST',corpo:{codigo:EMBALANDO,kit:limpoCod}});
      beep(); r.appendChild(el('div',{class:'grande'},['KIT CONFERIDO ✓']));
      r.appendChild(el('div',{class:'de'},['Agora bipe a etiqueta da peça de novo para fechar.']));
      EMBALANDO=null; return;
    }
    const d=await api('/api/producao/bipe',{metodo:'POST',corpo:{codigo:limpoCod},silencioso:true});
    beep();
    NA_MAO={codigo:limpoCod, o_que_fazer:d.o_que_fazer||''};
    if(d.acao==='iniciado'){
      r.appendChild(el('div',{class:'grande'},['COMEÇOU']));
      r.appendChild(el('div',{class:'de'},[d.o_que_fazer||'']));
      if(SETOR==='embalagem'){ EMBALANDO=limpoCod;
        r.appendChild(el('div',{class:'segura'},['Bipe o KIT desta peça antes de fechar.'])); }
    } else {
      r.appendChild(el('div',{class:'grande'},['TERMINOU ✓']));
      if(d.pronto) r.appendChild(el('div',{class:'grande'},['PEDIDO PRONTO 🎉']));
    }
  }catch(e){
    beep('erro');
    banner(e.message,'erro',7);
    /* ⚠️ "NAO APARECE" NUNCA VIRA "NINGUEM SABE POR QUE". Na recusa por
       aguardando, a tela mostra o que segura NA PROPRIA TELA e nao so num
       banner que some em 7 segundos — quem esta com a peca na mao precisa
       poder ler de novo. */
    if(e.motivo==='aguardando'||e.motivo==='faltou_kit'||e.motivo==='kit_errado')
      r.appendChild(el('div',{class:'segura'},[e.message]));
    if(e.motivo==='faltou_kit') EMBALANDO=limpoCod;
    /* ⚠️ A PECA RECUSADA PELA TRAVA TAMBEM ESTA NA MAO — e e JUSTAMENTE ela
       que costuma virar recusa: a embalagem abre a caixa, ve o defeito e
       para. Se so o bipe que passa desse direito a recusar, quem precisa
       dela nao a teria. */
    if(e.motivo!=='codigo_desconhecido'&&e.motivo!=='setor_errado')
      NA_MAO={codigo:limpoCod, o_que_fazer:''};
  }
  desenharRecusa();
  verFila();
}

/* ── A RECUSA (secao 4.16) ───────────────────────────────────────────────
   Quem recusa escolhe SO O MOTIVO — o motivo ja diz qual peca volta. Duas
   escolhas na bancada e uma a mais para quem esta de luva, e a segunda
   errada e trabalho perdido.

   ⚠️ O BOTAO SO APARECE COM PECA NA MAO. Antes do bipe nao ha o que recusar,
   e um botao que so serve para dar erro ensina a nao clicar. */
function desenharRecusa(){
  const alvo=limpar($('#recusar'));
  if(!NA_MAO) return;
  const b=el('button',{class:'bt alerta',type:'button'},['Recusar peça']);
  b.onclick=abrirMotivos;
  alvo.appendChild(b);
}

/* ⚠️ A LISTA E DESTA PECA, e nao o cadastro inteiro — nao ha cache. Cada
   persiana tem as suas: a lisa nao tem bandô, e o que ainda nao foi feito
   nao tem o que refazer. Guardar a primeira resposta faria a segunda peca
   ver a lista da primeira. */
async function abrirMotivos(){
  const alvo=limpar($('#recusar'));
  let r;
  try{ r=await api('/api/producao/motivos/'+encodeURIComponent(NA_MAO.codigo)); }
  catch(e){ desenharRecusa(); return; }
  const caixa=el('div',{class:'caixa'});
  caixa.appendChild(el('h3',{},['O que está errado?']));
  caixa.appendChild(el('div',{class:'de'},
    ['A peça volta para o setor que a fez. O que veio depois dela é refeito.']));
  /* ⚠️ LISTA VAZIA DIZ POR QUE, e a frase vem do servidor: as razoes sao
     tres (esta e a primeira bancada · nao ha motivo cadastrado · nada do que
     vem antes esta pronto) e cada uma manda para um lugar diferente. */
  if(r.sem_motivo) caixa.appendChild(el('div',{class:'segura'},[r.sem_motivo]));
  const g=el('div',{class:'motivos'});
  (r.motivos||[]).forEach(m=>{
    const bt=el('button',{class:'bt',type:'button'},[
      el('div',{},[m.nome]),
      el('div',{class:'destino'},['volta para '+(m.setor_nome||m.setor)+' · '+m.componente_nome])
    ]);
    bt.onclick=()=>confirmar(m);
    g.appendChild(bt);
  });
  caixa.appendChild(g);
  const volta=el('button',{class:'bt',type:'button'},['Deixa pra lá']);
  volta.onclick=()=>{ desenharRecusa(); campo.focus(); };
  caixa.appendChild(volta);
  alvo.appendChild(caixa);
}

function confirmar(m){
  const alvo=limpar($('#recusar'));
  const caixa=el('div',{class:'caixa'});
  caixa.appendChild(el('h3',{},[m.nome]));
  caixa.appendChild(el('div',{class:'de'},
    [(m.componente_nome||'')+' volta para '+(m.setor_nome||m.setor)+
     '. O que foi feito em cima dela é refeito.']));
  const obs=el('input',{type:'text',placeholder:'o que houve (opcional)',
    autocomplete:'off',autocorrect:'off',spellcheck:'false'});
  caixa.appendChild(obs);
  /* O confirmar e VERMELHO porque desfaz trabalho: a peca volta para tras e
     o que foi feito em cima dela e refeito. Botao de desfazer com cara de
     botao de seguir e o que faz alguem tocar sem ler. */
  const ok=el('button',{class:'bt perigo',type:'button'},['Confirmar a recusa']);
  ok.onclick=()=>enviar(m,obs.value);
  const nao=el('button',{class:'bt',type:'button'},['Voltar']);
  nao.onclick=abrirMotivos;
  caixa.appendChild(ok); caixa.appendChild(nao);
  alvo.appendChild(caixa);
}

async function enviar(m,observacao){
  const r=limpar($('#resposta'));
  try{
    const d=await api('/api/producao/recusa',{metodo:'POST',silencioso:true,
      corpo:{codigo:NA_MAO.codigo, motivo_id:m.id, observacao:observacao||''}});
    beep();
    r.appendChild(el('div',{class:'grande'},['RECUSADA']));
    r.appendChild(el('div',{class:'segura'},[
      d.culpado.nome+' voltou para '+d.culpado.setor_nome+
      ' com a etiqueta '+d.culpado.codigo+'. '+
      'Mande a peça para lá — e a etiqueta sai de novo, com o mesmo código, marcada.'
    ]));
    NA_MAO=null; EMBALANDO=null;
  }catch(e){
    beep('erro'); banner(e.message,'erro',9);
    r.appendChild(el('div',{class:'segura'},[e.message]));
  }
  desenharRecusa(); verFila(); campo.focus();
}

/* ⚠️ O LEITOR MANDA Tab OU Enter, e as vezes manda o codigo picado (§12).
   Por isso: aceita os dois, e processa por TIMEOUT depois da ultima tecla —
   sem o timeout o codigo entra pela metade no dia em que o leitor respirar. */
let t=null;
const campo=$('#bipe');
campo.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'||ev.key==='Tab'){ ev.preventDefault(); clearTimeout(t); disparar(); }
});
campo.addEventListener('input',()=>{ clearTimeout(t); t=setTimeout(disparar,120); });
function disparar(){ const v=campo.value; campo.value=''; campo.focus(); if(v.trim()) bipou(v); }

(async function(){
  EU=await api('/api/eu');
  $('#quem').textContent=EU.nome||'';
  /* O setor fica salvo POR APARELHO, como o modo da Revisao do PCP (§3): o
     tablet da serralheria reabre na serralheria. */
  const salvo=localStorage.getItem('sm_bancada');
  const meus=(EU.setores||[]).map(s=>s.chave);
  SETOR = meus.includes(salvo) ? salvo : (meus.length===1?meus[0]:null);
  desenharSetores(); desenharRecusa(); verFila(); campo.focus();
})();
</script>
</body>
</html>
