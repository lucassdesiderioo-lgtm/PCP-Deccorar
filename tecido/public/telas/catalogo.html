<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo · Sob medida</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
table.lista{width:100%; border-collapse:collapse; margin-top:10px; font-size:15px}
table.lista th,table.lista td{padding:8px; border-bottom:1px solid var(--linha); text-align:left; vertical-align:top}
table.lista th{font-size:13px; color:var(--tinta-fraca); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
table.lista td.n{text-align:right; font-variant-numeric:tabular-nums}
table.lista tr.inativa td{opacity:.55}
.medida{font-family:ui-monospace,Menlo,Consolas,monospace}
.falta{color:var(--alerta); font-weight:600}
.editor{background:var(--cartao); border:1px solid var(--linha-forte);
  border-radius:var(--raio); padding:12px; margin-top:10px}
.editor .campos{align-items:flex-end}
.editor .campo{min-width:130px}
.editor input,.editor select{width:100%}
/* O campo de escolha do material cabe um nome de item de estoque inteiro —
   "Base redonda branca" cortado ao meio faz escolher o item errado. */
.editor .campo.largo{min-width:280px}
.erro-linha{color:var(--erro); font-size:14px; font-weight:600; margin:8px 0 0}
.setor{font-size:12px; color:var(--tinta-fraca); text-transform:uppercase; letter-spacing:.05em}
.hist{font-size:14px; color:var(--tinta-fraca); margin-top:8px}
.hist div{padding:3px 0; border-bottom:1px solid var(--linha)}
/* A TARJA DO INATIVO e o primeiro aviso da tela: o produto que a revenda nao
   ve tem que parecer diferente do que ela ve, antes de qualquer outro numero. */
.tarja{background:var(--alerta-fraca); color:var(--alerta); border:1px solid var(--alerta);
  border-radius:var(--raio); padding:8px 12px; font-weight:700; margin-top:10px}
.selo{display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px;
  border:1px solid var(--linha-forte); margin-left:6px}
.selo.ativo{color:var(--bom); border-color:var(--bom)}
.selo.inativo{color:var(--alerta); border-color:var(--alerta)}
</style>
</head>
<body>
<header class="topo">
  <h1>Catálogo de venda</h1>
  <span class="espaco"></span>
  <span class="quem" id="quem"></span>
</header>

<div class="corpo">
  <div class="cartao">
    <div class="campos">
      <div class="campo cresce">
        <label for="modelo">Modelo</label>
        <select id="modelo"></select>
      </div>
      <button class="bt primario" type="button" id="btNovo">+ Novo produto</button>
      <a class="bt" href="/sobmedida/simulador" id="lnSimular">Abrir o simulador →</a>
    </div>
    <p class="nota" id="sobreModelo"></p>
    <div id="novoProduto"></div>
  </div>
  <div id="abas"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,banner,el,limpar,$,dinheiro,rolaH}=window.ui;

/* As mesmas conversoes exatas do simulador: metro e reais entram como TEXTO e
   viram inteiro por soma, nunca por `Number(x)*1000`. `1.007*1000` da
   1007.0000000000001, e o servidor recusa milimetro quebrado — com razao. */
function paraInteiro(texto,casas){
  const t=String(texto==null?'':texto).trim().replace('.',',');
  if(!t) return null;
  const m=new RegExp('^(\\d+)(?:,(\\d{0,'+casas+'}))?$').exec(t);
  if(!m) return NaN;
  return Number(m[1])*Math.pow(10,casas)+Number((m[2]||'').padEnd(casas,'0'));
}
const paraMm=t=>paraInteiro(t,3);
const paraCentavos=t=>paraInteiro(t,2);
const emMetros=v=>v==null?'':(v/1000).toFixed(3).replace('.',',');
const emM2=v=>v==null?'':(v/1000000).toFixed(3).replace('.',',');
/* ⚠️ SAO DOIS PAPEIS, E POR ISSO SAO DUAS FUNCOES. O que se LE sai do
   `dinheiro` do ui.js, o dono unico do modulo — um formatador proprio aqui
   e a armadilha #12 em miniatura, o mesmo preco escrito de dois jeitos em
   duas telas.

   O que PRE-PREENCHE os campos `R$ por m²` e `R$ por unidade` continua SEM
   o separador: aquele valor volta pelo `paraCentavos`, e `1.234,56` ali vira
   NaN — a tela recusaria o numero que ela mesma acabou de escrever. E a
   mesma separacao da ficha da revenda (CLAUDE.md §19). */
const reais=c=>(c===null||c===undefined)?null:dinheiro(c/100);
const paraCampo=v=>v==null?'':(v/100).toFixed(2).replace('.',',');

let modelo=null, aba='produto', editando=null, erro=null, novoAberto=false, erroNovo=null;
let modelos=[];

const ABAS=[['produto','Produto'],['escolhas','Escolhas do cliente'],['colecoes','Coleções de venda'],['escada','Escada de tubos'],
            ['ficha','Ficha técnica'],['kit','Kit e suportes'],
            ['componentes','Componentes e preços']];

/* ⚠️ EDITAR ABRE UMA LINHA DE CADA VEZ, e a tabela continua so de leitura.
   E a licao da ficha de Compras (CLAUDE.md secao 7-B): dez campos em duas
   linhas de tabela por material davam para editar e nao davam para LER — e
   ficha que ninguem consegue ler e ficha que ninguem confere. */
function editor(campos, aoSalvar, aoCancelar){
  const box=el('div',{class:'editor'});
  const linha=el('div',{class:'campos'});
  const entradas={};
  campos.forEach(c=>{
    const b=el('div',{class:'campo'+(c.opcoes?' largo':'')},[el('label',{},[c.rotulo])]);
    /* Campo de ESCOLHA quando a resposta é uma lista fechada. Digitar o id de
       um material à mão seria um número sem significado na tela, e o erro só
       apareceria na lista de compras, dias depois. */
    const i=c.opcoes
      ? el('select',{'aria-label':c.rotulo},
          c.opcoes.map(o=>el('option',{value:String(o.valor==null?'':o.valor),
            selected:String(o.valor==null?'':o.valor)===String(c.valor==null?'':c.valor)?'selected':null},[o.rotulo])))
      : el('input',{type:'text', value:c.valor==null?'':String(c.valor),
          placeholder:c.dica||'', 'aria-label':c.rotulo});
    entradas[c.chave]=i; b.appendChild(i); linha.appendChild(b);
  });
  const salvar=el('button',{class:'bt primario',type:'button'},['Salvar']);
  const cancelar=el('button',{class:'bt',type:'button'},['Cancelar']);
  salvar.addEventListener('click',()=>{
    const valores={};
    campos.forEach(c=>{ valores[c.chave]=entradas[c.chave].value; });
    aoSalvar(valores);
  });
  cancelar.addEventListener('click',aoCancelar);
  linha.appendChild(el('div',{class:'campo'},[salvar]));
  linha.appendChild(el('div',{class:'campo'},[cancelar]));
  box.appendChild(linha);
  /* ⚠️ A RECUSA FICA NA PROPRIA LINHA, com o que foi digitado ainda no campo.
     `alert()` seguido de redesenho apagava o texto e devolvia o valor velho —
     quem editava via a recusa e um numero que nao era o seu (secao 7-B). */
  if(erro) box.appendChild(el('p',{class:'erro-linha'},[erro]));
  return box;
}

const botao=(texto,clique,classe)=>{
  const b=el('button',{class:'bt pequeno'+(classe?' '+classe:''),type:'button'},[texto]);
  b.addEventListener('click',clique); return b;
};

async function tentar(fn){
  try{ erro=null; await fn(); editando=null; await recarregar(); }
  /* ⚠️ A FRASE DO SERVIDOR MORA EM `message`: e assim que o ui.js monta o
     erro. Ate 28/10/2026 esta linha lia `e.mensagem`, que nao existe, e toda
     recusa do Catalogo virava "Não deu para salvar." — o porque da recusa
     (a escada que nao sobe, o nome da copia) nunca chegava a quem editava. */
  catch(e){ erro=e.message||e.mensagem||'Não deu para salvar.'; desenhar(); }
}

// ── O produto: nome, limites e se a revenda o vê ──────────────────────────
function abaProduto(){
  const c=el('div',{class:'cartao'},[
    el('h2',{},['Produto',el('span',{class:'selo '+(modelo.ativo?'ativo':'inativo')},
      [modelo.ativo?'ATIVO':'INATIVO'])]),
    el('p',{class:'nota'},[modelo.ativo
      ? 'A revenda vê este produto e o pedido o aceita.'
      : 'INATIVO — a revenda não vê e o pedido não aceita. Confira no simulador (ele aceita o '+
        'produto inativo, com a tarja) e ative quando estiver certo.'])
  ]);
  const ehCopia=/^\s*c[óo]pia\s+de\b/i.test(modelo.nome);
  if(!modelo.ativo&&ehCopia) c.appendChild(el('p',{class:'falta'},
    ['O nome ainda é o da cópia. Dê ao produto o nome que a revenda vai ler — com "Cópia de…" ele não ativa.']));
  c.appendChild(editor([
    {chave:'nome',rotulo:'Nome do produto',valor:modelo.nome},
    {chave:'largura_max_mm',rotulo:'Largura máx (m)',valor:emMetros(modelo.largura_max_mm),dica:'sem teto'},
    {chave:'altura_max_mm',rotulo:'Altura máx (m)',valor:emMetros(modelo.altura_max_mm),dica:'sem teto'},
    {chave:'m2_max_mm2',rotulo:'m² máx',valor:emM2(modelo.m2_max_mm2),dica:'sem teto'},
    {chave:'m2_min_faturado_mm2',rotulo:'Mín. faturado (m²)',valor:emM2(modelo.m2_min_faturado_mm2)}
  ],v=>tentar(()=>api('/api/sm/modelos/'+modelo.id,{metodo:'PUT',silencioso:true,corpo:{
      nome:v.nome,
      largura_max_mm:v.largura_max_mm.trim()?paraMm(v.largura_max_mm):null,
      altura_max_mm:v.altura_max_mm.trim()?paraMm(v.altura_max_mm):null,
      m2_max_mm2:v.m2_max_mm2.trim()?paraInteiro(v.m2_max_mm2,6):null,
      m2_min_faturado_mm2:paraInteiro(v.m2_min_faturado_mm2,6)}})),
    ()=>{ erro=null; desenhar(); }));
  c.appendChild(calculoDoProduto());
  const linha=el('div',{class:'campos'});
  linha.appendChild(botao(modelo.ativo?'Desativar — tirar da venda':'Ativar — a revenda passa a ver',
    ()=>tentar(()=>api('/api/sm/modelos/'+modelo.id+'/ativo',
      {metodo:'PUT',silencioso:true,corpo:{ativo:modelo.ativo?0:1}})),modelo.ativo?'perigo':'primario'));
  c.appendChild(linha);
  return c;
}

/* O CALCULO e uma peca pronta do sistema: o produto escolhe qual, e preenche
   os numeros dela. A conta nao se digita aqui (secao 2 da spec). */
function calculoDoProduto(){
  const box=el('div',{class:'editor'},[el('h2',{},['Cálculo']),
    el('p',{class:'nota'},['O que o sistema decide sozinho. A escada escolhe o tubo; os gomos '+
      'da Romana são sempre ímpares, no mínimo 3, o menor número que deixa cada gomo até o '+
      'limite abaixo; as folhas do Painel se transpassam a cada encontro, lateral de 2 a 5 e '+
      'central em 2, 4 ou 6, sem transpasse no meio.'])]);
  const campos=[{chave:'calculo',rotulo:'Peça pronta de cálculo',valor:modelo.calculo,
    opcoes:(modelo.calculos||[]).map(x=>({valor:x.chave,rotulo:x.nome}))}];
  if(modelo.calculo==='gomos') campos.push({chave:'gomo_max_mm',rotulo:'Gomo até (m)',
    valor:emMetros(modelo.gomo_max_mm),dica:'0,350'});
  if(modelo.calculo==='folhas') campos.push({chave:'transpasse_mm',rotulo:'Transpasse por encontro (m)',
    valor:emMetros(modelo.transpasse_mm),dica:'0,100'});
  box.appendChild(editor(campos,v=>{
    const corpo={calculo:v.calculo};
    if(v.gomo_max_mm!==undefined) corpo.gomo_max_mm=paraMm(v.gomo_max_mm);
    if(v.transpasse_mm!==undefined) corpo.transpasse_mm=paraMm(v.transpasse_mm);
    return tentar(()=>api('/api/sm/modelos/'+modelo.id,{metodo:'PUT',silencioso:true,corpo}));
  },()=>{ erro=null; desenhar(); }));
  return box;
}

/* ── + NOVO PRODUTO (secao 3.1 da spec SOBMEDIDA-CADASTRO-DE-PRODUTO) ──────
   Dois caminhos: do zero (so o nome e os limites, as abas vazias) ou
   duplicando um que existe (copia de tudo). Os dois nascem INATIVOS. */
function desenharNovo(){
  const box=limpar($('#novoProduto'));
  if(!novoAberto) return;
  const ed=el('div',{class:'editor'},[el('h2',{},['Novo produto'])]);
  const modo=el('select',{'aria-label':'Como nasce'},[
    el('option',{value:'duplicar'},['Duplicar um produto que existe (copia tudo)']),
    el('option',{value:'zero'},['Do zero (só o nome e os limites)'])]);
  const origem=el('select',{'aria-label':'Duplicar qual'},
    modelos.map(m=>el('option',{value:String(m.id),selected:m.id===modelo.id?'selected':null},
      [m.nome+(m.ativo?'':' (inativo)')])));
  const nome=el('input',{type:'text','aria-label':'Nome do produto novo',
    placeholder:'Cópia de '+modelo.nome});
  const campoOrigem=el('div',{class:'campo cresce'},[el('label',{},['Duplicar']),origem]);
  modo.addEventListener('change',()=>{
    campoOrigem.style.display=modo.value==='duplicar'?'':'none';
    nome.placeholder=modo.value==='duplicar'?'Cópia de '+origem.selectedOptions[0].textContent:'Romana';
  });
  origem.addEventListener('change',()=>{ nome.placeholder='Cópia de '+origem.selectedOptions[0].textContent; });
  const criar=el('button',{class:'bt primario',type:'button'},['Criar — nasce inativo']);
  criar.addEventListener('click',async()=>{
    try{
      erroNovo=null;
      const novo=modo.value==='duplicar'
        ? await api('/api/sm/modelos/'+origem.value+'/duplicar',{metodo:'POST',silencioso:true,
            corpo:nome.value.trim()?{nome:nome.value.trim()}:{}})
        : await api('/api/sm/modelos',{metodo:'POST',silencioso:true,corpo:{nome:nome.value}});
      novoAberto=false; aba='produto';
      desenharNovo();
      await carregarModelos(novo.id);
      banner('"'+novo.nome+'" criado, INATIVO. Confira no simulador antes de ativar.','bom',8);
    }catch(e){ erroNovo=e.message||e.mensagem||'Não deu para criar.'; desenharNovo(); }
  });
  const cancelar=botao('Cancelar',()=>{ novoAberto=false; erroNovo=null; desenharNovo(); });
  ed.appendChild(el('div',{class:'campos'},[
    el('div',{class:'campo cresce'},[el('label',{},['Como nasce']),modo]),campoOrigem,
    el('div',{class:'campo cresce'},[el('label',{},['Nome (vazio = "Cópia de …")']),nome]),
    el('div',{class:'campo'},[criar]),el('div',{class:'campo'},[cancelar])]));
  if(erroNovo) ed.appendChild(el('p',{class:'erro-linha'},[erroNovo]));
  box.appendChild(ed);
}

// ── As escolhas do cliente ─────────────────────────────────────────────────
/* A LISTA E DO SISTEMA, e aqui so se liga ou desliga. Escolha ligada e
   obrigatoria no pedido; desligada some do simulador e do pedido, e o
   servidor recusa se ela vier mesmo assim. */
function abaEscolhas(){
  const c=el('div',{class:'cartao'},[
    el('h2',{},['Escolhas do cliente']),
    el('p',{class:'nota'},['O que a revenda escolhe no pedido. A lista é do sistema — cada '+
      'escolha tem a regra dela escrita no código. Produto que precisa de uma escolha que não '+
      'está aqui entra por especificação, nunca como campo digitado.'])
  ]);
  const t=el('table',{class:'lista'});
  t.appendChild(el('thead',{},[el('tr',{},[el('th',{},['Escolha']),el('th',{},['Opções']),
    el('th',{},['Ligada']),el('th',{},[''])])]));
  const tb=el('tbody');
  (modelo.escolhas||[]).forEach(x=>{
    const ops=x.numero?'número':(x.opcoes||[]).map(o=>o.nome).join(' · ');
    const dep=x.depende?Object.keys(x.depende).map(k=>{
      const pai=(modelo.escolhas||[]).find(y=>y.chave===k);
      const op=pai&&(pai.opcoes||[]).find(o=>o.valor===x.depende[k]);
      return 'só com '+(op?op.nome.toLowerCase():x.depende[k]);
    }).join(', '):'';
    tb.appendChild(el('tr',{class:x.ligada?'':'inativa'},[
      el('td',{},[x.nome, dep?el('div',{class:'setor'},[dep]):'']),
      el('td',{class:'nota'},[ops]),
      el('td',{},[x.ligada?'sim':'não']),
      el('td',{},[botao(x.ligada?'Desligar':'Ligar',()=>tentar(()=>api('/api/sm/modelos/'+modelo.id+
        '/escolhas/'+x.chave,{metodo:'PUT',silencioso:true,corpo:{ligada:!x.ligada}})))])
    ]));
  });
  t.appendChild(tb);
  c.appendChild(rolaH(t));
  if(erro) c.appendChild(el('p',{class:'erro-linha'},[erro]));
  return c;
}

// ── Coleções de venda ──────────────────────────────────────────────────────
function abaColecoes(){
  const c=el('div',{class:'cartao'},[
    el('h2',{},['Coleções de venda']),
    el('p',{class:'nota'},['Elas APONTAM para o cadastro de tecido — a coleção e a '+
      'linha vêm de lá, e a venda só acrescenta preço e limites. Coleção nova se '+
      'cadastra em Cadastros → Tecido.'])
  ]);
  const t=el('table',{class:'lista'});
  t.appendChild(el('thead',{},[el('tr',{},[
    el('th',{},['Coleção']),el('th',{},['Linha']),el('th',{class:'n'},['Preço por m²']),
    el('th',{class:'n'},['Largura máx']),el('th',{class:'n'},['m² máx']),
    el('th',{class:'n'},['Mín. faturado']),el('th',{},[''])])]));
  const tb=el('tbody');
  modelo.colecoes.forEach(col=>{
    const tr=el('tr',{class:col.disponivel?'':'inativa'});
    tr.appendChild(el('td',{},[col.colecao_nome]));
    tr.appendChild(el('td',{class:'setor'},[col.linha_nome]));
    // O preco so chega a quem tem custo.ver — o JSON vem sem o campo.
    const temPreco='preco_m2_centavos' in col;
    tr.appendChild(el('td',{class:'n'},[ temPreco
      ? (col.preco_m2_centavos==null?el('span',{class:'falta'},['sem preço'])
                                    :reais(col.preco_m2_centavos)) : '·' ]));
    tr.appendChild(el('td',{class:'n medida'},[col.largura_max_mm==null?'—':emMetros(col.largura_max_mm)]));
    tr.appendChild(el('td',{class:'n medida'},[col.m2_max_mm2==null?'—':emM2(col.m2_max_mm2)]));
    tr.appendChild(el('td',{class:'n medida'},[col.m2_min_faturado_mm2==null
      ? ('('+emM2(modelo.m2_min_faturado_mm2)+')') : emM2(col.m2_min_faturado_mm2)]));
    const acoes=el('td');
    acoes.appendChild(botao('Limites',()=>{ editando='col-'+col.id; erro=null; desenhar(); }));
    if(temPreco) acoes.appendChild(botao('Preço',()=>{ editando='preco-'+col.id; erro=null; desenhar(); }));
    acoes.appendChild(botao(col.ativo?'Desativar':'Reativar',
      ()=>tentar(()=>api('/api/sm/colecoes/'+col.id,{metodo:'PUT',corpo:{ativo:col.ativo?0:1}}))));
    tr.appendChild(acoes);
    tb.appendChild(tr);

    if(editando==='col-'+col.id){
      const box=el('tr',{},[el('td',{colspan:'7'},[editor([
        {chave:'largura_max_mm',rotulo:'Largura máx (m)',valor:emMetros(col.largura_max_mm),dica:'2,800'},
        {chave:'altura_max_mm', rotulo:'Altura máx (m)', valor:emMetros(col.altura_max_mm)},
        {chave:'m2_max_mm2',    rotulo:'m² máx',         valor:emM2(col.m2_max_mm2)},
        {chave:'m2_min_faturado_mm2',rotulo:'Mín. faturado (m²)',valor:emM2(col.m2_min_faturado_mm2),
         dica:emM2(modelo.m2_min_faturado_mm2)}
      ],v=>{
        /* ⚠️ CAMPO VAZIO AQUI QUER DIZER "SEM LIMITE PROPRIO" (null), e nao
           zero — por isso ele e mandado explicitamente. O que NAO e mandado e
           o preco: ele tem porta propria, com historico. */
        const corpo={
          largura_max_mm: v.largura_max_mm.trim()?paraMm(v.largura_max_mm):null,
          altura_max_mm:  v.altura_max_mm.trim()?paraMm(v.altura_max_mm):null,
          m2_max_mm2:     v.m2_max_mm2.trim()?paraInteiro(v.m2_max_mm2,6):null,
          m2_min_faturado_mm2: v.m2_min_faturado_mm2.trim()?paraInteiro(v.m2_min_faturado_mm2,6):null
        };
        return tentar(()=>api('/api/sm/colecoes/'+col.id,{metodo:'PUT',corpo,silencioso:true}));
      },()=>{ editando=null; erro=null; desenhar(); })])]);
      tb.appendChild(box);
    }
    if(editando==='preco-'+col.id){
      const box=el('tr',{},[el('td',{colspan:'7'},[
        editor([{chave:'preco',rotulo:'R$ por m²',valor:paraCampo(col.preco_m2_centavos),dica:'110,00'}],
          v=>tentar(()=>api('/api/sm/colecoes/'+col.id+'/preco',
            {metodo:'PUT',corpo:{preco_m2_centavos:paraCentavos(v.preco)},silencioso:true})),
          ()=>{ editando=null; erro=null; desenhar(); }),
        historico('colecao',col.id)
      ])]);
      tb.appendChild(box);
    }
  });
  t.appendChild(tb);
  /* Sem o recipiente do `rolaH` a tabela mais larga que a janela empurra a
     PAGINA inteira, e num celular o topo do card sai de vista (§12). */
  c.appendChild(rolaH(t));
  c.appendChild(ligarColecao());
  c.appendChild(cores());
  return c;
}

function historico(alvo,id){
  const box=el('div',{class:'hist'},['carregando o histórico…']);
  api('/api/sm/'+(alvo==='colecao'?'colecoes':'componentes')+'/'+id+'/preco/historico',{silencioso:true})
    .then(linhas=>{
      limpar(box);
      if(!linhas.length) return box.appendChild(el('div',{},['Sem mudança de preço registrada.']));
      linhas.forEach(l=>box.appendChild(el('div',{},[
        l.criado_em+' · '+(l.de==null?'sem preço':reais(l.de))+' → '+reais(l.para)+
        ' · '+(l.usuario_nome||'—')])));
    })
    .catch(()=>{ limpar(box); });   // quem nao ve custo simplesmente nao ve isto
  return box;
}

function ligarColecao(){
  const box=el('div',{class:'editor'});
  const sel=el('select',{id:'novaColecao'});
  const campo=el('div',{class:'campo cresce'},[el('label',{},['Ligar uma coleção do cadastro de tecido']),sel]);
  const preco=el('input',{type:'text',placeholder:'110,00','aria-label':'R$ por m²'});
  const linha=el('div',{class:'campos'},[campo,
    el('div',{class:'campo'},[el('label',{},['R$ por m² (pode ficar vazio)']),preco])]);
  const bt=el('button',{class:'bt primario',type:'button'},['Ligar']);
  bt.addEventListener('click',()=>{
    if(!sel.value) return banner('Escolha a coleção.','alerta');
    const corpo={abertura_id:Number(sel.value)};
    if(preco.value.trim()) corpo.preco_m2_centavos=paraCentavos(preco.value);
    tentar(()=>api('/api/sm/modelos/'+modelo.id+'/colecoes',{metodo:'POST',corpo,silencioso:true}));
  });
  linha.appendChild(el('div',{class:'campo'},[bt]));
  box.appendChild(linha);
  if(erro&&!editando) box.appendChild(el('p',{class:'erro-linha'},[erro]));

  api('/api/linhas').then(async linhas=>{
    const ligadas=modelo.colecoes.map(c=>c.abertura_id);
    for(const l of linhas){
      const abs=await api('/api/aberturas?linha_id='+l.id);
      abs.filter(a=>ligadas.indexOf(a.id)<0).forEach(a=>{
        const o=el('option',{value:String(a.id)},[l.nome+' · '+a.nome+(a.ativo?'':' (inativa)')]);
        sel.appendChild(o);
      });
    }
    if(!sel.options.length) sel.appendChild(el('option',{value:''},['— todas as coleções já estão ligadas —']));
  });
  return box;
}

function cores(){
  const box=el('div',{class:'editor'});
  const f=el('div',{class:'fileira'});
  modelo.cores_acessorio.forEach(c=>f.appendChild(
    el('span',{class:'op','aria-pressed':'true'},[c.cor_nome])));
  if(!modelo.cores_acessorio.length) f.appendChild(el('span',{class:'falta'},
    ['Nenhuma cor de acessório — o simulador recusa toda persiana até ter uma.']));
  const sel=el('select');
  const bt=el('button',{class:'bt',type:'button'},['Adicionar cor']);
  bt.addEventListener('click',()=>{ if(sel.value)
    tentar(()=>api('/api/sm/modelos/'+modelo.id+'/cores',
      {metodo:'POST',corpo:{cor_id:Number(sel.value)},silencioso:true})); });
  api('/api/cores').then(cores=>{
    const ja=modelo.cores_acessorio.map(c=>c.cor_id);
    cores.filter(c=>ja.indexOf(c.id)<0).forEach(c=>
      sel.appendChild(el('option',{value:String(c.id)},[c.nome+(c.ativo?'':' (inativa)')])));
  });
  box.appendChild(el('h2',{},['Cores de acessório']));
  box.appendChild(f);
  box.appendChild(el('div',{class:'campos'},[el('div',{class:'campo cresce'},[sel]),
    el('div',{class:'campo'},[bt])]));
  return box;
}

/* ── O MATERIAL DE COMPRA DO PCP (fase 4-C) ────────────────────────────────
   O tubo da persiana sob medida é o MESMO tubo da medida padrão, e Compras é
   um só. Aqui se aponta qual item do cadastro de material do PCP corresponde
   a cada degrau da escada — e a peças que tenham material próprio.

   ⚠️ O TUBO SE APONTA NO DEGRAU, e é por isso que esta coluna mora na escada:
   Tubo 32 e Tubo 41 são itens de estoque diferentes, comprados e guardados à
   parte. O material muda com o degrau. */
const MATERIAIS=()=>(window.__materiais&&window.__materiais.materiais)||[];
const PORTA_LIGADA=()=>!!(window.__materiais&&window.__materiais.ligada);

function celulaMaterial(id){
  if(id==null) return el('span',{class:'setor'},['— não aponta —']);
  const m=MATERIAIS().find(x=>x.id===id);
  /* Apontado para um material que sumiu do PCP: a tela DIZ, em vez de mostrar
     um branco. É o mesmo buraco que vira pendência na lista de compras, visto
     do lado onde alguém pode consertá-lo. */
  return m ? el('span',{},[m.nome+' · '+m.unidade])
           : el('span',{class:'aviso'},['id '+id+' — não está mais em Compras']);
}

function opcoesDeMaterial(){
  return [{valor:'',rotulo:'— não aponta material —'}]
    .concat(MATERIAIS().map(m=>({valor:m.id, rotulo:m.nome+'  ('+m.unidade+')'})));
}

/* A mesma linha de edição para o degrau e para o componente — são a mesma
   pergunta, e duas cópias divergiriam no dia em que a regra mudasse numa só. */
function editorMaterial(url, atual){
  if(!PORTA_LIGADA()) return el('p',{class:'erro-linha'},[
    'A lista de materiais do PCP não está ligada neste servidor, então não há '+
    'o que escolher. Quem a liga é o server.js, na chamada de montar() do /sobmedida.']);
  return editor([{chave:'componente_id', rotulo:'Material de compra (PCP)',
    valor:atual, opcoes:opcoesDeMaterial()}],
    v=>tentar(()=>api(url,{metodo:'PUT',silencioso:true,
      corpo:{componente_id:v.componente_id===''?null:Number(v.componente_id)}})),
    ()=>{ editando=null; erro=null; desenhar(); });
}

/* A ETIQUETA DA LINHA, e o que falta no cadastro de material em AMBAR
   (secao 8.2). "Sem material ligado" e a lista de trabalho para arrumar o
   cadastro aos poucos — nada trava por isso: a etiqueta sai com o nome do
   componente. */
function celulaEtiqueta(f){
  const td=el('td',{},[f.gera_etiqueta?('sim'+(f.ficha_gera_etiqueta==null?'':' (desta ficha)')):
    ('não'+(f.ficha_gera_etiqueta==null?'':' (desta ficha)'))]);
  if(f.etiqueta_extras) td.appendChild(el('div',{class:'setor'},['+ '+f.etiqueta_extras.replace(/,/g,', ')]));
  const av=(modelo.avisos_material||[]).find(x=>x.chave===f.chave);
  if(av&&av.aviso) td.appendChild(el('div',{class:'falta'},[av.aviso]));
  else if(av&&av.material) td.appendChild(el('div',{class:'setor'},[av.material.nome+
    (av.material.marca?' · '+av.material.marca:'')+(av.material.modelo?' · '+av.material.modelo:'')]));
  return td;
}

/* ⚠️ A LINHA NOVA DA FICHA E O QUE DEIXA O DONO MONTAR UM PRODUTO SOZINHO
   (secao 2 da spec SOBMEDIDA-CADASTRO-DE-PRODUTO). Ela entra no FIM da ficha
   por padrao: a referencia so pode olhar para tras, e no fim ela enxerga
   todas as que ja existem. */
function novaLinhaFicha(){
  const comps=(window.__componentes||[]).filter(x=>x.ativo);
  const opComp=comps.map(x=>({valor:x.id, rotulo:x.nome+' · '+x.chave+' · '+x.setor}));
  const opQuando=(modelo.quandos||['sempre']).map(q=>({valor:q,rotulo:q}));
  const box=el('div',{class:'editor'},[el('h2',{},['Acrescentar linha à ficha'])]);
  if(editando==='fic-nova'){
    box.appendChild(editor([
      {chave:'componente_id',rotulo:'Componente',valor:'',opcoes:opComp},
      {chave:'quando',rotulo:'Quando entra',valor:'sempre',opcoes:opQuando},
      {chave:'libera',rotulo:'Na bancada, segura',valor:'',
       opcoes:[{valor:'',rotulo:'a montagem (padrão)'},{valor:'embalagem',rotulo:'só a embalagem (vai só na caixa)'}]},
      {chave:'quantidade',rotulo:'Quantidade',valor:'1'},
      {chave:'quantidade_ref',rotulo:'ou pela referência',valor:'',
       opcoes:[{valor:'',rotulo:'— fixa —'}].concat((modelo.quantidades_ref||[]).map(q=>({valor:q,rotulo:q})))},
      {chave:'ref_largura',rotulo:'Corte: ref largura',dica:'final | tubo'},
      {chave:'ajuste_largura_mm',rotulo:'Corte: ajuste da largura (mm)',dica:'-5'},
      {chave:'ref_altura',rotulo:'Corte: ref altura',dica:'final'},
      {chave:'ajuste_altura_mm',rotulo:'Corte: ajuste da altura (mm)'},
      {chave:'consumo_ref_largura',rotulo:'Consumo: ref largura'},
      {chave:'consumo_ajuste_largura_mm',rotulo:'Consumo: ajuste da largura (mm)'},
      {chave:'consumo_ref_altura',rotulo:'Consumo: ref altura'},
      {chave:'consumo_ajuste_altura_mm',rotulo:'Consumo: ajuste da altura (mm)'}
    ],v=>{
      const corpo={componente_id:Number(v.componente_id),quando:v.quando};
      Object.keys(v).forEach(k=>{
        if(k==='componente_id'||k==='quando') return;
        const t=String(v[k]).trim();
        if(t==='') return;
        corpo[k]=/ajuste|^quantidade$/.test(k)?Number(t.replace(',','.')):t;
      });
      return tentar(()=>api('/api/sm/modelos/'+modelo.id+'/ficha',{metodo:'POST',corpo,silencioso:true}));
    },()=>{ editando=null; erro=null; desenhar(); }));
  }else box.appendChild(botao('+ Acrescentar linha',()=>{ editando='fic-nova'; erro=null; desenhar(); }));
  return box;
}

// ── Kit e suportes ─────────────────────────────────────────────────────────

     do produto, que vale para o kit que conta suporte e nao tem faixa propria

    el('td',{class:'n'},[String(f.quantidade)]),
    el('td',{},[botao('Apagar',()=>tentar(()=>api('/api/sm/faixas/'+f.id,{metodo:'DELETE',silencioso:true})),'perigo')])
  ])));
  t.appendChild(tb);

    el('div',{class:'campo'},[el('label',{},['Largura até (m)']),l]),
    el('div',{class:'campo'},[el('label',{},['Suportes']),q]),
    el('div',{class:'campo'},[bt])]));
  if(erro) nova.appendChild(el('p',{class:'erro-linha'},[erro]));
  c.appendChild(nova);

  const r=modelo.reducao||{};
  const red=el('div',{class:'editor'},[
    el('h2',{},['Redução de peso — a regra de garantia']),
    el('p',{class:'nota'},['Acima de qualquer um dos dois a redução entra sozinha, e é '+
      'cobrada do mesmo jeito. A tela do simulador diz "incluída pela regra de garantia".'])
  ]);
  const rm=el('input',{type:'text',value:emM2(r.m2_acima_mm2),placeholder:'4,500','aria-label':'m² acima de'});
  const rl=el('input',{type:'text',value:emMetros(r.largura_acima_mm),placeholder:'2,200','aria-label':'largura acima de'});
  const rb=el('button',{class:'bt primario',type:'button'},['Salvar a regra']);
  rb.addEventListener('click',()=>tentar(()=>api('/api/sm/modelos/'+modelo.id+'/reducao',
    {metodo:'PUT',silencioso:true,corpo:{
      m2_acima_mm2: rm.value.trim()?paraInteiro(rm.value,6):null,
      largura_acima_mm: rl.value.trim()?paraMm(rl.value):null}})));
  red.appendChild(el('div',{class:'campos'},[
    el('div',{class:'campo'},[el('label',{},['Acima de (m²)']),rm]),
    el('div',{class:'campo'},[el('label',{},['ou acima da largura (m)']),rl]),
    el('div',{class:'campo'},[rb])]));
  c.appendChild(red);
  return c;
}

// ── Componentes ────────────────────────────────────────────────────────────
function abaComponentes(){
  const c=el('div',{class:'cartao'},[
    el('h2',{},['Componentes e preços']),
    el('p',{class:'nota'},['O preço do tecido é o da COLEÇÃO (aba Coleções de venda). '+
      'Aqui ficam os que têm preço próprio: bandô e barra por metro linear da largura '+
      'real, redução de peso por peça.'])
  ]);
  const t=el('table',{class:'lista'});
  t.appendChild(el('thead',{},[el('tr',{},[
    el('th',{},['Componente']),el('th',{},['Setor']),el('th',{},['Cobrança']),
    el('th',{class:'n'},['Preço']),el('th',{},['Código de barras']),
    el('th',{},['Material de compra']),el('th',{},[''])])]));
  const tb=el('tbody');
  (window.__componentes||[]).forEach(comp=>{
    const temPreco='preco_centavos' in comp;
    tb.appendChild(el('tr',{class:comp.ativo?'':'inativa'},[
      el('td',{},[comp.nome, el('div',{class:'setor'},[comp.chave])]),
      el('td',{class:'setor'},[comp.setor]),
      el('td',{},[comp.unidade_cobranca||'não cobra']),
      el('td',{class:'n'},[ temPreco
        ? (reais(comp.preco_centavos)||'—') : '·' ]),
      el('td',{class:'medida'},[comp.codigo_barras||'—']),
      /* O tubo aparece aqui com a resposta e o caminho, em vez de um botão que
         só recusa: ele se aponta na escada, porque o material muda com o
         degrau. Trava que nega sem dizer para onde ir é trava que a equipe
         aprende a contornar. */
      el('td',{},[ comp.chave==='tubo'
        ? el('span',{class:'setor'},['na escada de tubos'])
        : celulaMaterial(comp.componente_id) ]),
      el('td',{},[ temPreco&&comp.unidade_cobranca&&comp.unidade_cobranca!=='m2_colecao'
          ? botao('Preço',()=>{ editando='comp-'+comp.id; erro=null; desenhar(); }) : '',
        comp.chave==='tubo' ? ''
          : botao('Material',()=>{ editando='compmat-'+comp.id; erro=null; desenhar(); }) ])
    ]));
    if(editando==='compmat-'+comp.id) tb.appendChild(el('tr',{},[el('td',{colspan:'7'},[
      editorMaterial('/api/sm/componentes/'+comp.id+'/material', comp.componente_id)])]));
    if(editando==='comp-'+comp.id) tb.appendChild(el('tr',{},[el('td',{colspan:'7'},[
      editor([{chave:'preco',rotulo:'R$ por '+comp.unidade_cobranca,
        valor:paraCampo(comp.preco_centavos),dica:'55,00'}],
        v=>tentar(()=>api('/api/sm/componentes/'+comp.id+'/preco',
          {metodo:'PUT',corpo:{preco_centavos:paraCentavos(v.preco)},silencioso:true})),
        ()=>{ editando=null; erro=null; desenhar(); }),
      historico('componente',comp.id)
    ])]));
  });
  t.appendChild(tb);
  c.appendChild(rolaH(t));
  c.appendChild(novoComponente());
  return c;
}

/* O COMPONENTE NOVO — vareta, trilho, corda, motor. Ele e do sistema, e nao
   do produto: o mesmo componente pode estar na ficha de varios produtos, e o
   preco por metro dele e um so. */
function novoComponente(){
  const box=el('div',{class:'editor'},[el('h2',{},['Novo componente'])]);
  if(editando!=='comp-novo'){
    box.appendChild(botao('+ Novo componente',()=>{ editando='comp-novo'; erro=null; desenhar(); }));
    return box;
  }
  box.appendChild(editor([
    {chave:'chave',rotulo:'Chave (uma palavra)',dica:'vareta'},
    {chave:'nome',rotulo:'Nome',dica:'Vareta'},
    {chave:'setor',rotulo:'Setor',valor:'serralheria',
     opcoes:(modelo.setores||[]).map(x=>({valor:x.chave,rotulo:x.nome}))},
    {chave:'gera_etiqueta',rotulo:'Gera etiqueta',valor:'1',
     opcoes:[{valor:'1',rotulo:'sim'},{valor:'0',rotulo:'não'}]},
    {chave:'unidade_cobranca',rotulo:'Cobrança',valor:'',
     opcoes:[{valor:'',rotulo:'não cobra'},{valor:'metro',rotulo:'por metro linear'},
             {valor:'peca',rotulo:'por peça'},{valor:'m2_colecao',rotulo:'m² da coleção (tecido)'}]},
    {chave:'preco',rotulo:'Preço (R$)',dica:'55,00'},
    {chave:'eh_kit',rotulo:'É kit',valor:'0',opcoes:[{valor:'0',rotulo:'não'},{valor:'1',rotulo:'sim'}]},
    {chave:'codigo_barras',rotulo:'Código de barras (kit)',dica:'KIT-PAINEL'}
  ],v=>{
    const corpo={chave:v.chave,nome:v.nome,setor:v.setor,gera_etiqueta:v.gera_etiqueta==='1',
      unidade_cobranca:v.unidade_cobranca||null,eh_kit:v.eh_kit==='1',
      codigo_barras:v.codigo_barras.trim()||null};
    if(v.preco.trim()) corpo.preco_centavos=paraCentavos(v.preco);
    return tentar(()=>api('/api/sm/componentes',{metodo:'POST',corpo,silencioso:true}));
  },()=>{ editando=null; erro=null; desenhar(); }));
  return box;
}

// ── Moldura ────────────────────────────────────────────────────────────────
function desenhar(){
  const raiz=limpar($('#abas'));
  const barra=el('div',{class:'abas'});
  ABAS.forEach(([chave,nome])=>{
    const b=el('button',{type:'button','aria-selected':String(aba===chave)},[nome]);
    b.addEventListener('click',()=>{ aba=chave; editando=null; erro=null; desenhar(); });
    barra.appendChild(b);
  });
  raiz.appendChild(barra);
  if(!modelo.ativo) raiz.appendChild(el('div',{class:'tarja'},
    ['INATIVO — a revenda não vê "'+modelo.nome+'". O simulador aceita, para conferir.']));
  /* Todo produto leva kit de instalacao, e sem ele o produto nao ativa
     (secao 8.5). A tarja diz isso antes de a pessoa clicar em Ativar. */
  if(modelo.sem_kit) raiz.appendChild(el('div',{class:'tarja'},
    ['SEM KIT — a ficha técnica não tem kit de instalação. Todo produto leva kit: '+
     'sem ele o produto não ativa.']));
  raiz.appendChild({produto:abaProduto, escolhas:abaEscolhas, colecoes:abaColecoes, escada:abaEscada, ficha:abaFicha,
                    kit:abaKit, componentes:abaComponentes}[aba]());

  $('#sobreModelo').textContent='Mínimo faturado de '+emM2(modelo.m2_min_faturado_mm2)+
    ' m² · '+modelo.degraus.length+' degraus · '+modelo.colecoes.length+' coleções ligadas · '+
    modelo.ficha.length+' linhas de ficha.';
}

async function recarregar(){
  modelo=await api('/api/sm/modelos/'+modelo.id);
  /* O simulador abre JA no produto daqui: conferir a copia e o caminho
     normal, e escolher de novo la e a chance de conferir o Rolo achando que
     e a copia. */
  $('#lnSimular').setAttribute('href','/sobmedida/simulador?modelo='+modelo.id);
  const i=modelos.findIndex(m=>m.id===modelo.id);
  if(i>=0&&(modelos[i].nome!==modelo.nome||modelos[i].ativo!==modelo.ativo)){
    modelos[i]=Object.assign({},modelos[i],{nome:modelo.nome,ativo:modelo.ativo});
    const o=$('#modelo').options[i];
    if(o) o.textContent=modelo.nome+(modelo.ativo?'':' (inativo)');
  }
  window.__componentes=await api('/api/sm/componentes');
  window.__materiais=await api('/api/sm/materiais');
  desenhar();
}

/* O seletor diz QUAL esta inativo, no proprio nome: escolher o modelo errado
   para editar e o primeiro jeito de mexer no Rolo achando que e a copia. */
async function carregarModelos(escolher){
  modelos=await api('/api/sm/modelos');
  const sel=limpar($('#modelo'));
  modelos.forEach(m=>sel.appendChild(el('option',{value:String(m.id),
    selected:m.id===escolher?'selected':null},[m.nome+(m.ativo?'':' (inativo)')])));
  if(!modelos.length) return banner('Nenhum modelo cadastrado.','alerta');
  modelo={id:escolher||modelos[0].id};
  sel.value=String(modelo.id);
  editando=null; erro=null;
  await recarregar();
}

(async function(){
  const eu=await api('/api/eu');
  $('#quem').textContent=eu.nome;
  $('#modelo').addEventListener('change',()=>{
    modelo={id:Number($('#modelo').value)}; editando=null; erro=null; recarregar(); });
  $('#btNovo').addEventListener('click',()=>{ novoAberto=!novoAberto; erroNovo=null; desenharNovo(); });
  await carregarModelos();
})();
</script>
