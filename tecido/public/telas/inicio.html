<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sob medida</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
  /* A porta da bancada. Tres regras vindas do docs/DESIGN.md:
     alvo grande (o operador esta em pe, com a peca na mao), uma coisa por
     vez, e NUNCA cor sozinha — cada porta traz titulo, uma linha dizendo
     para que serve e um numero de ordem. Quem chega no primeiro dia consegue
     ler o fluxo da fabrica na propria tela inicial. */
  .portas{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
  .porta{
    display:block; text-decoration:none; color:inherit;
    background:var(--cartao); border:1px solid var(--linha);
    border-left:6px solid var(--acao);
    border-radius:var(--raio-g); padding:18px 20px; min-height:104px;
    box-shadow:var(--sombra);
  }
  .porta:active{transform:translateY(1px)}
  .porta .passo{font-size:13px; font-weight:800; letter-spacing:.08em;
    color:var(--tinta-fraca); text-transform:uppercase}
  .porta h2{margin:2px 0 4px; font-size:24px; font-weight:700; line-height:1.15}
  .porta p{margin:0; font-size:15px; color:var(--tinta-fraca)}
  .porta.sobra{border-left-color:var(--sobra)}
  .porta.painel,.porta.cadastros{border-left-color:var(--tinta-fraca)}
</style>
</head>
<body>
<header class="topo">
  <h1>Sob medida &mdash; corte de tecido</h1>
</header>

<div class="corpo">
  <div class="portas" id="portas"></div>

  <div class="cartao" id="ajuda">
    <h2>O caminho de uma peca</h2>
    <p class="nota">O rolo entra no estoque, o pedido vira plano de corte, o que
      sobra do corte volta para a prateleira com etiqueta &mdash; e a proxima peca
      que couber numa sobra sai dela, nao do rolo.</p>
  </div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,el,limpar,$}=window.ui;

// Cada porta diz PARA QUE SERVE, nao so o nome da tela. "Sobras" e um
// substantivo; "o retalho que sobrou do corte, na prateleira" e uma
// instrucao — e quem chega no primeiro dia le a segunda.
const PORTAS=[
  {caminho:'/corte',     passo:'1 · pedido',   nome:'Plano de corte',
   texto:'Suba as etiquetas do pedido e veja de onde cortar cada peca.'},
  {caminho:'/rolos',     passo:'2 · estoque',  nome:'Rolos',
   texto:'Entrada de rolo, saldo em metros e acerto de fim de rolo.'},
  {caminho:'/sobras',    passo:'3 · retalho',  nome:'Sobras', classe:'sobra',
   texto:'O que sobrou do corte, com medida, endereco e condicao.'},
  {caminho:'/etiquetas', passo:'4 · prateleira', nome:'Etiquetas', classe:'sobra',
   texto:'Imprime o lote de etiquetas para colar nas sobras.'},
  {caminho:'/painel',    passo:'escritorio',   nome:'Painel', classe:'painel',
   texto:'Cortes do periodo, desperdicio, encalhe e recusas.'},
  {caminho:'/cadastros', passo:'escritorio',   nome:'Cadastros', classe:'cadastros',
   texto:'Tecidos, enderecos, motivos e os parametros do calculo.'}
];

api('/api/eu').then(eu=>{
  const c=limpar($('#portas'));
  const minhas=PORTAS.filter(p=>eu.telas.includes(p.caminho));
  minhas.forEach(p=>{
    const a=el('a',{class:'porta '+(p.classe||''),href:'/sobmedida'+p.caminho});
    a.appendChild(el('div',{class:'passo',texto:p.passo}));
    a.appendChild(el('h2',{texto:p.nome}));
    a.appendChild(el('p',{texto:p.texto}));
    c.appendChild(a);
  });
  // Sem porta nenhuma nao deveria acontecer — o portao ja barraria antes.
  // Mas se acontecer, a tela diz o que fazer em vez de ficar vazia.
  if(!minhas.length) c.appendChild(el('div',{class:'vazio',
    texto:'Seu acesso ainda nao alcanca nenhuma tela do sob medida. Peca ao admin em Admin -> Acessos.'}));

  /* O QUE A BANCADA APONTOU E ESPERA A CHEFIA. A bancada nao corrige sobra:
     ela aponta, e a correcao so acontece quando alguem com `sobra.corrigir`
     aceita. Se esse alguem so descobre o apontamento quando abre o Catalogo
     de Sobras por outro motivo, "a chefia decide depois" vira "ninguem
     decide" — a mesma meia-decisao da armadilha #14. O aviso so aparece
     quando ha algo, e some quando nao ha. */
  if((eu.permissoes||[]).includes('sobra.corrigir')){
    api('/api/sobras/propostas').then(pend=>{
      if(!pend.length) return;
      const av=el('a',{class:'porta sobra',href:'/sobmedida/sobras',style:'grid-column:1/-1'});
      av.appendChild(el('div',{class:'passo',texto:'esperando voce'}));
      av.appendChild(el('h2',{texto:pend.length+' sobra(s) apontada(s) pela bancada'}));
      av.appendChild(el('p',{texto:'A bancada achou erro no cadastro e apontou o certo. Abra o Catalogo de Sobras para aceitar ou recusar.'}));
      c.insertBefore(av,c.firstChild);
    }).catch(()=>{});
  }
});
</script>
</body>
</html>
