<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobras · Tecido</title>
<link rel="stylesheet" href="/sobmedida/base.css">
<style>
/* O campo de bipe e o centro da tela: grande, visivel e sempre com o foco.
   Campo fora da tela e campo que o iPad tira o foco — o leitor bipa e nada
   acontece. */
#codigo{font-size:30px; letter-spacing:.08em; text-align:center; min-height:68px}
.medidas input, .medidas select{font-size:28px; text-align:center; min-height:68px}
/* A lista aberta precisa caber MUITA linha na tela: sao ~250 larguras e ~550
   alturas, de centimetro em centimetro. No iPad o select vira roda nativa e
   isso nao importa; no desktop, importa. */
.medidas select{background:var(--campo)}
.contador{font-size:15px; color:var(--tinta-fraca)}
.contador b{font-size:22px; color:var(--tinta)}
</style>
</head>
<body>
<header class="topo">
  <h1>Sobras</h1>
  <span class="espaco"></span>
  <span class="quem" id="resumoTecido"></span>
</header>

<div class="corpo">
  <div class="abas" id="abas"></div>
  <div id="conteudo"></div>
</div>

<script src="/sobmedida/ui.js"></script>
<script src="/sobmedida/nav.js"></script>
<script>
const {api,banner,beep,el,limpar,$,num,comoNumero,formatarMedida,formatarArea,dinheiro}=window.ui;

let eu={}, aba='lancar';
/* QUEM VE DINHEIRO. O servidor ja mandou o JSON sem preco e valor para quem
   nao tem custo.ver, entao esconder aqui e conforto, nunca a trava. */
const podeCusto=()=>(eu.permissoes||[]).includes('custo.ver');

/* O de -> para escrito como a tela escreve: medida com virgula, preco em R$.
   O servidor manda numero cru (1.5, 18.5); o operador le "1,50" e "R$ 18,50". */
const fmtVal=(campo,v)=>{
  if(v==null) return '—';
  if(campo==='preco') return isFinite(Number(v))?dinheiro(Number(v)):String(v);
  if(campo==='largura'||campo==='altura') return isFinite(Number(v))?num(v)+' m':String(v);
  return String(v);
};
const fmtMud=m=>m.campo+' '+fmtVal(m.campo,m.de)+' → '+fmtVal(m.campo,m.para);
const memoria={
  // O que faz o mutirao render: catalogando uma prateleira por vez, o tecido
  // e o endereco quase nao mudam entre um retalho e o seguinte.
  get(chave){ try{ return JSON.parse(localStorage.getItem('sobra_'+chave)); }catch(e){ return null; } },
  set(chave,v){ try{ localStorage.setItem('sobra_'+chave,JSON.stringify(v)); }catch(e){} }
};

const estado={
  tecidos:[], condicoes:[], arvore:[], pendentes:[], ultimas:[],
  tecido_id:memoria.get('tecido'), condicao:memoria.get('condicao'),
  haste_id:memoria.get('haste'), andar_id:memoria.get('andar'), nivel_id:memoria.get('nivel'),
  // A medida escolhida sobrevive ao redesenho da tela (trocar condicao ou
  // endereco recria os campos). Os limites da lista vem de `parametro`.
  codigo:'', larg:'', alt:'', parametros:null,
  naSessao:0,
  // Catalogo: qual sobra esta aberta ({id, modo:'corrigir'|'propor'}), o
  // filtro digitado, e qual tecido esta com o cartao de preco aberto.
  corrigindo:null, filtro:'', precificando:null
};

const ABAS=[{id:'lancar',nome:'Lancar sobra'},{id:'lista',nome:'Catalogo'}];

function montarAbas(){
  const c=limpar($('#abas'));
  ABAS.forEach(a=>c.appendChild(el('button',{texto:a.nome,'aria-selected':String(a.id===aba),
    onclick:()=>{ aba=a.id; desenhar(); }})));
}
function desenhar(){
  montarAbas();
  const c=limpar($('#conteudo'));
  return aba==='lancar'?telaLancar(c):telaLista(c);
}

/* O "+ novo" NO FIM DA FILEIRA — o mesmo da tela de rolos, pelo mesmo motivo.
   A prateleira de sobras ganha buraco novo no meio do mutirao, e sem isto o
   operador com o retalho na mao nao consegue salvar: endereco e OBRIGATORIO
   na sobra. A alternativa nao era ele esperar a chefia — era ele empilhar o
   retalho num canto "para cadastrar depois", e o depois nao existe.
   O que nasce aqui entra marcado e cai na lista "Conferir" do cadastro. */
function fileira(rotulo,itens,selecionado,aoEscolher,novo){
  const f=el('div',{class:'fileira'});
  f.appendChild(el('span',{class:'rotulo',texto:rotulo}));
  if(!itens.length) f.appendChild(el('span',{class:'quem',style:'align-self:center',texto:'nada cadastrado'}));
  itens.forEach(i=>f.appendChild(el('button',{class:'op',texto:i.nome,
    'aria-pressed':String(String(i.valor)===String(selecionado)),
    onclick:()=>aoEscolher(i.valor)})));
  if(novo) f.appendChild(el('button',{class:'op',style:'border-style:dashed',
    texto:'+ '+novo.rotulo, onclick:async()=>{
      const nome=prompt(novo.pergunta);
      if(nome===null||!nome.trim()) return;
      try{
        const criado=await api(novo.rota,{metodo:'POST',corpo:{...novo.corpo,nome:nome.trim()}});
        banner(novo.rotulo+' "'+criado.nome+'" criada. A chefia confere depois.','bom',3);
        await novo.aoCriar(criado);
      }catch(e){}
    }}));
  return f;
}

/* ⚠️ A MEDIDA VIRA LISTA, E NAO CAMPO DIGITADO.
   O campo aceitava "1,90", "1.90" e "190", e so o terceiro e visivelmente
   errado. Os dois primeiros entram calados como numeros DIFERENTES conforme
   o teclado do tablet, e o defeito so aparece no plano de corte, com o
   tecido ja na mesa.

   A lista mata a classe inteira do problema: nao ha o que digitar errado.

   De centimetro em centimetro porque e a menor unidade que a bancada mede —
   milimetro em retalho de tecido e precisao que a fita nao tem, e dobraria a
   lista sem dobrar a verdade.

   O VALOR vai com PONTO (o que o servidor le) e o ROTULO com virgula (o que
   o operador le). Os dois no mesmo option, e por isso nao ha conversao no
   meio do caminho para dar errado. */
function listaMedida(min,max,valorAtual){
  const sel=el('select',{});
  sel.appendChild(el('option',{value:'',texto:'— escolha —'}));
  const cmMin=Math.round(min*100), cmMax=Math.round(max*100);
  for(let cm=cmMin; cm<=cmMax; cm++){
    const m=(cm/100).toFixed(2);
    sel.appendChild(el('option',{value:m, texto:m.replace('.',',')+' m'}));
  }
  // Nada vem pre-selecionado: medida ja marcada e medida que alguem salva sem
  // olhar, e ai o erro volta pela porta que a lista veio fechar.
  sel.value=valorAtual||'';
  return sel;
}

/* O TECIDO EM TRES FILEIRAS — linha, colecao, cor — e a mesma escolha no
   lancamento e na correcao. Uma derivacao so: duas copias divergiriam no dia
   em que uma passasse a esconder tecido inativo e a outra nao. */
function opcoesTecido(tecidos,tecidoId){
  const linhas=[], aberturas=[], cores=[];
  tecidos.filter(t=>t.ativo).forEach(t=>{
    if(!linhas.some(x=>x.valor===t.linha_id)) linhas.push({valor:t.linha_id,nome:t.linha_nome});
  });
  const sel=tecidos.find(t=>t.id===tecidoId);
  const linhaSel=sel?sel.linha_id:(linhas[0]&&linhas[0].valor);
  tecidos.filter(t=>t.ativo&&t.linha_id===linhaSel).forEach(t=>{
    if(!aberturas.some(x=>x.valor===t.abertura_id)) aberturas.push({valor:t.abertura_id,nome:t.abertura_nome});
  });
  const aberturaSel=sel&&sel.linha_id===linhaSel?sel.abertura_id:(aberturas[0]&&aberturas[0].valor);
  tecidos.filter(t=>t.ativo&&t.linha_id===linhaSel&&t.abertura_id===aberturaSel)
    .forEach(t=>cores.push({valor:t.cor_id,nome:t.cor_nome,tecido_id:t.id}));
  return {linhas,aberturas,cores,sel,linhaSel,aberturaSel};
}
// O tecido mais proximo da escolha: trocar de linha cai na primeira colecao
// e cor dela, trocar de colecao cai na primeira cor.
const tecidoPor=(tecidos,linha_id,abertura_id,cor_id)=>
  tecidos.find(x=>x.linha_id===linha_id&&x.abertura_id===abertura_id&&x.cor_id===cor_id)
  ||tecidos.find(x=>x.linha_id===linha_id&&x.abertura_id===abertura_id)
  ||tecidos.find(x=>x.linha_id===linha_id);
function fileirasTecido(pai,op,escolher){
  pai.appendChild(fileira('LINHA',op.linhas,op.linhaSel,v=>escolher(v,null,null)));
  pai.appendChild(fileira('COLECAO',op.aberturas,op.aberturaSel,v=>escolher(op.linhaSel,v,null)));
  pai.appendChild(fileira('COR',op.cores,op.sel?op.sel.cor_id:null,v=>escolher(op.linhaSel,op.aberturaSel,v)));
}

// ── LANCAR ───────────────────────────────────────────────────────────────
async function telaLancar(pai){
  estado.tecidos=await api('/api/tecidos');
  estado.condicoes=await api('/api/condicoes');
  estado.arvore=await api('/api/enderecos/SOBRA');
  // Uma vez por sessao: os limites nao mudam entre um retalho e o proximo.
  if(!estado.parametros){
    const ps=await api('/api/parametros');
    estado.parametros={}; ps.forEach(x=>{ estado.parametros[x.chave]=x.valor; });
  }
  estado.pendentes=await api('/api/etiquetas/pendentes');
  pai=limpar(pai);

  // Aviso de etiqueta: sem lote impresso, nao ha o que bipar.
  if(!estado.pendentes.length){
    const av=el('div',{class:'cartao'});
    av.appendChild(el('h2',{texto:'Nenhuma etiqueta livre'}));
    av.appendChild(el('p',{class:'nota',texto:
      'A sobra nasce quando voce bipa uma etiqueta que o sistema imprimiu. Imprima um lote antes de comecar o mutirao.'}));
    av.appendChild(el('a',{class:'bt primario',href:'/etiquetas',texto:'Imprimir etiquetas',
      style:'text-decoration:none;display:inline-flex;align-items:center'}));
    pai.appendChild(av);
  }

  const c=el('div',{class:'cartao'});
  pai.appendChild(c);

  /* 1. o codigo — o campo que manda na tela.
     ⚠️ ELE SOBREVIVE AO REDESENHO, como a medida. Trocar a condicao no meio
     do lancamento (o operador bipa, mede, e SO ENTAO ve a mancha) recria o
     formulario inteiro. Sem guardar, o codigo sumia calado — e o pior nao
     era perder o codigo: era a tela ficar com a medida preenchida e o codigo
     vazio, entao o operador apertava Salvar confiante e levava "Bipe a
     etiqueta" sem entender o que tinha acontecido. */
  const cod=el('input',{id:'codigo',type:'text',autocomplete:'off',autocorrect:'off',
    autocapitalize:'off',spellcheck:'false',placeholder:'bipe a etiqueta',
    value:estado.codigo||''});
  cod.addEventListener('input',()=>{ estado.codigo=cod.value; });
  const boxCod=el('div',{class:'campo cresce'});
  boxCod.appendChild(el('label',{texto:'CODIGO DA ETIQUETA'}));
  boxCod.appendChild(cod);
  c.appendChild(el('div',{class:'campos'},[boxCod]));

  const aviso=el('p',{class:'ajuda',texto:
    estado.pendentes.length+' etiqueta(s) impressa(s) esperando ser bipada(s).'});
  c.appendChild(aviso);

  // 2. o tecido, em tres fileiras de botoes
  const op=opcoesTecido(estado.tecidos,estado.tecido_id);
  const escolherTecido=(linha_id,abertura_id,cor_id)=>{
    const t=tecidoPor(estado.tecidos,linha_id,abertura_id,cor_id);
    if(t){ estado.tecido_id=t.id; memoria.set('tecido',t.id); }
    telaLancar($('#conteudo'));
  };
  fileirasTecido(c,op,escolherTecido);

  /* 3. as medidas — LISTA, nao campo digitado. Os limites saem de
     `parametro` (Cadastros -> Parametros), e nao do codigo: a bancada acha
     um retalho mais estreito que o minimo da lista e o operador escolhe o
     valor errado de proposito para conseguir salvar. */
  const P=estado.parametros||{};
  const larg=listaMedida(Number(P.sobraLarguraMin||0.5),Number(P.sobraLarguraMax||3),estado.larg);
  const alt =listaMedida(Number(P.sobraAlturaMin ||0.5),Number(P.sobraAlturaMax ||6),estado.alt);
  // O redesenho da tela recria os campos; sem guardar a escolha, trocar a
  // condicao ou o endereco apagaria a medida que o operador acabou de achar.
  larg.addEventListener('change',()=>{ estado.larg=larg.value; });
  alt .addEventListener('change',()=>{ estado.alt =alt.value;  });

  const medidas=el('div',{class:'campos medidas'});
  [['LARGURA (m)',larg],['ALTURA (m)',alt]].forEach(([r,input])=>{
    const b=el('div',{class:'campo cresce'});
    b.appendChild(el('label',{texto:r})); b.appendChild(input);
    medidas.appendChild(b);
  });
  c.appendChild(medidas);

  // 4. a condicao
  c.appendChild(fileira('CONDICAO',estado.condicoes.filter(x=>x.ativo).map(x=>({valor:x.chave,nome:x.nome})),
    estado.condicao,v=>{ estado.condicao=v; memoria.set('condicao',v); telaLancar($('#conteudo')); }));

  // 5. o endereco, tres fileiras encadeadas
  const hastes=estado.arvore.filter(h=>h.ativo).map(h=>({valor:h.id,nome:h.nome}));
  const hasteAtual=estado.arvore.find(h=>h.id===estado.haste_id)||estado.arvore[0];
  const andares=hasteAtual?hasteAtual.andares.filter(a=>a.ativo).map(a=>({valor:a.id,nome:a.nome})):[];
  const andarAtual=hasteAtual&&(hasteAtual.andares.find(a=>a.id===estado.andar_id)||hasteAtual.andares[0]);
  const niveis=andarAtual?andarAtual.niveis.filter(n=>n.ativo).map(n=>({valor:n.id,nome:n.nome})):[];

  // O que nasce aqui ja fica ESCOLHIDO: criar e ter de procurar o proprio
  // botao na fileira e o passo a mais que faz a bancada parar de usar.
  const novoEndereco=async(campo,criado)=>{
    estado.arvore=await api('/api/enderecos/SOBRA');
    if(campo==='haste'){ estado.haste_id=criado.id; estado.andar_id=null; estado.nivel_id=null; }
    if(campo==='andar'){ estado.andar_id=criado.id; estado.nivel_id=null; }
    if(campo==='nivel'){ estado.nivel_id=criado.id; memoria.set('nivel',criado.id); }
    await telaLancar($('#conteudo'));
  };

  c.appendChild(fileira('HASTE',hastes,hasteAtual&&hasteAtual.id,v=>{
    estado.haste_id=v; estado.andar_id=null; estado.nivel_id=null;
    memoria.set('haste',v); telaLancar($('#conteudo'));
  },{rotulo:'haste', pergunta:'Nome da haste nova de SOBRA (ex.: S4):',
     rota:'/api/hastes', corpo:{armazem_chave:'SOBRA'},
     aoCriar:x=>novoEndereco('haste',x)}));

  c.appendChild(fileira('ANDAR',andares,andarAtual&&andarAtual.id,v=>{
    estado.andar_id=v; estado.nivel_id=null; memoria.set('andar',v); telaLancar($('#conteudo'));
  },hasteAtual&&{rotulo:'andar', pergunta:'Nome do andar novo na haste '+hasteAtual.nome+' (ex.: 2):',
     rota:'/api/andares', corpo:{haste_id:hasteAtual.id},
     aoCriar:x=>novoEndereco('andar',x)}));

  c.appendChild(fileira('NIVEL',niveis,estado.nivel_id,v=>{
    estado.nivel_id=v; memoria.set('nivel',v); telaLancar($('#conteudo'));
  },andarAtual&&{rotulo:'nivel', pergunta:'Nome da posicao nova no andar '+andarAtual.nome+' (ex.: 3):',
     rota:'/api/niveis', corpo:{andar_id:andarAtual.id},
     aoCriar:x=>novoEndereco('nivel',x)}));

  // 6. salvar
  const acao=el('div',{class:'campos',style:'margin-top:8px;align-items:center'});
  const btSalvar=el('button',{class:'bt primario',style:'flex:1;min-height:64px;font-size:19px',
    texto:'Salvar e proxima'});
  acao.appendChild(btSalvar);
  acao.appendChild(el('span',{class:'contador',html:'nesta sessao<br><b>'+estado.naSessao+'</b> sobras'}));
  c.appendChild(acao);

  async function salvar(){
    const tecido=estado.tecidos.find(t=>t.id===estado.tecido_id);
    if(!cod.value.trim()) return faltou('Bipe a etiqueta.',cod);
    if(!tecido) return faltou('Escolha o tecido.',null);
    if(comoNumero(larg.value)===null) return faltou('Escolha a largura.',larg);
    if(comoNumero(alt.value)===null) return faltou('Escolha a altura.',alt);
    if(!estado.condicao) return faltou('Escolha a condicao.',null);
    if(!estado.nivel_id) return faltou('Escolha o endereco.',null);

    btSalvar.disabled=true;
    try{
      const s=await api('/api/sobras',{metodo:'POST',corpo:{
        codigo:cod.value, tecido_id:tecido.id,
        largura:larg.value, altura:alt.value,
        condicao:estado.condicao, nivel_id:estado.nivel_id, origem:'inventario'}});
      estado.naSessao++;
      estado.ultimas.unshift(s);
      beep();
      banner(s.codigo+' · '+formatarMedida(s.largura,s.altura)+' · '+formatarArea(s.area),'bom',3);
      // So o que muda de um retalho para o outro e limpo. Tecido, condicao e
      // endereco ficam — e por isso que da para catalogar uma prateleira
      // inteira sem sair da tela.
      cod.value=''; larg.value=''; alt.value='';
      estado.codigo=''; estado.larg=''; estado.alt='';
      await telaLancar($('#conteudo'));
    }catch(e){ beep('erro'); cod.select(); }
    btSalvar.disabled=false;
  }
  function faltou(msg,campo){ banner(msg,'alerta',3); beep('erro'); if(campo) campo.focus(); }

  btSalvar.onclick=salvar;

  // O leitor manda Enter ou Tab e as vezes pica o codigo. Aceitamos os dois e
  // pulamos para a largura; Enter na altura salva.
  const pula=(de,para)=>de.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key==='Tab'){ ev.preventDefault(); para.focus(); para.select&&para.select(); }
  });
  pula(cod,larg); pula(larg,alt);
  alt.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); salvar(); } });

  // O foco volta sempre para o codigo — e onde o proximo retalho comeca.
  if(!document.activeElement||document.activeElement===document.body) cod.focus();

  // As ultimas lancadas, para conferir de relance sem trocar de aba.
  if(estado.ultimas.length){
    const cU=el('div',{class:'cartao'});
    cU.appendChild(el('h2',{texto:'Ultimas nesta sessao'}));
    const t=el('table',{});
    estado.ultimas.slice(0,8).forEach(s=>t.appendChild(el('tr',{},[
      el('td',{texto:s.codigo}),
      el('td',{texto:[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:formatarMedida(s.largura,s.altura)}),
      el('td',{class:'num',texto:formatarArea(s.area)}),
      el('td',{class:'quem',texto:s.endereco||''})
    ])));
    cU.appendChild(t);
    pai.appendChild(cU);
  }

  // O resumo do tecido escolhido, no cabecalho.
  const resumo=await api('/api/sobras/resumo');
  const r=resumo.find(x=>x.tecido_id===estado.tecido_id);
  $('#resumoTecido').textContent=r?(r.sobras+' sobras · '+formatarArea(r.area)):'';
}

// ── CATALOGO ─────────────────────────────────────────────────────────────
async function telaLista(pai){
  const sobras=await api('/api/sobras?status=disponivel');
  const resumo=await api('/api/sobras/resumo');
  const pendentes=await api('/api/etiquetas/pendentes');
  pai=limpar(pai);

  const podeCorrigirAqui=(eu.permissoes||[]).includes('sobra.corrigir');
  const comSobra=resumo.filter(r=>r.sobras>0);
  const cR=el('div',{class:'cartao'});
  cR.appendChild(el('h2',{texto:'Sobras por tecido'}));
  cR.appendChild(el('p',{class:'nota',texto:'Em m², por tipo e cor — o numero que evita comprar tecido que ja esta na prateleira.'}));

  /* QUANTO VALE O ACERVO. A soma e das MESMAS linhas da tabela, e a sobra
     sem preco fica fora dela: o total sai como PISO (>=) enquanto houver
     alguma, com o numero de quantas faltam. Zero aqui seria mentira com cara
     de economia (regra 2 do custo.js). */
  if(podeCusto()&&comSobra.length){
    const total=comSobra.reduce((s,r)=>s+(r.valor||0),0);
    const semPreco=comSobra.reduce((s,r)=>s+(r.sobras_sem_preco||0),0);
    const comPreco=comSobra.some(r=>r.valor!=null);
    cR.appendChild(el('p',{style:'font-size:22px;margin:4px 0 10px',html:
      (comPreco?'<b>'+(semPreco?'≥ ':'')+dinheiro(total)+'</b> em sobras':'<b>—</b> nenhuma sobra com preco ainda')+
      (semPreco?' <span class="quem">· '+semPreco+' sobra(s) sem preco — o total e o MINIMO. Lance o preco por tecido no botao de cada linha.</span>':'')}));
  }

  const tR=el('table',{});
  tR.appendChild(el('tr',{},[el('th',{texto:'Tecido'}),el('th',{class:'num',texto:'Sobras'}),el('th',{class:'num',texto:'Area'}),
    ...(podeCusto()?[el('th',{class:'num',texto:'Valor'}),el('th',{texto:''})]:[])]));
  comSobra.forEach(r=>{
    const celulas=[
      el('td',{texto:[r.linha_nome,r.abertura_nome,r.cor_nome].join(' · ')}),
      el('td',{class:'num',texto:String(r.sobras)}),
      el('td',{class:'num',texto:formatarArea(r.area)})
    ];
    if(podeCusto()){
      // Sem nenhuma sobra com preco: traco. Com algumas: piso, e o titulo diz
      // quantas faltam. Todas com preco: o numero exato.
      celulas.push(el('td',{class:'num'+(r.sobras_sem_preco?' aviso':''),
        texto:r.valor==null?'—':(r.sobras_sem_preco?'≥ ':'')+dinheiro(r.valor),
        title:r.sobras_sem_preco?r.sobras_sem_preco+' de '+r.sobras+' sobra(s) sem preco ('+formatarArea(r.area_sem_preco)+')':'todas com preco'}));
      celulas.push(el('td',{style:'text-align:right;white-space:nowrap'},podeCorrigirAqui?[
        el('button',{class:'bt pequeno',texto:r.sobras_sem_preco?'Preco ⚠':'Preco',
          title:'lancar o preco do m² nas sobras deste tecido',
          onclick:()=>{ estado.precificando=r.tecido_id; telaLista($('#conteudo')); }})]:[]));
    }
    tR.appendChild(el('tr',{},celulas));
  });
  cR.appendChild(comSobra.length?tR:el('div',{class:'vazio',texto:'Nenhuma sobra catalogada ainda.'}));
  pai.appendChild(cR);

  // O cartao de preco abre logo abaixo do resumo, para a linha continuar a vista.
  if(estado.precificando){
    const r=comSobra.find(x=>x.tecido_id===estado.precificando);
    if(r&&podeCusto()&&podeCorrigirAqui) await cartaoPreco(pai,r);
    else estado.precificando=null;
  }

  const cP=el('div',{class:'cartao'});
  cP.appendChild(el('h2',{texto:'Etiquetas impressas e ainda nao bipadas'}));
  cP.appendChild(el('p',{class:'nota',texto:
    'Nao e palpite sobre lacunas: e o que o sistema imprimiu menos o que voltou da bancada.'}));
  cP.appendChild(pendentes.length
    ? el('p',{texto:pendentes.length+' esperando — da '+pendentes[0].codigo+' em diante.'})
    : el('div',{class:'vazio',texto:'Nenhuma etiqueta solta.'}));
  pai.appendChild(cP);

  const podeCorrigir=(eu.permissoes||[]).includes('sobra.corrigir');
  const podePropor=(eu.permissoes||[]).includes('sobra.propor');

  // O QUE A BANCADA APONTOU, para a chefia decidir — em cima de tudo, porque
  // e trabalho esperando gente. Some inteiro quando nao ha nada: um cartao
  // permanente escrito "nada apontado" ensina o olho a pular a regiao.
  if(podeCorrigir){
    const pend=await api('/api/sobras/propostas');
    if(pend.length) cartaoApontamentos(pai,pend);
  }

  // O cartao de correcao abre ACIMA da tabela, como a nota do rolo: a linha
  // continua visivel embaixo, e cancelar volta para onde a pessoa estava.
  if(estado.corrigindo){
    const s=sobras.find(x=>x.id===estado.corrigindo.id);
    if(s) await cartaoCorrigir(pai,s,estado.corrigindo.modo);
    else estado.corrigindo=null;
  }

  const c=el('div',{class:'cartao'});
  c.appendChild(el('h2',{texto:'Catalogo ('+sobras.length+' disponiveis)'}));

  /* ACHAR A SOBRA PELO BIPE. Com centenas de linhas, "corrigir a S-000142" e
     primeiro achar a S-000142 — e o operador esta com a etiqueta na mao. O
     campo filtra a tabela sem redesenhar nada, por codigo ou pelo nome do
     tecido, e aceita o que o leitor mandar (Enter, Tab, espaco no meio). */
  const busca=el('input',{type:'text',autocomplete:'off',autocorrect:'off',autocapitalize:'off',
    spellcheck:'false',placeholder:'bipe a etiqueta ou digite o tecido para filtrar',
    style:'font-size:20px;min-height:52px',value:estado.filtro||''});
  const boxBusca=el('div',{class:'campo cresce'});
  boxBusca.appendChild(el('label',{texto:'PROCURAR'}));
  boxBusca.appendChild(busca);
  c.appendChild(el('div',{class:'campos'},[boxBusca]));

  // O leitor manda o codigo com Tab, espaco ou quebra no meio, e o hifen do
  // S-000142 pode vir ou nao. A MESMA regua nos dois lados: so letra e
  // numero contam, e tudo o mais vira espaco. Regua diferente para a linha e
  // para o que foi digitado e o que faria a busca nao achar o que esta ali.
  const normalizar=t=>String(t||'').toLowerCase().replace(/[^a-z0-9à-ÿ]+/g,' ').trim();
  const t=el('table',{});
  t.appendChild(el('tr',{},[el('th',{texto:'Etiqueta'}),el('th',{texto:'Tecido'}),
    el('th',{class:'num',texto:'Medida'}),el('th',{class:'num',texto:'Area'}),
    el('th',{texto:'Condicao'}),el('th',{texto:'Endereco'}),
    ...(podeCusto()?[el('th',{class:'num',texto:'Valor'})]:[]),
    el('th',{class:'num',texto:'Parada'}),el('th',{texto:''})]));
  const linhas=[];
  sobras.forEach(s=>{
    const acoes=[];
    /* Quem corrige ve "Corrigir"; quem so aponta ve "Apontar erro" — e nao ve
       nada enquanto ha um apontamento esperando: a segunda pessoa a achar a
       mesma sobra errada fala com a primeira, em vez de abrir outro. */
    if(podeCorrigir) acoes.push(el('button',{class:'bt pequeno',texto:'Corrigir',
      onclick:()=>{ estado.corrigindo={id:s.id,modo:'corrigir'}; telaLista($('#conteudo')); }}));
    else if(podePropor&&!s.propostas_pendentes) acoes.push(el('button',{class:'bt pequeno',texto:'Apontar erro',
      onclick:()=>{ estado.corrigindo={id:s.id,modo:'propor'}; telaLista($('#conteudo')); }}));
    if(eu.papel==='diretor') acoes.push(el('button',{class:'bt pequeno perigo',texto:'Descartar',onclick:async()=>{
      const motivo=prompt('Por que a sobra '+s.codigo+' esta sendo descartada?');
      if(!motivo) return;
      await api('/api/sobras/'+s.id+'/descartar',{metodo:'POST',corpo:{motivo}});
      banner('Sobra descartada — a perda ficou medida no refugo.','alerta');
      await telaLista($('#conteudo'));
    }}));
    const nomeTecido=[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ');
    // A sobra ja corrigida fica marcada: quem le a lista sabe que aquela
    // linha ja foi outra coisa, e o historico esta a um toque no Corrigir.
    const celCod=el('td',{},[s.codigo]);
    if(s.propostas_pendentes) celCod.appendChild(el('span',{class:'tag rolo',style:'margin-left:8px',
      title:'a bancada apontou um erro nesta sobra; a chefia ainda nao decidiu',
      texto:'aguardando chefia'}));
    if(s.correcoes) celCod.appendChild(el('span',{class:'tag sobra',style:'margin-left:8px',
      title:s.correcoes+' correcao(oes) — abra a sobra para ver o historico',
      texto:'corrigida'}));
    const tr=el('tr',{},[
      celCod,
      el('td',{texto:nomeTecido}),
      el('td',{class:'num',texto:formatarMedida(s.largura,s.altura)}),
      el('td',{class:'num',texto:formatarArea(s.area)}),
      el('td',{texto:s.condicao_nome||s.condicao}),
      // O endereco e para que a sobra exista: sem ele a linha diz o que a
      // peca e, e nao onde esta. Vem do servidor no formato unico.
      el('td',{style:'white-space:nowrap',texto:s.endereco||''}),
      // Sem preco, traco — nunca R$ 0,00. O preco do m² vai no titulo.
      ...(podeCusto()?[el('td',{class:'num',texto:dinheiro(s.valor),
        title:s.preco_m2==null?'sem preco lancado':('R$ '+num(s.preco_m2)+'/m²')})]:[]),
      el('td',{class:'num',texto:s.dias_parada+' d'}),
      el('td',{style:'text-align:right;white-space:nowrap'},acoes)
    ]);
    // A busca acha tambem pelo endereco: "S1 2" lista a prateleira inteira.
    tr.dataset.busca=normalizar(s.codigo+' '+nomeTecido+' '+(s.endereco||''));
    linhas.push(tr); t.appendChild(tr);
  });
  const filtrar=()=>{
    estado.filtro=busca.value;
    const partes=normalizar(busca.value).split(' ').filter(Boolean);
    linhas.forEach(tr=>{ tr.hidden=partes.some(p=>!tr.dataset.busca.includes(p)); });
  };
  busca.addEventListener('input',filtrar);
  busca.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key==='Tab'){ ev.preventDefault(); filtrar(); } });
  filtrar();
  c.appendChild(sobras.length?t:el('div',{class:'vazio',texto:'Nada catalogado ainda.'}));
  pai.appendChild(c);
}

/* ── O PRECO DO M² DE UM TECIDO, nas sobras dele ─────────────────────────
   O mutirao catalogou centenas de retalhos sem preco; lancar um a um nao
   acontece. Aqui a chefia diz quanto vale o m² do tecido e o numero entra em
   cada sobra que AINDA NAO TEM preco — a que ja tem (herdada do rolo, ou
   lancada antes) fica, porque aquele foi o que se pagou. "Substituir" passa
   por cima de todas, para o dia em que o preco lancado estava errado.

   O que pre-preenche e o ULTIMO PRECO PAGO por rolo desse tecido — a mesma
   fonte da nota do rolo, e nao uma tabela: tabela envelhece calada. */
async function cartaoPreco(pai,r){
  const nome=[r.linha_nome,r.abertura_nome,r.cor_nome].join(' · ');
  const c=el('div',{class:'cartao',style:'border-color:var(--acao)'});
  c.appendChild(el('h2',{texto:'Preco do m² — '+nome}));
  c.appendChild(el('p',{class:'nota',texto:
    r.sobras+' sobra(s) disponivel(is), '+formatarArea(r.area)+' no total. '+
    (r.sobras_sem_preco?r.sobras_sem_preco+' sem preco ('+formatarArea(r.area_sem_preco)+').':'Todas ja tem preco.')}));

  const preco=el('input',{type:'text',inputmode:'decimal',autocomplete:'off',placeholder:'ex.: 18,50',
    style:'font-size:22px;min-height:56px'});
  const dica=el('p',{class:'ajuda'});
  try{
    const u=await api('/api/rolos/ultimo-preco?tecido_id='+r.tecido_id,{silencioso:true});
    if(u&&u.preco!=null){
      preco.value=num(u.preco);
      dica.textContent='Ultimo pago por rolo deste tecido: '+dinheiro(u.preco)+'/m² em '+String(u.quando).slice(0,10)+
        (u.de_outro_fornecedor?' ('+u.de_outro_fornecedor+')':'')+'. Mude se a sobra vale outra coisa.';
    } else dica.textContent='Nenhum rolo deste tecido tem preco lancado — nao ha sugestao.';
  }catch(e){ dica.textContent=''; }

  const subst=el('input',{type:'checkbox',id:'substPreco'});
  const previa=el('p',{class:'ajuda'});
  const recalcular=()=>{
    const p=comoNumero(preco.value);
    const n=subst.checked?r.sobras:r.sobras_sem_preco;
    const area=subst.checked?r.area:r.area_sem_preco;
    previa.textContent=p>0&&n
      ? 'Vai entrar em '+n+' sobra(s): '+formatarArea(area)+' × '+dinheiro(p)+'/m² = '+dinheiro(area*p)+'.'
      : (n?'':'Nenhuma sobra sem preco — marque "substituir" para trocar o preco de todas.');
  };
  preco.addEventListener('input',recalcular); subst.addEventListener('change',recalcular); recalcular();

  const campo=el('div',{class:'campo'}); campo.appendChild(el('label',{texto:'R$ POR M²'})); campo.appendChild(preco);
  c.appendChild(el('div',{class:'campos'},[campo]));
  c.appendChild(dica);
  const rot=el('label',{style:'display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0'},[subst,
    'substituir tambem o preco das sobras que ja tem (o herdado do rolo fica para tras)']);
  c.appendChild(rot);
  c.appendChild(previa);

  const bt=el('button',{class:'bt primario',style:'min-height:56px',texto:'Aplicar'});
  bt.onclick=async()=>{
    if(comoNumero(preco.value)===null) return banner('Diga o preco do metro quadrado.','alerta',3);
    bt.disabled=true;
    try{
      const d=await api('/api/sobras/precificar',{metodo:'POST',corpo:{
        tecido_id:r.tecido_id, preco_m2:preco.value, substituir:subst.checked}});
      beep();
      banner(d.sobras?dinheiro(d.preco_m2)+'/m² lancado em '+d.sobras+' sobra(s) de '+d.tecido+'.'
                     :'Nenhuma sobra recebeu preco — todas ja tinham.', d.sobras?'bom':'alerta',5);
      estado.precificando=null;
      await telaLista($('#conteudo'));
    }catch(e){ beep('erro'); bt.disabled=false; }
  };
  c.appendChild(el('div',{class:'campos'},[bt,
    el('button',{class:'bt',texto:'Cancelar',onclick:()=>{ estado.precificando=null; telaLista($('#conteudo')); }})]));
  pai.appendChild(c);
}

/* ── O QUE A BANCADA APONTOU — a fila de decisao da chefia ───────────────
   Cada apontamento diz a sobra, como ela esta hoje, o que a bancada acha que
   e (de -> para, por campo), o motivo e quem apontou. Aceitar vira correcao
   pelo mesmo caminho do botao Corrigir; recusar pede motivo, porque quem
   apontou vai ler a resposta na propria sobra. */
function cartaoApontamentos(pai,pend){
  const c=el('div',{class:'cartao',style:'border-color:var(--alerta)'});
  c.appendChild(el('h2',{texto:'Apontado pela bancada — '+pend.length+' sobra(s) esperando decisao'}));
  c.appendChild(el('p',{class:'nota',texto:
    'A bancada nao corrige a sobra: ela aponta o que viu com o retalho na mao, e a correcao so acontece quando voce aceita. Recusar pede motivo — quem apontou le a resposta na sobra.'}));
  pend.forEach(p=>{
    const bloco=el('div',{style:'border-top:1px solid var(--linha);padding:12px 0'});
    bloco.appendChild(el('p',{style:'margin:0 0 6px',html:
      '<b>'+p.sobra_codigo+'</b> · hoje: '+p.sobra_tecido+' · '+formatarMedida(p.sobra_largura,p.sobra_altura)+
      ' · '+p.sobra_condicao+' · '+p.sobra_endereco}));
    const t=el('table',{});
    p.itens.forEach(i=>t.appendChild(el('tr',{},[
      el('td',{texto:i.campo}),
      el('td',{texto:fmtVal(i.campo,i.de)}),
      el('td',{texto:'→'}),
      el('td',{},[el('b',{texto:fmtVal(i.campo,i.para)})])
    ])));
    bloco.appendChild(t);
    bloco.appendChild(el('p',{class:'ajuda',texto:
      (p.motivo?'"'+p.motivo+'" — ':'')+'apontado por '+(p.criado_por||'?')+' em '+String(p.criado_em).slice(0,16)}));
    const btOk=el('button',{class:'bt primario pequeno',texto:'Aceitar',onclick:async()=>{
      btOk.disabled=true;
      try{
        const r=await api('/api/sobras/propostas/'+p.id+'/aceitar',{metodo:'POST'});
        beep();
        banner(p.sobra_codigo+(r.mudancas.length
          ? ' corrigida: '+r.mudancas.map(m=>fmtMud(m)).join(' · ')
          : ': aceito, mas a sobra ja estava assim'),'bom',6);
        await telaLista($('#conteudo'));
      }catch(e){ beep('erro'); btOk.disabled=false; }
    }});
    const btNao=el('button',{class:'bt pequeno perigo',texto:'Recusar',onclick:async()=>{
      const motivo=prompt('Por que o apontamento da '+p.sobra_codigo+' esta sendo recusado? Quem apontou vai ler.');
      if(!motivo||!motivo.trim()) return;
      try{
        await api('/api/sobras/propostas/'+p.id+'/recusar',{metodo:'POST',corpo:{motivo}});
        banner('Apontamento da '+p.sobra_codigo+' recusado — a sobra ficou como estava.','alerta',4);
        await telaLista($('#conteudo'));
      }catch(e){ beep('erro'); }
    }});
    const btVer=el('button',{class:'bt pequeno',texto:'Abrir sobra',
      onclick:()=>{ estado.corrigindo={id:p.sobra_id,modo:'corrigir'}; telaLista($('#conteudo')); }});
    bloco.appendChild(el('div',{class:'campos',style:'margin-top:6px'},[btOk,btNao,btVer]));
    c.appendChild(bloco);
  });
  pai.appendChild(c);
}

/* ── CORRIGIR (chefia) OU APONTAR (bancada) A SOBRA LANCADA ERRADA ────────
   O caso que motivou: o mutirao lembra o tecido entre um retalho e o
   seguinte, e o primeiro da prateleira nova entra com a cor do anterior. Ate
   aqui a unica saida era o descarte — da chefia, e medindo como perda uma
   peca que esta inteira na prateleira.

   O MESMO cartao serve aos dois: mostra o que a sobra E hoje e abre os
   seletores do lancamento, ja marcados com o valor atual. No modo 'corrigir'
   salvar grava; no modo 'propor' salvar so APONTA — nada muda na sobra ate a
   chefia aceitar, e a bancada diz o que viu num campo de motivo. Dois
   cartoes diferentes ensinariam a equipe a achar que sao duas coisas.

   O servidor grava (ou guarda) so o que mudou e responde dizendo o que foi —
   e e isso que o aviso repete, para a pessoa conferir que consertou (ou
   apontou) o que queria. O codigo (a etiqueta colada) nao se edita: ele e o
   que liga o papel a linha, e trocar isso e outra sobra. */
async function cartaoCorrigir(pai,s,modo){
  const propondo=modo==='propor';
  if(!estado.tecidos.length) estado.tecidos=await api('/api/tecidos');
  if(!estado.condicoes.length) estado.condicoes=await api('/api/condicoes');
  estado.arvore=await api('/api/enderecos/SOBRA');
  if(!estado.parametros){
    const ps=await api('/api/parametros');
    estado.parametros={}; ps.forEach(x=>{ estado.parametros[x.chave]=x.valor; });
  }
  const historico=await api('/api/sobras/'+s.id+'/correcoes');
  const apontamentos=await api('/api/sobras/'+s.id+'/propostas');

  // O estado da edicao e LOCAL do cartao: mexer aqui nao pode trocar o tecido
  // lembrado pelo mutirao na aba de lancar.
  const nivelAtual=(function(){
    for(const h of estado.arvore) for(const a of h.andares) for(const n of a.niveis)
      if(n.id===s.nivel_id) return {haste_id:h.id,andar_id:a.id,nivel_id:n.id};
    return {haste_id:null,andar_id:null,nivel_id:s.nivel_id};
  })();
  const ed={tecido_id:s.tecido_id, larg:Number(s.largura).toFixed(2), alt:Number(s.altura).toFixed(2),
    condicao:s.condicao, ...nivelAtual};

  const c=el('div',{class:'cartao',style:'border-color:var(--acao)'});
  pai.appendChild(c);

  function montar(){
    limpar(c);
    c.appendChild(el('h2',{texto:(propondo?'Apontar erro na sobra ':'Corrigir sobra ')+s.codigo}));
    if(propondo) c.appendChild(el('p',{class:'nota',texto:
      'Marque como a sobra deveria estar. Nada muda agora: a chefia recebe o apontamento, confere e aceita ou recusa — e a resposta aparece nesta sobra.'}));
    c.appendChild(el('p',{class:'nota',texto:'Hoje: '+[s.linha_nome,s.abertura_nome,s.cor_nome].join(' · ')+
      '  ·  '+formatarMedida(s.largura,s.altura)+'  ·  '+(s.condicao_nome||s.condicao)+
      (s.endereco?'  ·  '+s.endereco:'')+
      '  ·  lancada por '+(s.criado_por||'?')+' em '+String(s.criado_em).slice(0,10)}));

    // 1. o tecido
    const op=opcoesTecido(estado.tecidos,ed.tecido_id);
    fileirasTecido(c,op,(linha_id,abertura_id,cor_id)=>{
      const t=tecidoPor(estado.tecidos,linha_id,abertura_id,cor_id);
      if(t) ed.tecido_id=t.id;
      montar();
    });

    // 2. as medidas — a mesma lista do lancamento, ja no valor de hoje. Se a
    // medida atual estiver fora do alcance da lista, ela entra como opcao
    // extra: senao o cartao mostraria "— escolha —" para uma medida que
    // existe, e salvar cobraria a medida que a pessoa nao veio mudar.
    const P=estado.parametros||{};
    const larg=listaMedida(Number(P.sobraLarguraMin||0.5),Number(P.sobraLarguraMax||3),ed.larg);
    const alt =listaMedida(Number(P.sobraAlturaMin ||0.5),Number(P.sobraAlturaMax ||6),ed.alt);
    [[larg,ed.larg],[alt,ed.alt]].forEach(([sel,v])=>{
      if(sel.value!==v){ sel.appendChild(el('option',{value:v,texto:v.replace('.',',')+' m (atual)'})); sel.value=v; }
    });
    larg.addEventListener('change',()=>{ ed.larg=larg.value; });
    alt .addEventListener('change',()=>{ ed.alt =alt.value;  });
    const medidas=el('div',{class:'campos medidas'});
    [['LARGURA (m)',larg],['ALTURA (m)',alt]].forEach(([r,input])=>{
      const b=el('div',{class:'campo cresce'});
      b.appendChild(el('label',{texto:r})); b.appendChild(input);
      medidas.appendChild(b);
    });
    c.appendChild(medidas);

    // 2b. o preco do m² — so na correcao, e so para quem ve custo. A bancada
    // nao recebe o campo no JSON, entao nao tem o que mostrar nem apontar.
    let preco=null;
    if(!propondo&&podeCusto()){
      preco=el('input',{type:'text',inputmode:'decimal',autocomplete:'off',
        value:s.preco_m2==null?'':num(s.preco_m2),placeholder:'sem preco',
        style:'font-size:18px;min-height:52px'});
      const b=el('div',{class:'campo'});
      b.appendChild(el('label',{texto:'R$ POR M²'})); b.appendChild(preco);
      c.appendChild(el('div',{class:'campos'},[b,
        el('p',{class:'ajuda',style:'align-self:center',texto:
          s.preco_m2==null?'Sem preco esta sobra fica fora da soma do acervo — contada a parte, nunca como zero.'
                          :'Vale '+dinheiro(s.valor)+' hoje ('+formatarArea(s.area)+').'})]));
    }

    // 3. a condicao
    c.appendChild(fileira('CONDICAO',estado.condicoes.filter(x=>x.ativo||x.chave===ed.condicao)
      .map(x=>({valor:x.chave,nome:x.nome})),ed.condicao,v=>{ ed.condicao=v; montar(); }));

    // 4. o endereco
    const hastes=estado.arvore.filter(h=>h.ativo).map(h=>({valor:h.id,nome:h.nome}));
    const hasteAtual=estado.arvore.find(h=>h.id===ed.haste_id);
    const andares=hasteAtual?hasteAtual.andares.filter(a=>a.ativo).map(a=>({valor:a.id,nome:a.nome})):[];
    const andarAtual=hasteAtual&&hasteAtual.andares.find(a=>a.id===ed.andar_id);
    const niveis=andarAtual?andarAtual.niveis.filter(n=>n.ativo).map(n=>({valor:n.id,nome:n.nome})):[];
    c.appendChild(fileira('HASTE',hastes,ed.haste_id,v=>{ ed.haste_id=v; ed.andar_id=null; ed.nivel_id=null; montar(); }));
    c.appendChild(fileira('ANDAR',andares,ed.andar_id,v=>{ ed.andar_id=v; ed.nivel_id=null; montar(); }));
    c.appendChild(fileira('NIVEL',niveis,ed.nivel_id,v=>{ ed.nivel_id=v; montar(); }));

    // 5. o motivo (so ao apontar) e salvar / cancelar
    let motivo=null;
    if(propondo){
      motivo=el('input',{type:'text',autocomplete:'off',placeholder:'o que voce viu (ex.: veio bege, e cinza)',
        value:ed.motivo||'',style:'font-size:18px;min-height:52px'});
      motivo.addEventListener('input',()=>{ ed.motivo=motivo.value; });
      const b=el('div',{class:'campo cresce'});
      b.appendChild(el('label',{texto:'MOTIVO (a chefia le isto)'})); b.appendChild(motivo);
      c.appendChild(el('div',{class:'campos'},[b]));
    }
    const bt=el('button',{class:'bt primario',style:'min-height:56px',
      texto:propondo?'Enviar para a chefia':'Salvar correcao'});
    bt.onclick=async()=>{
      if(!ed.tecido_id) return faltou('Escolha o tecido.');
      if(comoNumero(larg.value)===null) return faltou('Escolha a largura.');
      if(comoNumero(alt.value)===null) return faltou('Escolha a altura.');
      if(!ed.condicao) return faltou('Escolha a condicao.');
      if(!ed.nivel_id) return faltou('Escolha o endereco.');
      bt.disabled=true;
      const corpo={tecido_id:ed.tecido_id, largura:larg.value, altura:alt.value,
        condicao:ed.condicao, nivel_id:ed.nivel_id};
      if(preco&&preco.value.trim()) corpo.preco_m2=preco.value;
      try{
        if(propondo){
          const p=await api('/api/sobras/'+s.id+'/propostas',{metodo:'POST',corpo:{...corpo,motivo:motivo.value}});
          beep();
          banner(s.codigo+' apontada para a chefia: '+p.itens.map(m=>fmtMud(m)).join(' · '),'bom',6);
        }else{
          const r=await api('/api/sobras/'+s.id,{metodo:'PUT',corpo});
          if(!r.mudancas.length){ banner('Nada mudou na sobra '+s.codigo+'.','alerta',3); }
          else{
            beep();
            banner(s.codigo+' corrigida: '+r.mudancas.map(m=>fmtMud(m)).join(' · '),'bom',6);
          }
        }
        estado.corrigindo=null;
        await telaLista($('#conteudo'));
      }catch(e){ beep('erro'); bt.disabled=false; }
    };
    const cancelar=el('button',{class:'bt',texto:'Cancelar',
      onclick:()=>{ estado.corrigindo=null; telaLista($('#conteudo')); }});
    c.appendChild(el('div',{class:'campos',style:'margin-top:8px'},[bt,cancelar]));

    // 6. o que ja foi corrigido nesta sobra — a memoria da linha. Quando a
    // correcao nasceu de um apontamento, diz quem apontou e quem aceitou.
    if(historico.length){
      c.appendChild(el('h2',{style:'margin-top:16px',texto:'Correcoes anteriores'}));
      const t=el('table',{});
      historico.forEach(h=>t.appendChild(el('tr',{},[
        el('td',{texto:String(h.criado_em).slice(0,16)}),
        el('td',{texto:h.campo}),
        el('td',{texto:fmtMud(h)}),
        el('td',{class:'quem',texto:h.proposto_por
          ? 'apontado por '+h.proposto_por+', aceito por '+(h.usuario_nome||'?')
          : (h.usuario_nome||'')})
      ])));
      c.appendChild(t);
    }

    // 7. os apontamentos — pendentes, aceitos e recusados. E AQUI que a
    // bancada le a decisao da chefia, e o motivo quando foi "nao".
    if(apontamentos.length){
      c.appendChild(el('h2',{style:'margin-top:16px',texto:'Apontamentos da bancada'}));
      const t=el('table',{});
      apontamentos.forEach(p=>{
        const estadoTxt=p.status==='pendente'?'aguardando chefia'
          :p.status==='aceita'?'aceito por '+(p.decidido_por||'?')+' em '+String(p.decidido_em||'').slice(0,16)
          :'recusado por '+(p.decidido_por||'?')+(p.decisao_motivo?': "'+p.decisao_motivo+'"':'');
        t.appendChild(el('tr',{},[
          el('td',{texto:String(p.criado_em).slice(0,16)}),
          el('td',{texto:p.itens.map(i=>i.campo+' → '+fmtVal(i.campo,i.para)).join(' · ')}),
          el('td',{class:'quem',texto:(p.criado_por||'?')+(p.motivo?': "'+p.motivo+'"':'')}),
          el('td',{},[el('span',{class:'tag '+(p.status==='pendente'?'rolo':p.status==='aceita'?'bom':'off'),
            texto:estadoTxt})])
        ]));
      });
      c.appendChild(t);
    }
  }
  function faltou(msg){ banner(msg,'alerta',3); beep('erro'); }
  montar();
  c.scrollIntoView({block:'start',behavior:'smooth'});
}

(async function(){
  eu=await api('/api/eu');
  desenhar();
})();
</script>
</body>
</html>
